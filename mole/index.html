<!DOCTYPE html>
<!--
  【民眾版 V2】情境化開場、極簡設定與校正、結束後才談復健效果。
  治療師版（患側／靈敏度／臨床報表）請看同資料夾的 打地鼠.html。

  2026-07-27 v2 民眾版：公雞 go/no-go（別打）＋難度計分差異＋30/45/60 秒。

  美術素材授權（2026-07-21 改版起）
  ・角色與道具（地鼠／山豬／槌子／爆炸／太陽）：Microsoft Fluent Emoji — MIT License
    https://github.com/microsoft/fluentui-emoji
  ・場景元素（樹／草／雲／柵欄）：Kenney.nl "Background Elements" — CC0 1.0（公眾領域）
    https://kenney.nl/assets/background-elements
  兩者皆可自由修改與商業使用；MIT 需在專案內保留授權文字（即本段），CC0 無任何限制。
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>趕走山豬 · 農場大作戰</title>
<meta name="description" content="職能治療師設計的體感小遊戲：打開鏡頭、揮手把闖進農場的山豬打回洞裡。不用買設備、不用穿戴，手機或電腦就能玩。影像只在你的裝置上運算，不上傳也不儲存。">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="復能小遊戲">
<meta property="og:title" content="趕走山豬 · 農場大作戰">
<meta property="og:description" content="打開鏡頭、揮手把山豬打回洞裡！不用設備，手機或電腦就能玩的體感小遊戲。">
<meta property="og:url" content="https://games.otshih.com/mole/">
<meta property="og:image" content="https://games.otshih.com/mole/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#101418; --panel:#1b2027; --panel2:#232a33;
    --ink:#f4efe3; --sub:#a7b0bb; --line:#333d48;
    --accent:#f4b942; --good:#4cc38a; --affected:#ff7a59; --blue:#5aa9e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;overflow:hidden;
    /* 手機：玩的時候全程不碰螢幕，但誤觸不能讓畫面捲動／縮放／下拉重整 */
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  /* 用 dvh：手機瀏覽器網址列收合時 100vh 會超出可視高度，畫面底部被吃掉 */
  #game{position:relative;width:100vw;height:100vh;height:100dvh;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;}

  #hud{position:absolute;top:0;left:0;right:0;padding:14px 18px;
    padding-top:max(14px,env(safe-area-inset-top));            /* iPhone 瀏海／動態島 */
    padding-left:max(18px,env(safe-area-inset-left));
    padding-right:max(18px,env(safe-area-inset-right));
    display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;pointer-events:none;z-index:5;}
  .stat{background:rgba(20,25,31,.82);
    border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:92px;}
  .stat .k{font-size:12px;color:var(--sub);letter-spacing:.5px;}
  .stat .v{font-size:26px;font-weight:800;line-height:1.1;}
  .stat.affected .v{color:var(--affected);}
  .stat.time .v{color:var(--blue);}
  #hud .spacer{flex:1;}
  .hud-btn{pointer-events:auto;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;}
  .hud-btn:hover{background:#2c3542;}

  /* ===== 手機／橫向小螢幕：HUD 壓成一條 =====
     桌機（治療師看）維持完整六格；手機（長輩自己玩）只留分數與剩餘時間，
     其餘臨床指標本來就會在結束報表裡完整呈現。
     原因：375px 寬的手機上完整 HUD 會擠成三排、吃掉 217px，直接蓋住地鼠冒出來的區域。
     要在手機上看 FPS／臨床即時數字時，網址加 ?debug=1 */
  @media (max-width:820px),(max-height:560px){
    #hud{padding:7px 10px;padding-top:max(7px,env(safe-area-inset-top));gap:6px;flex-wrap:nowrap;align-items:center;}
    .stat{padding:4px 10px;min-width:0;border-radius:10px;}
    .stat .k{font-size:10px;letter-spacing:0;white-space:nowrap;}
    .stat .v{font-size:19px;}
    .hud-btn{padding:8px 11px;font-size:13px;border-radius:10px;}
    body:not(.debug) .stat.sm-hide{display:none;}
  }

  /* 直向手機：進遊戲後提示轉橫向（鏡頭是 4:3 橫的，直握會拍不到伸手的左右範圍） */
  #rotate{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;
    background:rgba(10,13,16,.96);padding:28px;text-align:center;}
  #rotate .rot-ico{font-size:62px;line-height:1;animation:rotHint 2s ease-in-out infinite;}
  @keyframes rotHint{0%,35%{transform:rotate(0deg)}60%,100%{transform:rotate(-90deg)}}
  #rotate h2{font-size:24px;margin:18px 0 10px;}
  #rotate p{color:var(--sub);font-size:15.5px;line-height:1.75;margin-bottom:22px;}
  @media (orientation:portrait) and (max-width:820px){
    body.playing:not(.rot-ok) #rotate{display:flex;}
  }

  .overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(circle at 50% 30%,rgba(30,38,48,.7),rgba(10,13,16,.94));}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:22px;
    padding:30px 34px;width:min(560px,94vw);max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .card h1{font-size:30px;margin-bottom:4px;}
  .card .lead{color:var(--sub);font-size:16.5px;margin-bottom:22px;line-height:1.65;}
  .row{margin-bottom:20px;}
  .row > .label{font-size:15.5px;color:var(--sub);margin-bottom:9px;font-weight:600;}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:78px;background:var(--panel2);color:var(--ink);
    border:1.5px solid var(--line);border-radius:12px;padding:14px 8px;font-size:17px;font-weight:700;cursor:pointer;transition:.15s;}
  .seg button.on{border-color:var(--accent);background:rgba(244,185,66,.16);color:var(--accent);}
  .slider{display:flex;align-items:center;gap:12px;}
  .slider input{flex:1;accent-color:var(--accent);}
  .slider .val{font-size:14px;color:var(--ink);min-width:60px;text-align:right;font-weight:700;}
  .start{width:100%;margin-top:6px;background:var(--accent);color:#1a1205;border:none;
    border-radius:14px;padding:18px;font-size:20px;font-weight:800;cursor:pointer;}
  .start:hover{filter:brightness(1.05);}
  .start.go{background:var(--good);color:#04140c;}
  .note{font-size:12.5px;color:var(--sub);margin-top:14px;line-height:1.6;}
  .end-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;}
  .end-grid.three{grid-template-columns:1fr 1fr 1fr;}
  .end-grid .cell{background:var(--panel2);border-radius:14px;padding:14px 16px;}
  .end-grid .cell .k{font-size:13px;color:var(--sub);}
  .end-grid .cell .v{font-size:26px;font-weight:800;}
  .end-grid .cell.affected .v{color:var(--affected);}
  #loading{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:rgba(10,13,16,.92);}
  .spinner{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none !important;}
  .pill{display:inline-block;background:rgba(90,169,230,.16);color:var(--blue);
    border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:8px;}
  /* 開場動作示範 */
  .demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;}
  .demo{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;}
  .demo svg{width:100%;height:auto;max-height:150px;}
  .demo .dt{font-size:15.5px;font-weight:800;margin-top:6px;color:var(--accent);}
  .demo .dd{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.55;}
  .train{background:rgba(76,195,138,.1);border:1px solid rgba(76,195,138,.3);border-radius:12px;padding:12px 16px;margin-bottom:10px;}
  .train h3{font-size:15px;margin-bottom:6px;color:var(--good);}
  .train ul{margin:0 0 0 18px;font-size:13.5px;line-height:1.85;}
  .train ul b{color:var(--ink);}
  .link-btn{display:block;width:100%;background:none;border:none;color:var(--blue);font-size:13px;cursor:pointer;text-decoration:underline;padding:10px 6px 2px;}
  @media (max-width:640px){ .demo-grid{grid-template-columns:1fr;} }
  /* 復能報表 */
  .card.report{width:min(880px,96vw);}
  .rep-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .rep-head h1{font-size:26px;}
  .rep-sub{color:var(--sub);font-size:13.5px;margin:4px 0 16px;line-height:1.6;}
  .rep-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .rep-chips span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--sub);}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px;}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .metric .k{font-size:12.5px;color:var(--sub);}
  .metric .v{font-size:24px;font-weight:800;line-height:1.15;margin-top:2px;}
  .metric .s{font-size:11.5px;color:var(--sub);margin-top:3px;}
  .metric.aff .v{color:var(--affected);}
  .dl{font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap;}
  .dl.up{color:var(--good);} .dl.down{color:var(--affected);} .dl.flat{color:var(--sub);}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .chart{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .chart h3{font-size:14px;margin-bottom:2px;} .chart .cnote{font-size:11.5px;color:var(--sub);margin-bottom:8px;line-height:1.5;}
  .rep-note{background:rgba(90,169,230,.1);border:1px solid rgba(90,169,230,.3);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.75;margin-bottom:16px;}
  .report-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .report-actions .start{flex:2;margin-top:0;} .report-actions .hud-btn{flex:1;}
  @media (max-width:640px){ .metrics{grid-template-columns:repeat(2,1fr);} .charts{grid-template-columns:1fr;} }

  /* ===== 矮螢幕（手機橫拿）：設定卡壓縮 =====
     橫向手機只有 375px 高，原本的卡片要捲三頁才看得到「開啟鏡頭」按鈕，長輩不會捲。
     縮字級與間距，寬度夠時再排成兩欄，讓主要按鈕留在第一屏。
     （放在樣式表最後：這些選擇器與基礎樣式同權重，必須靠順序才蓋得過去） */
  @media (max-height:560px){
    .overlay{padding:10px;}
    .card{padding:16px 20px;width:min(780px,96vw);max-height:96vh;border-radius:16px;}
    .card h1{font-size:20px;} .card .lead{font-size:13px;margin-bottom:10px;line-height:1.5;}
    .row{margin-bottom:11px;} .row > .label{font-size:12.5px;margin-bottom:5px;}
    .seg button{padding:9px 6px;font-size:14px;min-width:60px;}
    .slider .val{font-size:12.5px;min-width:48px;}
    .start{padding:12px;font-size:17px;border-radius:12px;margin-top:2px;}
    .note{font-size:11px;line-height:1.55;} .link-btn{font-size:12.5px;padding:6px;}
    .credit{margin-top:6px !important;}
    .demo-grid{gap:8px;} .demo svg{max-height:96px;} .demo .dd{font-size:11.5px;}
    .train{padding:10px 14px;} .train li{font-size:12px;}
  }
  @media (max-height:560px) and (min-width:680px){
    #setup .card,#calib .card{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start;}
    #setup .card > h1,#setup .card > .lead,#setup .card > .start,
    #setup .card > .link-btn,#setup .card > .note,#setup .card > .credit,
    #calib .card > h1,#calib .card > .lead,#calib .card > .start,#calib .card > #calibReview,
    #calib .card > .hud-btn,#calib .card > .link-btn{grid-column:1/-1;}
  }

  @media print{
    body{background:#fff !important;overflow:visible !important;}
    #cv,#hud,#setup,#calib,#loading{display:none !important;}
    .overlay{position:static !important;background:none !important;padding:0 !important;}
    #end .card{background:#fff !important;border:none !important;box-shadow:none !important;color:#111 !important;width:100% !important;max-width:100% !important;max-height:none !important;overflow:visible !important;padding:0 !important;}
    .rep-sub,.metric .k,.metric .s,.chart .cnote,.rep-chips span{color:#555 !important;}
    .rep-head h1,.metric .v,.chart h3{color:#111 !important;}
    .metric,.chart,.rep-chips span{background:#f5f5f3 !important;border-color:#ddd !important;}
    .rep-note{background:#eef4fb !important;border-color:#bcd !important;color:#111 !important;}
    .report-actions{display:none !important;}
    .chart,.metric{break-inside:avoid;}
  }

  /* ===== 民眾版（V2）：字少、按鈕大、圖示先行 ===== */
  .hero{text-align:center;}
  .hero .boar{width:126px;height:auto;margin:2px auto 10px;display:block;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.45));}
  .hero h1{font-size:33px;margin-bottom:10px;letter-spacing:.5px;}
  .hero .say{font-size:20px;color:var(--ink);margin-bottom:22px;line-height:1.5;}
  /* 規則小卡：山豬／兇山豬（可以打）＋公雞（不能打，go/no-go） */
  .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .rule{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;}
  .rule img{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto 5px;}
  .rule .rt{font-size:13px;color:var(--sub);line-height:1.4;font-weight:600;}
  .rule .rt b{display:block;font-size:14.5px;margin-top:2px;}
  .rule.ok .rt b{color:var(--good);}
  .rule.no{border-color:#ff5a4e;}
  .rule.no .rt b{color:#ff5a4e;}
  .tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
  .tip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;}
  .tip .ic{font-size:22px;line-height:1.15;}
  .tip .tx{font-size:11.5px;color:var(--sub);margin-top:4px;font-weight:700;line-height:1.35;}
  .big-seg button{padding:19px 8px;font-size:19px;}
  .card .lead.big{font-size:19px;color:var(--ink);}
  /* 結束：白話成績卡 */
  .card.report{width:min(600px,95vw);}
  .score-hero{text-align:center;padding:4px 0 2px;}
  .score-hero .big{font-size:38px;font-weight:900;color:var(--accent);line-height:1.25;}
  .score-hero .cheer{font-size:17.5px;margin-top:10px;line-height:1.6;}
  .why{background:rgba(76,195,138,.1);border:1px solid rgba(76,195,138,.32);
    border-radius:14px;padding:15px 18px;margin:18px 0 10px;}
  .why h3{font-size:16.5px;color:var(--good);margin-bottom:9px;}
  .why ul{margin-left:18px;} .why li{font-size:14.5px;line-height:1.95;}
  .why li b{color:var(--ink);}
  .ref{font-size:11px;color:var(--sub);opacity:.78;line-height:1.65;margin:8px 0 14px;}
  @media (max-height:560px){
    .hero .boar{width:78px;margin-bottom:4px;} .hero h1{font-size:22px;margin-bottom:5px;}
    .hero .say{font-size:15px;margin-bottom:12px;}
    .rules{gap:6px;margin-bottom:8px;} .rule{padding:6px 4px;} .rule img{width:34px;height:34px;margin-bottom:3px;}
    .rule .rt{font-size:10.5px;} .rule .rt b{font-size:11.5px;}
    .tips{gap:6px;margin-bottom:10px;} .tip{padding:6px 4px;} .tip .ic{font-size:17px;} .tip .tx{font-size:10px;}
    .big-seg button{padding:11px 6px;font-size:15.5px;}
    .card .lead.big{font-size:14px;}
    .score-hero .big{font-size:26px;} .score-hero .cheer{font-size:14px;}
    .why{padding:10px 14px;margin:10px 0 8px;} .why h3{font-size:14px;} .why li{font-size:12.5px;line-height:1.7;}
  }
</style>
<script src="/open-in-browser.js" data-camera="1"></script>
</head>
<body>
<div id="stage">
  <div id="game">
    <canvas id="cv"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="stat"><div class="k">分數</div><div class="v" id="hScore">0</div></div>
      <div class="spacer"></div>
      <div class="stat time"><div class="k">剩餘</div><div class="v" id="hTime">–</div></div>
      <button class="hud-btn" id="btnMute" title="音樂">🔊</button>
      <button class="hud-btn" id="btnSetup" title="回到開始畫面">⚙</button>
      <button class="hud-btn" id="btnEnd">結束</button>
    </div>

    <!-- 直向手機提示 -->
    <div id="rotate">
      <div>
        <div class="rot-ico">📱</div>
        <h2>請把手機轉橫的</h2>
        <p>橫著拿，才照得到你左右伸手的範圍。</p>
        <button class="hud-btn" id="btnRotateSkip" style="pointer-events:auto">還是要直向玩</button>
      </div>
    </div>

    <!-- Intro：情境故事（主文案 18 字）+ 設備提醒 -->
    <div class="overlay" id="intro">
      <div class="card hero">
        <img id="introBoar" class="boar" alt="山豬">
        <h1>山豬闖進農場了！</h1>
        <p class="say">揮手把山豬趕回洞裡！公雞是自己養的，千萬別打。</p>
        <div class="rules">
          <div class="rule ok"><img id="ruleBoar" alt="山豬"><div class="rt">打山豬<br><b>加分</b></div></div>
          <div class="rule ok"><img id="ruleFierce" alt="兇山豬"><div class="rt">兇山豬<br><b>大加分</b></div></div>
          <div class="rule no"><img id="ruleRooster" alt="公雞"><div class="rt">公雞別打<br><b>扣分</b></div></div>
        </div>
        <div class="tips">
          <div class="tip"><div class="ic">💻</div><div class="tx">用電腦最好玩</div></div>
          <div class="tip"><div class="ic">📱</div><div class="tx">手機要架起來</div></div>
          <div class="tip"><div class="ic">🪑</div><div class="tx">坐著玩、坐遠一點</div></div>
        </div>
        <button class="start" id="btnIntroGo">開始 →</button>
      </div>
    </div>

    <!-- Setup：只留兩個選擇 -->
    <div class="overlay hidden" id="setup">
      <div class="card">
        <h1>準備開始</h1>
        <p class="lead big">選好就可以玩了。</p>

        <div class="row">
          <div class="label">要練哪隻手？</div>
          <div class="seg big-seg" id="segHand">
            <button data-hand="right">右手</button>
            <button data-hand="left">左手</button>
            <button data-hand="both" class="on">兩隻手</button>

};
const cfg={ side:'none', mode:'mole', display:'focus', sizeFrac:0.105, diff:'normal',

}
const MUSIC_CREDIT='♪ 音樂：Monkeys Spinning Monkeys — Kevin MacLeod (incompetech.com)．CC-BY 4.0';   // 音樂出處標示（CC-BY 授權必填）；拆分複製檔用 sed 填入

function pick(el,attr,fn){ el.onclick=e=>{ const v=e.target.dataset[attr]; if(!v)return;

/* ---------------- One-Euro 濾波 ---------------- */
function oneEuro(min=1.0,beta=0.02,dcut=1.0){   // ⚠️在 pixel space 濾波（餵正規化×像素尺度）→ 可用 One-Euro 經典參數；靜止抖↓min、拖尾↑beta
  let xP=null,dxP=0,tP=null; const a=(c,dt)=>{const t=1/(2*Math.PI*c);return 1/(1+t/dt);};
  return { reset(){xP=null;dxP=0;tP=null;},
    f(x,t){ if(xP===null){xP=x;tP=t;return x;} const dt=Math.max((t-tP)/1000,1e-3);tP=t;
      const dx=(x-xP)/dt; const ad=a(dcut,dt); const dh=ad*dx+(1-ad)*dxP; dxP=dh;
      const c=min+beta*Math.abs(dh); const al=a(c,dt); const xh=al*x+(1-al)*xP; xP=xh; return xh; } };
}
const euro={ left:{x:oneEuro(),y:oneEuro(),t:0}, right:{x:oneEuro(),y:oneEuro(),t:0} };

/* ---------------- 音訊 ---------------- */
function makeAudio(){
  const C=window.AudioContext||window.webkitAudioContext; const ac=new C();
  const music=ac.createGain();music.gain.value=0.16;music.connect(ac.destination);
  const sfx=ac.createGain();sfx.gain.value=0.32;sfx.connect(ac.destination);
  const penta=[329.63,392,440,523.25,587.33,659.25,783.99]; let timer=null,pad=[];
  function tone(dest,f,t,dur,vol,ty='triangle'){const o=ac.createOscillator();o.type=ty;o.frequency.value=f;
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);}
  function startPad(){[130.81,196].forEach(f=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f;
    const g=ac.createGain();g.gain.value=0.05;o.connect(g);g.connect(music);o.start();pad.push(o);});}
  function tick(){ if(Math.random()<0.68) tone(music,penta[Math.floor(Math.random()*penta.length)],ac.currentTime,1.4,0.12); }
  // 背景音樂：優先播放同資料夾的 music.mp3（老闆自備免版權曲）；載不到就退回程式生成的柔和五聲音階
  let bgm=null; try{ bgm=new Audio(); bgm.loop=true; bgm.volume=0.5; }catch(e){}
  function startProc(){ if(!pad.length)startPad(); if(!timer)timer=setInterval(tick,820); }
  function playBgm(list){ if(!bgm||!list.length){ startProc(); return; } bgm.src=list[0]; bgm.play().then(()=>{}).catch(()=>playBgm(list.slice(1))); }   // 依序試 music.mp3 / music.ogg，都沒有才用程式音樂
  return { ac,
    start(){ if(ac.state==='suspended')ac.resume();
      if(bgm){ playBgm(['music.mp3','music.ogg']); } else startProc(); },
    stop(){ if(bgm){try{bgm.pause();}catch(e){}} if(timer){clearInterval(timer);timer=null;} },
    hit(){const t=ac.currentTime;tone(sfx,659.25,t,0.18,0.35,'sine');tone(sfx,987.77,t+0.05,0.22,0.3,'sine');},
    squeak(){const t=ac.currentTime;   // 打到一般地鼠：卡通「吱」叫（方波快速上揚再下滑）
      const o=ac.createOscillator();o.type='square';
      o.frequency.setValueAtTime(680,t);o.frequency.exponentialRampToValueAtTime(1450,t+0.05);o.frequency.exponentialRampToValueAtTime(520,t+0.19);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g);g.connect(sfx);o.start(t);o.stop(t+0.22);},
    fierceSqueak(){const t=ac.currentTime;   // 打到兇地鼠：更兇的低吼＋吱
      const o=ac.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(920,t+0.06);o.frequency.exponentialRampToValueAtTime(200,t+0.24);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.34,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.connect(g);g.connect(sfx);o.start(t);o.stop(t+0.3);},
    beep(f=880){const t=ac.currentTime;tone(sfx,f,t,0.12,0.3,'sine');},
    buzz(){const t=ac.currentTime;   // 打到公雞（不可以打）：低頻雙聲蜂鳴「叭叭」，跟 squeak 明顯區隔
      [0,0.17].forEach(off=>{
        const o=ac.createOscillator();o.type='square';o.frequency.setValueAtTime(160,t+off);
        const g=ac.createGain();g.gain.setValueAtTime(0.0001,t+off);g.gain.exponentialRampToValueAtTime(0.3,t+off+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.16);
        o.connect(g);g.connect(sfx);o.start(t+off);o.stop(t+off+0.18);
      });},
    squawk(){const t=ac.currentTime;   // 雞慘叫：兩短「咯咯」＋一聲長下滑尖叫（高頻帶，與 buzz 低頻互補）
      [0,0.09].forEach(off=>{
        const o=ac.createOscillator();o.type='sawtooth';
        o.frequency.setValueAtTime(1300,t+off);o.frequency.exponentialRampToValueAtTime(700,t+off+0.07);
        const g=ac.createGain();g.gain.setValueAtTime(0.0001,t+off);g.gain.exponentialRampToValueAtTime(0.26,t+off+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.08);
        o.connect(g);g.connect(sfx);o.start(t+off);o.stop(t+off+0.09);
      });
      const o=ac.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(1600,t+0.2);o.frequency.exponentialRampToValueAtTime(350,t+0.58);
      const g=ac.createGain();g.gain.setValueAtTime(0.0001,t+0.2);g.gain.exponentialRampToValueAtTime(0.3,t+0.23);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
      o.connect(g);g.connect(sfx);o.start(t+0.2);o.stop(t+0.62);},
    setMuted(m){ if(bgm)bgm.muted=m; music.gain.value=m?0:0.16;sfx.gain.value=m?0:0.32;} };
}
let AE=null;

/* ---------------- 相機 + 模型 ---------------- */
let handLandmarker=null,video=null,camReady=false,_lmHands=0,_vision=null;
async function initModel(){
  // ⭐只練單手時 numHands:1 —— 推論成本大約少一半，是「游標卡頓」最直接的一刀
  const want=(cfg.side==='none')?2:1;
  if(handLandmarker&&_lmHands===want) return;
  if(handLandmarker){ try{handLandmarker.close();}catch(e){} handLandmarker=null; }
  if(!_vision) _vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  handLandmarker=await HandLandmarker.createFromOptions(_vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
    runningMode:"VIDEO",numHands:want,minHandDetectionConfidence:0.5,minHandPresenceConfidence:0.4,minTrackingConfidence:0.35 });
  _lmHands=want;
}
let _vfcOn=false, _videoDirty=false;
async function initCamera(){
  video=document.createElement('video');video.playsInline=true;video.muted=true;
  const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:60,min:30},facingMode:'user'},audio:false});
  video.srcObject=st;await video.play();
  try{ const tr=st.getVideoTracks()[0], caps=tr.getCapabilities?.();   // 嘗試 zoom 拉到最小＝更廣角、人更小、手不易出框
    if(caps&&caps.zoom&&caps.zoom.min!=null) await tr.applyConstraints({advanced:[{zoom:caps.zoom.min}]}); }catch(e){}
  // 新影格一到就標記（比每幀比對 currentTime 早半幀～一幀拿到資料＝端到端延遲更低）
  if(video.requestVideoFrameCallback){ _vfcOn=true;
    const cb=()=>{ _videoDirty=true; video.requestVideoFrameCallback(cb); }; video.requestVideoFrameCallback(cb); }
  camReady=true;
}

/* ---------------- 畫布 ---------------- */
let CW=0,CH=0,_rw=0,_rh=0,_rdpr=0,_sizeDirty=true;
function resize(){                                   // 只在尺寸真的變動時量測＋重設畫布
  if(!_sizeDirty) return;                            // ⚠️每幀讀 clientWidth 會強制 layout（實測每幀 0.3ms）→ 改成事件驅動
  _sizeDirty=false;
  const dpr=Math.min(window.devicePixelRatio||1,2), w=cv.clientWidth, h=cv.clientHeight;
  CW=w; CH=h;
  if(w===_rw && h===_rh && dpr===_rdpr) return;
  _rw=w;_rh=h;_rdpr=dpr; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',()=>{_sizeDirty=true;});
if(window.ResizeObserver) new ResizeObserver(()=>{_sizeDirty=true;}).observe(cv);

/* ---------------- 手部追蹤（HandLandmarker：直接偵測手部 21 點，比 Pose 外插指尖穩定得多） ---------------- */
// handRaw：平滑後的正規化座標（影像空間，未鏡像）；raw=上一幀原始座標（離群判斷用）；lm=21 點原始座標（手骨架模式繪製）
const handRaw={ left:{x:0.5,y:0.5,t:0,valid:false,bad:0,raw:null,lm:null}, right:{x:0.5,y:0.5,t:0,valid:false,bad:0,raw:null,lm:null} };
let calib=null; // calib={minX,maxX,minY,maxY}
const JUMP=0.32;              // 單幀原始座標跳超過此距離 → 視為誤判丟棄
const PALM=[0,5,9,13,17];     // 掌心中心＝手腕＋四指根平均，當游標（比單一指尖穩）
let HAND_SWAP=true;           // 前鏡頭原始影像非鏡像 → MediaPipe 手性需交換才對應解剖左右；若實測左右相反改成 false

function palmCenter(lm){ let x=0,y=0; for(const i of PALM){x+=lm[i].x;y+=lm[i].y;} return {x:x/PALM.length,y:y/PALM.length}; }

function trackHands(now){
  if(_detT){ _detFps=_detFps?_detFps*0.9+(1000/(now-_detT))*0.1:1000/(now-_detT); } _detT=now;
  const _t0=performance.now();
  let res; try{ res=handLandmarker.detectForVideo(video,now); }catch(e){ return; }
  const _ms=performance.now()-_t0;                       // 推論耗時：太久就拉開偵測間隔，別把畫面幀率一起拖垮
  _detMs=_detMs?_detMs*0.85+_ms*0.15:_ms;
  _detGap=Math.min(30,Math.max(0,_detMs-8));
  const SX=(video&&video.videoWidth)||640, SY=(video&&video.videoHeight)||480;   // pixel space 濾波用的尺度
  const seen={left:false,right:false};
  const n=(res&&res.landmarks)?res.landmarks.length:0;
  // ⭐單手模式：只偵測一隻手（numHands:1），偵測到什麼就當「選的那隻手」。
  //   左右手判別（handedness）會偶爾閃爍誤判，單手模式若靠它認手，
  //   誤判的那幾幀資料會被塞到另一側 → 游標掉進定格 → 一頓一頓（雙手反而順的原因）。
  const FORCE=(cfg.side!=='none')?affSide():null;
  for(let i=0;i<n;i++){
    const lm=res.landmarks[i];
    const label=(res.handedness&&res.handedness[i]&&res.handedness[i][0]&&res.handedness[i][0].categoryName)||(i===0?'Right':'Left');
    let side; if(FORCE){ side=FORCE; }
    else { side=(label==='Left')?'left':'right'; if(HAND_SWAP)side=otherSide(side); }
    if(seen[side]){ if(FORCE)continue; side=otherSide(side); }   // 兩手被判成同一側 → 強制分開；單手模式多的直接丟
    const c=palmCenter(lm), H=handRaw[side], E=euro[side];
    if(H.valid && H.raw && Math.hypot(c.x-H.raw.x,c.y-H.raw.y)>JUMP && H.bad<5){ H.bad++; seen[side]=true; continue; } // 離群→丟棄、保持上一位置
    H.raw={x:c.x,y:c.y};
    if(now-E.t>250){E.x.reset();E.y.reset();} E.t=now;
    H.x=E.x.f(c.x*SX,now)/SX; H.y=E.y.f(c.y*SY,now)/SY;          // One-Euro 在 pixel space 濾波
    H.t=now; H.valid=true; H.bad=0; H.lm=lm;
    seen[side]=true;
  }
  for(const s of ['left','right']) if(!seen[s] && now-handRaw[s].t>200){                                                // 漏偵測：保持 200ms 再失效
    handRaw[s].valid=false; handRaw[s].lm=null; rcur[s].on=false; }                                                     // 追蹤器一起重置，手再出現時不會帶著舊速度衝出去
}
// 遊戲映射：把校正方框放大對應到整個畫面
function mapScreen(nx,ny){
  let u=nx,v=ny;
  if(calib){ u=(nx-calib.minX)/Math.max(0.05,calib.maxX-calib.minX);
             v=(ny-calib.minY)/Math.max(0.05,calib.maxY-calib.minY); }
  u=0.5+(u-0.5)*cfg.gain; v=0.5+(v-0.5)*cfg.gain;
  u=Math.max(-0.05,Math.min(1.05,u)); v=Math.max(-0.05,Math.min(1.05,v));
  return { x:CW*(1-u), y:CH*v };   // 鏡像
}

/* ---------------- 遊戲狀態 ---------------- */
let phase='setup';   // setup / calibIntro / calibCapture / calibReview / play
let running=false, targets=[], particles=[], score=0, hits=0, affHits=0, cross=0, presented=0, rts=[], hitLog=[], maxStreak=0, curStreak=0, hammerHitT=-9999, roosterShown=0, roosterHit=0, errFlashT=-9999;
let startT=0, lastSpawn=0, lastVideoTime=-1;
let bgStars=[], bgFlowers=[], moon={}, moleHold={x:0,y:0,t:0,side:null};
let capBox=null, capEnd=0, capReadyEnd=0, _fpsT=0, _fps=0, _detT=0, _detFps=0, _detMs=0, _detGap=0, _lastDet=0, _hudT=0;

function affSide(){ return cfg.side==='right'?'right':'left'; }
function otherSide(s){ return s==='left'?'right':'left'; }
/* ⭐目標大小依「畫面短邊」而不是固定 px：
   桌機 1280×800 → 短邊 800、普通難度 r≈94（與舊版 88 相當）
   手機橫向 812×375 → 短邊 375、再乘 0.85 的手機係數 → r≈38
   舊版寫死 px，在 375px 高的手機上山豬會佔掉半個畫面 */
function baseSize(){
  const m=Math.min(CW,CH)||600;
  const phone=(CH<520||CW<820)?0.85:1;
  return Math.max(24, m*cfg.sizeFrac*phone);
}
function speedParams(){const s=cfg.speed;return{spawnGap:1500-(s-1)*230,dwell:2600-(s-1)*380,fall:1.2+(s-1)*0.9,maxActive:cfg.mode==='mole'?(cfg.diff==='hard'?3:2):3};}   // 2026-07-28 挑戰同時 3 隻（分散性注意力）
function reachSpread(){return[0,0.30,0.42,0.50][cfg.reach];}

function spawnTarget(now){
  const spread=reachSpread(); const mid=CW/2;
  let onAff=cfg.side==='none'?Math.random()<0.5:Math.random()<0.72;
  const affLeft=(cfg.side==='left');
  const toLeft=cfg.side==='none'?(Math.random()<0.5):(onAff?affLeft:!affLeft);
  const R=baseSize();
  const dx=(0.15+Math.random()*spread)*CW;
  const M=R*1.6;                                    // 洞口比地鼠寬（hw=r*1.55），留這個邊界才不會被畫面切掉
  let x=Math.max(M,Math.min(CW-M, toLeft?mid-dx:mid+dx));
  presented++;
  if(cfg.mode==='mole'){ const y=CH*(0.42+Math.random()*0.40);
    // 三種目標：公雞（不可打，go/no-go）優先判定，再來是兇山豬，其餘是一般山豬
    const isRooster=Math.random()<(cfg.roosterRate||0);
    const fierce=!isRooster&&Math.random()<0.28;

    if(isRooster)roosterShown++;
    targets.push({x,y,r:R*(fierce?1.06:1),born:now,ttl:speedParams().dwell*(fierce?0.62:1),mode:'mole',hit:false,fierce,kind}); }
  else { targets.push({x,y:-R,r:R,born:now,vy:speedParams().fall,mode:'star',hit:false,rot:Math.random()*6}); }
}
function burst(x,y,c){for(let i=0;i<14;i++){const a=Math.random()*6.28,sp=2+Math.random()*5;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,color:c});}}
function resetPlay(){
  targets=[];particles=[];score=0;hits=0;affHits=0;cross=0;presented=0;rts=[];hitLog=[];maxStreak=0;curStreak=0;roosterShown=0;roosterHit=0;errFlashT=-9999;
  rcur.left.on=false;rcur.right.on=false;
  startT=performance.now()+3000;lastSpawn=0;moleHold={x:0,y:0,t:0,side:null};  // +3 秒開場倒數
  bgStars=Array.from({length:60},()=>({x:Math.random()*CW,y:Math.random()*CH*0.7,r:Math.random()*1.8+0.5,p:Math.random()*6}));

/* ---------------- 遊戲用手部游標：α-β 追蹤器（預測 + 修正） ----------------
   為什麼要換掉舊的「每幀乘一個比例」寫法：
   ① 偵測只有 15-30fps、畫面 60fps，舊寫法在沒有新資料的幀只會停住 → 看起來一格一格跳（卡頓感）
   ② 舊係數綁「每畫面」而不是「每秒」，幀率一變手感就變
   ③ 校正畫面有影片當背景，影片和游標一起延遲所以看不出來；進遊戲沒有影片，
      而且校正框被放大成整個畫面（約 2.5 倍），同一個延遲在遊戲裡位移被放大 → 延遲感突然變明顯
   解法：沒有新偵測時用速度外推繼續移動（連續、不跳格），有新偵測時修正位置與速度，
        再加一點前瞻（lead）抵銷鏡頭＋推論的管線延遲。 */
const rcur={ left:{x:0,y:0,vx:0,vy:0,zx:0,zy:0,zt:0,t:0,on:false},
             right:{x:0,y:0,vx:0,vy:0,zx:0,zy:0,zt:0,t:0,on:false} };
const AB_A=0.85, AB_B=0.42;   // α＝位置修正力道、β＝速度修正力道
                              // 2026-07-26：0.92→0.85。0.92 等於每次偵測都硬貼上去，
                              // 配上下面的速度衰減＝「滑一下→慢下來→突然跳」的頓挫感
                              // 2026-07-21 v6：0.55→0.92。上游 trackHands 已有 One-Euro 濾波，這裡再低通一次＝二次平滑，
                              // 造成「骨架跟得上、錘子跟不上」的延遲感。α 拉到接近 1＝有新偵測就貼上去（抖動交給 One-Euro 處理），
                              // α-β 只負責偵測空檔（15-30fps→60fps）的速度外推補幀
const CUR_LEAD=0.055;         // 前瞻秒數：往速度方向多推 55ms，抵銷管線延遲
const LEAD_MAX=64;            // 前瞻位移上限(px)：避免手突然停住時衝過頭
const VMAX=2600;              // 速度上限(px/s)：誤判時不會暴衝
function easeCur(side,tx,ty,now){
  const r=rcur[side];
  if(!r.on){ r.x=r.zx=tx; r.y=r.zy=ty; r.vx=r.vy=0; r.t=r.zt=now; r.on=true; return {x:tx,y:ty}; }
  const dt=Math.min(0.05,Math.max(0.001,(now-r.t)/1000)); r.t=now;
  r.x+=r.vx*dt; r.y+=r.vy*dt;                                   // 預測：偵測空檔也持續移動
  if(tx!==r.zx||ty!==r.zy){                                     // 有新的偵測結果 → 修正
    const dz=Math.min(0.2,Math.max(0.008,(now-r.zt)/1000)); r.zt=now; r.zx=tx; r.zy=ty;
    const ex=tx-r.x, ey=ty-r.y;
    r.x+=AB_A*ex; r.y+=AB_A*ey;
    r.vx+=AB_B*ex/dz; r.vy+=AB_B*ey/dz;
    const sp=Math.hypot(r.vx,r.vy); if(sp>VMAX){ r.vx=r.vx/sp*VMAX; r.vy=r.vy/sp*VMAX; }
  } else { const d=Math.exp(-dt/0.35); r.vx*=d; r.vy*=d; }       // 沒新資料 → 速度緩慢衰減
                              // ⚠️舊版 *=0.86 是「每畫面」衰減：60fps 下 50ms 只剩 0.64 倍，
                              // 偵測空檔中游標會自己慢下來，下次偵測再被拉回去＝一頓一頓。
                              // 改成以「時間」為準的長衰減（τ=0.35s），空檔中維持等速滑行。
  let lx=r.vx*CUR_LEAD, ly=r.vy*CUR_LEAD;
  const lm=Math.hypot(lx,ly); if(lm>LEAD_MAX){ lx=lx/lm*LEAD_MAX; ly=ly/lm*LEAD_MAX; }
  return { x:Math.max(-40,Math.min(CW+40,r.x+lx)), y:Math.max(-40,Math.min(CH+40,r.y+ly)) }; }
function gameHands(now){
  if(cfg.mode==='star'){
    const out=[];
    for(const s of ['left','right']){ const H=handRaw[s];
      if(H.valid){ const p=mapScreen(H.x,H.y), e=easeCur(s,p.x,p.y,now); out.push({x:e.x,y:e.y,side:s}); }
      else rcur[s].on=false; }
    return out;
  }
  // 民眾版選「兩隻手」→ 兩手都能打（比單游標直覺，長輩不會覺得「另一隻手沒反應」）
  if(cfg.side==='none'){ const out=[];
    for(const s of ['left','right']){ const H=handRaw[s];
      if(H.valid){ const p=mapScreen(H.x,H.y), e=easeCur(s,p.x,p.y,now); out.push({x:e.x,y:e.y,side:s}); }
      else rcur[s].on=false; }
    if(out.length) return out; }
  // 指定單手：單一游標，該側優先，短暫定格避免跨身體亂跳
  const a=affSide(), o=otherSide(a), A=handRaw[a], O=handRaw[o];
  if(A.valid){ const p=mapScreen(A.x,A.y), e=easeCur(a,p.x,p.y,now); moleHold={x:e.x,y:e.y,t:now,side:a}; return [{x:e.x,y:e.y,side:a}]; }
  if(now-moleHold.t<220 && moleHold.side) return [{x:moleHold.x,y:moleHold.y,side:moleHold.side}]; // 定格
  if(O.valid){ const p=mapScreen(O.x,O.y), e=easeCur(o,p.x,p.y,now); moleHold={x:e.x,y:e.y,t:now,side:o}; return [{x:e.x,y:e.y,side:o}]; }
  if(now-moleHold.t<600 && moleHold.side) return [{x:moleHold.x,y:moleHold.y,side:moleHold.side}];
  return [];
}

/* ---------------- 主迴圈 ---------------- */
function loop(){
  if(!running)return;
  const now=performance.now();
  if(_fpsT){ _fps = _fps ? _fps*0.9 + (1000/(now-_fpsT))*0.1 : 1000/(now-_fpsT); } _fpsT=now;
  resize();
  // 有新影格 + 上次推論已經隔夠久 → 才跑偵測（_detGap 依實測推論耗時自動調整）
  if(DEMO){ demoTick(now); }
  else {
    const fresh = _vfcOn ? _videoDirty : (camReady && video.currentTime!==lastVideoTime);
    if(camReady && fresh && now-_lastDet>=_detGap){
      _videoDirty=false; _lastDet=now; lastVideoTime=video.currentTime; trackHands(now); } }
  ctx.clearRect(0,0,CW,CH);

  if(phase==='play'){ drawPlay(now); }
  else { drawCalib(now); }
  requestAnimationFrame(loop);
}

/* ---------------- 校正畫面 ---------------- */
let vtf={s:1,ox:0,oy:0,dw:0,dh:0};
function computeVtf(){ const vw=(video&&video.videoWidth)||4, vh=(video&&video.videoHeight)||3;
  const s=Math.min(CW/vw,CH/vh)*0.9;                 // contain 再縮 10%＝廣角感、人更小、留邊
  vtf={s,dw:vw*s,dh:vh*s,ox:(CW-vw*s)/2,oy:(CH-vh*s)/2}; }
function calX(nx){ return vtf.ox+vtf.dw*(1-nx); }     // 校正顯示：正規化→鏡頭框內（鏡像）
function calY(ny){ return vtf.oy+vtf.dh*ny; }
function drawVideoFaint(a){
  const vw=video.videoWidth,vh=video.videoHeight; if(!vw)return;
  ctx.save();ctx.globalAlpha=a;ctx.translate(CW,0);ctx.scale(-1,1);
  ctx.drawImage(video, CW-vtf.ox-vtf.dw, vtf.oy, vtf.dw, vtf.dh);ctx.restore();ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;ctx.strokeRect(vtf.ox,vtf.oy,vtf.dw,vtf.dh);
}
function drawCalib(now){
  computeVtf();
  const g=ctx.createLinearGradient(0,0,0,CH); g.addColorStop(0,'#16202b');g.addColorStop(1,'#0b1015');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  if(camReady && video) drawVideoFaint(0.45);
  if(DEMO){ ctx.fillStyle='rgba(255,255,255,.5)';ctx.textAlign='left';ctx.font='700 15px sans-serif';
    ctx.fillText('示範模式（沒有用鏡頭）',16,26); }

  const HH=handRaw[affSide()].valid?handRaw[affSide()]:(handRaw[otherSide(affSide())].valid?handRaw[otherSide(affSide())]:null);

  if(phase==='calibCapture'){
    if(now<capReadyEnd){                                 // 準備倒數，給長者時間就位
      const n=Math.ceil((capReadyEnd-now)/1000);
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 140px sans-serif';ctx.fillText(n,CW/2,CH*0.52);
      ctx.font='800 34px sans-serif';ctx.fillText('坐遠一點，準備舉手',CW/2,CH*0.52+92);
    } else {
      if(HH){ capBox.minX=Math.min(capBox.minX,HH.x);capBox.maxX=Math.max(capBox.maxX,HH.x);
        capBox.minY=Math.min(capBox.minY,HH.y);capBox.maxY=Math.max(capBox.maxY,HH.y); }
      if(capBox.maxX>capBox.minX){
        const x1=calX(capBox.maxX),x2=calX(capBox.minX),y1=calY(capBox.minY),y2=calY(capBox.maxY);
        ctx.strokeStyle='rgba(76,195,138,.95)';ctx.lineWidth=5;ctx.setLineDash([12,9]);
        ctx.strokeRect(Math.min(x1,x2),y1,Math.abs(x2-x1),y2-y1);ctx.setLineDash([]);
        ctx.fillStyle='rgba(76,195,138,.14)';ctx.fillRect(Math.min(x1,x2),y1,Math.abs(x2-x1),y2-y1);
      }
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 38px sans-serif';
      ctx.fillText('畫大圈！',CW/2,CH*0.12);
      const p=Math.max(0,Math.min(1,(now-capReadyEnd)/(capEnd-capReadyEnd)));   // 進度條
      const bw=Math.min(560,CW*0.7),bx=(CW-bw)/2,by=CH*0.12+26;
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(bx,by,bw,18);
      ctx.fillStyle='#4cc38a';ctx.fillRect(bx,by,bw*p,18);
      if(now>=capEnd) finishCapture();
    }
  }
  if(HH){ const x=calX(HH.x),y=calY(HH.y);                // 真實游標（校正框內、應貼手）
    ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fillStyle='rgba(255,122,89,.3)';ctx.fill();
    ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.fillStyle='rgba(255,122,89,.97)';ctx.fill();
    ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();
  } else if(camReady && phase!=='calibReview' && !(phase==='calibCapture'&&now<capReadyEnd)){
    // 倒數期間不畫這行：會跟中央的「坐遠一點，準備舉手」疊在一起（且那時本來就還沒舉手）
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.textAlign='center';ctx.font='700 24px sans-serif';
    ctx.fillText('把手舉起來，讓鏡頭看到',CW/2,CH*0.8);
  }
}
function startCapture(){
  phase='calibCapture'; calibEl.classList.add('hidden');
  capBox={minX:1,maxX:0,minY:1,maxY:0};
  const t=performance.now(); capReadyEnd=t+3000; capEnd=t+3000+8000;    // 3 秒準備 + 8 秒擷取（民眾版縮短，12 秒長輩會撐不住）
  if(AE&&cfg.sound)AE.beep(660);
}
function finishCapture(){
  // 邊界檢查 + 加一點邊界緩衝
  let {minX,maxX,minY,maxY}=capBox;
  const w=maxX-minX, h=maxY-minY;
  const okW=w>0.05, okH=h>0.05;
  if(!okW){ minX=Math.max(0,minX-0.1); maxX=Math.min(1,maxX+0.1); }
  if(!okH){ minY=Math.max(0,minY-0.1); maxY=Math.min(1,maxY+0.1); }
  const padX=(maxX-minX)*0.06, padY=(maxY-minY)*0.06;
  calib={minX:minX-padX,maxX:maxX+padX,minY:minY-padY,maxY:maxY+padY};
  phase='calibReview';
  $('cvOk').textContent=(okW&&okH)?'✅ 量好了':'量到了，範圍偏小';
  $('cvOk').style.color=(okW&&okH)?'var(--good)':'var(--accent)';
  $('calibIntro').classList.add('hidden'); $('calibReview').classList.remove('hidden');
  $('btnCalibStart').classList.add('hidden'); $('btnCalibGo').classList.remove('hidden');
  $('btnRecalib').classList.remove('hidden'); $('calibTitle').textContent='好了！';
  calibEl.classList.remove('hidden');
  if(AE&&cfg.sound)AE.beep(990);
}

/* ---------------- 遊戲畫面 ---------------- */
function drawPlay(now){
  cfg.mode==='mole'?drawBgGarden(now):drawBgNight(now);
  if(cfg.display==='silhouette') drawHandSkeletons();

  const P=speedParams(), mid=CW/2, aff=affSide();
  const counting = now<startT;                              // 開場 3-2-1 倒數期間不生目標、不計時
  const active=targets.filter(t=>!t.hit).length;
  if(!counting && now-lastSpawn>P.spawnGap && active<P.maxActive){ spawnTarget(now); lastSpawn=now; }

  const hands=gameHands(now);
  for(const t of targets){
    if(t.hit)continue;
    if(t.mode==='star') t.y+=t.vy*CH/60;
    for(const h of hands){
      if(Math.hypot(h.x-t.x,h.y-t.y)<t.r+baseSize()*0.42){   // 容錯半徑跟著畫面縮放（手機不會變得過寬鬆）
        t.hit=true;t.hitT=now;hammerHitT=now;
        if(t.kind==='rooster'){
          // go/no-go：公雞不能打，誤打扣分、連擊歸零、不計入命中率／反應時間
          score=Math.max(0,score-cfg.penalty); t.pop=-cfg.penalty; curStreak=0; roosterHit++;
          burst(t.x,t.y,'#ff5a4e'); errFlashT=now;                    // 畫面閃紅＝全域錯誤訊號（餘光也感覺得到）
          if(AE&&cfg.sound){AE.buzz();AE.squawk();}                   // 低頻叭叭＋雞慘叫雙訊號
        } else {
          hits++;curStreak++;if(curStreak>maxStreak)maxStreak=curStreak;
          let pts=t.kind==='fierce'?cfg.fiercePts:cfg.pts;   // 兇山豬／一般山豬計分依難度而定
          const byAff=(cfg.side!=='none'&&h.side===aff);
          // 跨中線＝患側手打到「對側」目標：右手→畫面左側目標(t.x<mid)、左手→畫面右側目標(t.x>mid)。用目標位置判定（比游標穩、符合「手越過身體中線去拿對側」的定義）
          if(byAff){affHits++;pts+=10; const crossed=aff==='left'?(t.x>mid):(t.x<mid); if(crossed){cross++;pts+=5;} }
          score+=pts;t.pop=pts;burst(t.x,t.y,cfg.mode==='mole'?(t.fierce?'#ff9a6a':'#ffd27a'):'#bfe3ff');
          rts.push(now-(t.born||now)); hitLog.push({x:t.x/CW,y:t.y/CH,t:Math.max(0,now-startT),side:h.side,aff:byAff});  // 反應時間＋命中座標（報表用）
          if(AE&&cfg.sound){ cfg.mode==='mole'?(t.fierce?AE.fierceSqueak():AE.squeak()):AE.hit(); }
        }
        break;
      }
    }
  }
  targets=targets.filter(t=>{ if(t.hit)return now-t.hitT<(t.pop<0?900:450);
    const alive=(t.mode==='mole')?(now-t.born<t.ttl):(t.y<CH+t.r);
    if(!alive&&t.kind!=='rooster')curStreak=0;   // 沒打到就消失＝miss，連擊歸零；公雞自然縮回不算 miss、不歸零連擊
    return alive; });

  for(const t of targets){
    const age=now-(t.born||now);
    if(t.hit){ const neg=t.pop<0, popDur=neg?900:450, k=(now-t.hitT)/popDur;   // 扣分訊息停留加倍，長輩看得到
      ctx.save();ctx.globalAlpha=1-k;
      if(t.mode==='mole')drawMole(t.x,t.y-k*30,t.r*(1-k*0.3),1,true,t.kind); else drawStar(t.x,t.y-k*40,t.r*(1+k*0.5));
      ctx.restore();
      ctx.textAlign='center';ctx.globalAlpha=1-k;
      if(neg){ const fs=Math.max(44,Math.round(Math.min(CW,CH)*0.10));          // 誤打：特大加粗紅字＋白描邊
        ctx.font='900 '+fs+'px sans-serif';ctx.lineWidth=Math.max(5,fs*0.12);ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineJoin='round';
        ctx.strokeText('✕ '+t.pop,t.x,t.y-40-k*30);ctx.fillStyle='#e33325';ctx.fillText('✕ '+t.pop,t.x,t.y-40-k*30);
      } else { ctx.fillStyle=(cfg.mode==='mole'?'#ffd27a':'#bfe3ff');ctx.font='bold 28px sans-serif';
        ctx.fillText('+'+t.pop,t.x,t.y-40-k*40); }
      ctx.globalAlpha=1;
    } else if(t.mode==='mole'){ drawMole(t.x,t.y,t.r,moleRise(t,now),false,t.kind); }
    else drawStar(t.x,t.y,t.r,now/600+t.rot);
  }

  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.life-=0.03;}
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();} ctx.globalAlpha=1;

  if(now-errFlashT<450){                                   // 誤打公雞：整個畫面閃紅 450ms（淡出）
    const fk=(now-errFlashT)/450;
    ctx.fillStyle='rgba(255,60,40,'+(0.26*(1-fk)).toFixed(3)+')';ctx.fillRect(0,0,CW,CH);
    ctx.lineWidth=26;ctx.strokeStyle='rgba(227,51,37,'+(0.8*(1-fk)).toFixed(3)+')';ctx.strokeRect(13,13,CW-26,CH-26);
  }

  for(const h of hands){
    if(cfg.mode==='mole'){ drawHammer(h.x,h.y,now,h.side); } // 打地鼠：錘子游標＋揮下動畫（依左右手鏡像）
    else { ctx.beginPath();ctx.arc(h.x,h.y,30,0,7);ctx.fillStyle='rgba(90,169,230,.28)';ctx.fill();
      ctx.beginPath();ctx.arc(h.x,h.y,15,0,7);ctx.fillStyle='rgba(90,169,230,.95)';ctx.fill();
      ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke(); }
  }
  if(hands.length===0&&camReady){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 20px sans-serif';ctx.textAlign='center';
    ctx.fillText('把手舉起來，讓鏡頭看到',CW/2,CH-40);}

  if(DEMO){ ctx.fillStyle='rgba(255,255,255,.42)';ctx.textAlign='left';ctx.font='700 14px sans-serif';
    ctx.fillText('示範模式（沒有用鏡頭）',16,CH-14); }
  if(document.body.classList.contains('debug')){        // ?debug=1：真機回報效能數字用（畫在 canvas 上，不動 DOM）
    ctx.save();ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8,CH-34,300,26);
    ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='700 14px monospace';
    ctx.fillText('畫面 '+Math.round(_fps)+' / 偵測 '+Math.round(_detFps)+' fps  推論 '+_detMs.toFixed(0)+'ms',14,CH-15);
    ctx.restore(); }
  const remain=Math.max(0,cfg.dur-Math.max(0,(now-startT))/1000);
  if(now-_hudT>160){ _hudT=now;
    hScore.textContent=score; hTime.textContent=Math.ceil(remain)+'s';
    hTime.style.color=(remain<=10&&!counting)?'#ff7a59':''; }        // 最後 10 秒轉紅＝快結束了
  if(!counting && remain<=10.02 && remain>0){                        // 收尾提示：大字倒數，長輩知道還要撐多久
    const k=Math.ceil(remain);
    ctx.save();ctx.globalAlpha=0.42;ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font='900 '+Math.round(Math.min(CW,CH)*0.30)+'px sans-serif';
    ctx.fillText(k,CW/2,CH*0.62);ctx.restore(); }

  if(counting){                                             // 開場倒數畫面
    const n=Math.ceil((startT-now)/1000);
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 150px sans-serif';ctx.fillText(n>0?n:'GO',CW/2,CH*0.5);
    ctx.font='800 36px sans-serif';ctx.fillText('準備趕山豬！',CW/2,CH*0.5+96);
  }
  if(!counting && remain<=0){ endGame(); }
}

function hillBand(y,amp,color){                                        // 遠處緩坡：只是色帶，不是素材

function buildScene(){                                                 // 固定亂數：整局場景長一樣，不會每幀跳動
  const R=_rng(20260721),HZ=CH*0.32,trees=[],grass=[],clouds=[];   // 地平線拉高：地鼠出現區（0.42~0.84CH）全部落在草地上
  const TK=['k_tree05','k_tree10','k_tree13','k_tree20','k_tree02','k_tree07'];
  const n=Math.max(6,Math.round(CW/170));
  for(let i=0;i<n;i++)trees.push({x:CW*(0.02+i/n*0.98+R()*0.04),by:HZ+6+R()*20,w:66+R()*46,k:TK[(R()*TK.length)|0]});
  trees.sort((a,b)=>a.by-b.by);
  for(let i=0;i<24;i++)grass.push({x:R()*CW,by:HZ+46+R()*(CH-HZ-40),w:24+R()*24,
    k:['k_grass2','k_grass4','k_grass5','k_grass6'][(R()*4)|0]});
  grass.sort((a,b)=>a.by-b.by);
  for(let i=0;i<4;i++)clouds.push({x:R()*CW,y:CH*(0.05+R()*0.18),w:140+R()*120,v:4+R()*7,
    k:['k_cloud1','k_cloud4','k_cloud6'][(R()*3)|0]});
  scene={HZ,trees,grass,clouds,CW,CH};
}

/* ⭐錘子 v12（民眾版 2026-07-26）：錘頭永遠壓在命中點上
   老闆回饋：「直覺是拿錘頭去敲動物，實際卻要對到白點」。
   舊版以「握把」為支點，待機時錘子扛在斜上方＝錘頭離命中點很遠，所見不等於所打。
   改成以「錘頭」為支點：錘頭鎖在游標上不離開，待機只有握把小幅上抬＋微晃，
   敲擊時握把快速壓下、錘頭原地一沉再回彈。看到錘頭蓋住山豬，就是真的打得到。 */
function drawHammer(x,y,now,side){
  const R=baseSize(), dir=(side==='left')?-1:1;
  const im=SPR['3d_hammer']; if(!_ok(im))return;
  const W=R*2.15;                                  // 比舊版 2.6 小一點（老闆回饋：錘子再小一點）
  const e=now-hammerHitT, TILT=0.34, LIFT=0.46, DIP=R*0.10;
  // TILT＝敲到時握把仍保留的傾角（不要垂直豎起來整支蓋住山豬）；LIFT＝待機再往上抬的角度
  let ang, push;
  if(e<70){        const p=e/70;        ang=TILT+LIFT*(1-p)*(1-p); push=DIP*p; }        // 揮下（加速）
  else if(e<150){                       ang=TILT;                  push=DIP; }          // 敲住一拍
  else if(e<420){  const p=(e-150)/270; ang=TILT+LIFT*p*(2-p);     push=DIP*(1-p); }    // 舉回
  else {                                ang=TILT+LIFT+0.05*Math.sin(now/560); push=0; } // 待機微晃
  ctx.save();
  ctx.translate(x,y+push);                         // ⭐原點＝錘頭中心＝命中點
  ctx.rotate(dir*ang);
  ctx.scale(dir,1); ctx.rotate(-2.36);
  ctx.drawImage(im,-W*0.32,-W*0.30,W,W);           // 圖中錘頭中心約在 (0.32,0.30)
  ctx.restore();
  ctx.save();                                      // 錘頭正中心的小白點：精準落點仍看得見
  ctx.beginPath(); ctx.arc(x,y+push,R*0.05+2,0,7);
  ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke();
  ctx.restore();
}
function moleRise(t,now){                    // 冒出 → 停留 → 鑽回土裡（消失前縮回）
  const age=now-(t.born||now), inD=t.fierce?150:220, outD=340;
  if(age<inD) return age/inD;
  if(age>t.ttl-outD) return Math.max(0,(t.ttl-age)/outD);
  return 1;
}
function drawMole(x,y,r,rise,ko,kind){
  /* 畫法：地面陰影 → 土堆 → 洞口暗部 → 目標(裁切在洞口線以上) → 前緣土唇壓住下緣
     kind：'boar'一般山豬／'fierce'兇山豬／'rooster'公雞（不可打，go/no-go） */
  const hy=y+r*0.52, hw=r*1.55, hh=r*0.52;
  ctx.fillStyle='rgba(0,0,0,.13)';
  ctx.beginPath();ctx.ellipse(x,hy+r*0.16,hw*1.06,hh*0.62,0,0,7);ctx.fill();
  ctx.fillStyle='#7d5a30';
  ctx.beginPath();ctx.ellipse(x,hy,hw,hh,0,0,7);ctx.fill();
  ctx.fillStyle='#2b1c0a';
  ctx.beginPath();ctx.ellipse(x,hy,hw*0.72,hh*0.62,0,0,7);ctx.fill();
  ctx.save();
  ctx.beginPath();ctx.rect(x-hw*1.2,0,hw*2.4,hy);ctx.clip();
  const cy=hy-r*0.62+(1-rise)*r*1.5;
  ctx.save();ctx.translate(x,cy);
  if(ko){ctx.rotate(0.26);ctx.scale(1.08,0.88);}                       // 被敲到：歪頭＋壓扁
  if(kind==='rooster') spr(SPR['3d_rooster'],0,-r*0.32,r*2.1);         // 公雞全身構圖，往上抬讓身體露出洞口約 2/3
  else if(kind==='fierce') spr(SPR['3d_fierce'],0,-r*0.08,r*2.5);
  else spr(SPR['3d_boar'],0,0,r*2.3);
  ctx.restore();ctx.restore();
  ctx.fillStyle='#8d6836';
  ctx.beginPath();ctx.ellipse(x,hy,hw*0.74,hh*0.64,0,0,Math.PI);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)';
  ctx.beginPath();ctx.ellipse(x,hy-hh*0.06,hw*0.95,hh*0.4,0,Math.PI,0);ctx.fill();
  if(ko)spr(SPR['3d_boom'],x+r*0.62,cy-r*0.5,r*1.5);
}
function drawStar(cx,cy,r,rot=0){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot*0.15);
  const gl=ctx.createRadialGradient(0,0,r*0.2,0,0,r*1.7);
  gl.addColorStop(0,'rgba(255,235,150,.55)');gl.addColorStop(1,'rgba(255,235,150,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,r*1.7,0,7);ctx.fill();
  const sp=5,o=r,ir=r*0.44;ctx.beginPath();
  for(let i=0;i<sp*2;i++){const rad=i%2===0?o:ir,a=Math.PI/sp*i-Math.PI/2;const x=Math.cos(a)*rad,y=Math.sin(a)*rad;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.closePath();const g=ctx.createRadialGradient(0,0,ir*0.3,0,0,o);
  g.addColorStop(0,'#fff');g.addColorStop(.5,'#ffd54a');g.addColorStop(1,'#f4a72a');
  ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(120,70,0,.35)';ctx.stroke();ctx.restore();
}

/* ---------------- 手機支援 ----------------
   ①螢幕不睡：整局 60-90 秒完全不碰螢幕，手機預設會自動變暗鎖屏，玩到一半就黑掉。
     Wake Lock 在分頁被切走時系統會自動釋放，所以回到前景要重新申請。
   ②?debug=1：手機上叫出 FPS 與臨床即時數字（真機測效能用） */
let _wakeLock=null;
async function keepAwake(on){
  try{
    if(on){ if(!_wakeLock&&'wakeLock'in navigator) _wakeLock=await navigator.wakeLock.request('screen'); }
    else if(_wakeLock){ const w=_wakeLock; _wakeLock=null; await w.release(); }
  }catch(e){}                                   // 不支援或被拒絕就算了，不影響遊戲
}

/* ?demo=1：免鏡頭示範模式 —— 用程式畫一隻「假手」在畫面上繞，
   給沒有鏡頭／不想開鏡頭的人先看畫面比例與流程（也方便在手機上確認山豬大小） */
const DEMO=new URLSearchParams(location.search).has('demo');
function invMap(x,y){                       // mapScreen 的反函數：螢幕座標 → 影像正規化座標
  let u=1-x/CW, v=y/CH;
  u=0.5+(u-0.5)/cfg.gain; v=0.5+(v-0.5)/cfg.gain;
  if(calib){ u=calib.minX+u*(calib.maxX-calib.minX); v=calib.minY+v*(calib.maxY-calib.minY); }
  return {x:u,y:v};
}
const demoPos={left:{x:0.5,y:0.5},right:{x:0.5,y:0.5},_t:0};
function demoTick(now){
  const t=now/1000;
  const set=(s,x,y)=>{const H=handRaw[s];H.x=x;H.y=y;H.t=now;H.valid=true;H.raw={x,y};H.lm=null;};
  if(phase!=='play'){                       // 校正階段：畫一個大圈，讓範圍量得出來
    if(cfg.side==='none'){ set('left', 0.5+0.32*Math.sin(t*0.90), 0.5+0.24*Math.cos(t*1.30));
                           set('right',0.5+0.32*Math.sin(t*0.75+2.4), 0.5+0.24*Math.cos(t*1.05+1.1)); }
    else { set(affSide(), 0.5+0.34*Math.sin(t*0.90), 0.5+0.26*Math.cos(t*1.30));
           handRaw[otherSide(affSide())].valid=false; }
    return;
  }
  // 遊戲階段：假手慢慢伸向最近的山豬（示範模式要看得出「真的在玩」，不是亂繞）
  const dt=demoPos._t?Math.min(0.1,(now-demoPos._t)/1000):0.016; demoPos._t=now;
  const k=1-Math.exp(-dt/0.20);            // 以時間為準的平滑（幀率低也會走到位）
  const sides=(cfg.side==='none')?['left','right']:[affSide()];
  if(sides.length===1) handRaw[otherSide(affSide())].valid=false;
  const live=targets.filter(t=>!t.hit&&t.kind!=='rooster');   // 示範假手只伸向可打目標，不去打公雞
  sides.forEach((sd,i)=>{
    // 鏡像後：解剖左手出現在畫面右半邊，所以左手負責右半邊的目標
    const half=(sides.length===2)?live.filter(t=>sd==='left'?t.x>CW/2:t.x<=CW/2):live;
    const tgt=(half.length?half:live)[0];
    const P=demoPos[sd]; let gx,gy;
    if(tgt){ const n=invMap(tgt.x,tgt.y); gx=n.x; gy=n.y; }
    else { gx=0.5+0.20*Math.sin(t*0.8+i*2.1); gy=0.5+0.15*Math.cos(t*1.1+i); }
    P.x+=(gx-P.x)*k; P.y+=(gy-P.y)*k;
    set(sd,P.x,P.y);
  });
}

const LS_KEY='mole_public_sessions';
const _mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function loadSessions(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){return[];} }
function _std(a,m){ if(a.length<2)return 0; return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/a.length); }
function buildSession(){
  const pres=Math.max(presented,hits);
  const rt=rts.slice(); const m=_mean(rt);                        // 每次命中的反應時間(ms)
  const avgRT=rt.length?Math.round(m):null, bestRT=rt.length?Math.round(Math.min(...rt)):null;
  const cvRT=rt.length>1&&m?Math.round(_std(rt,m)/m*100):null;    // 反應穩定度 CV%（越低越穩）
  const series=hitLog.map((h,i)=>[h.t, rt[i]]);                   // [相對時間ms, RT ms]
  let fatigue=null;                                              // 疲勞指數：後半局平均RT vs 前半局（正=後段變慢=疲勞）
  if(series.length>=4){ const mid=series.length>>1;
    const e=_mean(series.slice(0,mid).map(s=>s[1])), l=_mean(series.slice(mid).map(s=>s[1]));
    fatigue=e?Math.round((l-e)/e*100):null; }
  return { date:new Date().toISOString(), mode:cfg.mode, side:cfg.side, dur:cfg.dur,
    diff:cfg.diff, sizeFrac:cfg.sizeFrac, speed:cfg.speed, reach:cfg.reach, score, hits, presented:pres, misses:Math.max(0,pres-hits),
    accuracy: pres?Math.round(hits/pres*100):0, affPct: hits?Math.round(affHits/hits*100):0, cross,
    avgRT, bestRT, cvRT, fatigue, maxStreak, series, roosterShown, roosterHit };
}
/* ───── 民眾版結束畫面：先講成績，再白話講「剛剛在練什麼」 ───── */
function renderReport(){
  const s=buildSession(), sSave={...s};
  const all=loadSessions(); all.push(sSave); const saved=all.slice(-300);
  try{ localStorage.setItem(LS_KEY,JSON.stringify(saved)); }catch(e){}
  const prev=saved.length>=2?saved[saved.length-2]:null;

  const bestS = s.bestRT!=null ? (s.bestRT/1000).toFixed(2)+' 秒' : '–';
  const cheer = s.accuracy>=80 ? '太厲害了，山豬都被你趕跑！'
              : s.accuracy>=55 ? '做得很好！再玩一局會更順手。'
              : '有打到就是進步，慢慢來就好。';
  const better = prev ? ( s.score>prev.score ? `比上一局多了 ${s.score-prev.score} 分 👍`
                        : s.score===prev.score ? '和上一局一樣穩。'
                        : '這局稍微少一點，休息一下再來。') : '';

  const M=(k,v,sub)=>`<div class="metric"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub||''}</div></div>`;

  let roosterLine='';
  if(s.roosterShown>0){
    const dodged=s.roosterShown-s.roosterHit;
    if(s.roosterHit===0){
      roosterLine=`<p class="ref" style="margin-top:-2px">🐓 公雞出現 ${s.roosterShown} 次，忍住沒打 ${dodged} 次！忍功一流！</p>`;
    } else {
      roosterLine=`<p class="ref" style="margin-top:-2px">🐓 公雞出現 ${s.roosterShown} 次，忍住沒打 ${dodged} 次；誤打 ${s.roosterHit} 次 −${s.roosterHit*cfg.penalty} 分。</p>`;
    }
  }

  $('reportBody').innerHTML=`
    <div class="score-hero">
      <div class="big">趕走了 ${s.hits} 隻山豬！</div>
      <div class="cheer">${cheer}${better?'<br>'+better:''}</div>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(3,1fr);margin:18px 0 4px">
      ${M('分數',s.score,'')}
      ${M('打中率',s.accuracy+'%',`出現 ${s.presented} 隻`)}
      ${M('最快反應',bestS,'看到就出手')}
    </div>
    ${roosterLine}
    <div class="why">
      <h3>剛剛你在練什麼？</h3>
      <ul>
        <li><b>伸手去打</b>：練肩膀、手臂的力氣和活動範圍。</li>
        <li><b>手伸到另一邊</b>：練轉身和左右兩邊的協調。</li>
        <li><b>看到就馬上出手</b>：練眼睛和手的反應速度。</li>
        <li><b>坐著不晃</b>：練坐姿的穩定和身體的核心。</li>
      </ul>
    </div>
    <p class="ref">白話說：復健的重點是「同一個動作，開心地做很多次」。遊戲把重複練習變成有回饋、有分數的事，比乾坐著抬手更容易撐下去。<br>
      參考：Langhorne, P., Bernhardt, J., &amp; Kwakkel, G. (2011). Stroke rehabilitation. <i>The Lancet, 377</i>(9778), 1693–1702.<br>
      ※ 本遊戲為健康促進與居家活動用途，不能取代治療師的評估與治療。身體不適請立刻停止。</p>`;
}
function endGame(){
  phase='setup'; running=false; hud.classList.add('hidden'); if(AE)AE.stop();
  keepAwake(false); document.body.classList.remove('playing');   // 報表在直向手機也讀得下去，不要再擋轉向提示
  renderReport();
  endEl.classList.remove('hidden');
}
function backToSetup(){                      // 任何畫面 → 回遊戲設定（放棄本局，不出報表；鏡頭與模型保持載入，下次開始不用重載）
  phase='setup'; running=false; if(AE)AE.stop();
  keepAwake(false); document.body.classList.remove('playing');
  hud.classList.add('hidden'); calibEl.classList.add('hidden'); endEl.classList.add('hidden');
  loading.style.display='none';
  setupEl.classList.remove('hidden');
}

$('btnIntroGo').onclick=()=>{ introEl.classList.add('hidden'); setupEl.classList.remove('hidden'); };
$('btnShowIntro').onclick=()=>{ setupEl.classList.add('hidden'); introEl.classList.remove('hidden'); };
$('btnStart').onclick=beginSession;
$('btnCalibStart').onclick=startCapture;
$('btnCalibGo').onclick=()=>{ if(AE&&cfg.sound){AE.start();AE.setMuted(false);} startPlay(); };
$('btnRecalib').onclick=enterCalibIntro;
$('btnSetup').onclick=backToSetup;
$('btnCalibBack').onclick=backToSetup;
$('btnHome').onclick=backToSetup;
$('btnAgain').onclick=()=>{ endEl.classList.add('hidden'); running=true; document.body.classList.add('playing'); keepAwake(true); requestAnimationFrame(loop); startPlay(); };
$('btnReCalib2').onclick=()=>{ endEl.classList.add('hidden'); running=true; document.body.classList.add('playing'); keepAwake(true); requestAnimationFrame(loop); enterCalibIntro(); };
$('btnEnd').onclick=endGame;
$('btnMute').onclick=e=>{ cfg.sound=!cfg.sound; e.target.textContent=cfg.sound?'🔊':'🔇';
  if(AE){ if(cfg.sound){AE.start();AE.setMuted(false);} else AE.setMuted(true); } };

if(DEMO){ const d=$('demoNote'); if(d)d.classList.remove('hidden'); }
const hScore=$('hScore'),hTime=$('hTime');
resize();
</script>
