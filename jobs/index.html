    });

    if (state.step < 3) a.classList.add('hide');
    col.append(fresh(a, state.step === 3));
    page.append(col);
  },
  think(s, page, state) {
    head(page, '想想看', '想到就說，沒有標準答案');
    const ic = el('div', 'icons');
    s.icons.forEach(n => { const m = el('img'); m.src = n; m.alt = ''; ic.append(m); });
    const c = el('div', 'card grow', s.q2);
    if (!state.step) c.classList.add('hide');
    page.append(el('div', 'big-q', s.q1), ic, fresh(c, state.step === 1));
  },
  still(s, page) {
    head(page, '還在嗎', `${s.job}，現在還常看到嗎？`);
    const body = el('div', 'body');
    body.append(pic(s.img));
    const col = el('div', 'col');
    [[s.thumb, '比讚\n還常看到'], [s.wave, '揮手\n很少看到了']].forEach(([src, t]) => {
      const v = el('div', 'vote'), m = el('img'); m.src = src; m.alt = '';
      v.append(m, document.createTextNode(t)); col.append(v);
    });
    body.append(col); page.append(body);
  },
  flip(s, page, state) {
    head(page, '翻格猜', s.q);
    const body = el('div', 'body');
    const f = el('div', 'flip');
    f.append(pic(s.img));
    const g = el('div', 'tiles');
    for (let i = 0; i < 4; i++) {
      const t = el('button', 'tile' + (state.open.has(i) ? ' open' : ''), String(i + 1));
      t.setAttribute('aria-label', '翻開第 ' + (i + 1) + ' 格');
      t.onclick = () => { if (!state.open.has(i)) { state.open.add(i); state.step = state.open.size; t.classList.add('open'); syncNav(); } };
      g.append(t);
    }
    f.append(g); body.append(f);
    const col = el('div', 'col');
    col.append(state.step >= 5 ? fresh(el('div', 'card ans grow', s.answer), true) : el('div', 'card q-mark grow', '？'));
    body.append(col); page.append(body);
  },
  board(s, page, state) {
    page.classList.add('bpage');
    page.append(el('div', 'big-q', '我們這一團的百工圖'));
    const g = el('div', 'board');
    state.board = state.board || Array(12).fill('');
    state.board.forEach((t, i) => {
      const d = el('div', '', t);
      d.contentEditable = 'true'; d.setAttribute('aria-label', '填入工作 ' + (i + 1));
      d.oninput = () => { state.board[i] = d.textContent; };
      g.append(d);
    });
    page.append(g);
  },
  end(s, page) {
    page.classList.add('dark');
    const a = el('a', 'link', '更多長輩教案與遊戲：OTshih.com'); a.href = 'https://otshih.com/';
    const fb = el('a', 'link', '歡迎給我回饋與建議（粉專私訊）'); fb.href = 'https://www.facebook.com/shihyuting.OT';
    page.append(el('div', 'h1', s.title), el('div', 'h2', s.sub), el('div', 'small', s.by), fb, a, el('div', 'basis', s.basis));
  }
};
function answerPanel(s, page, state, chatText) {
  const body = el('div', 'body');
  body.append(fresh(pic(s.img, !portrait ? false : false), state.step === 1));
  const col = el('div', 'col');
  col.append(fresh(el('div', 'card ans', s.answer), state.step === 1));
  const c = el('div', 'card grow sm', chatText);
  if (state.step < 2) c.classList.add('hide');
  col.append(fresh(c, state.step === 2));
  body.append(col); page.append(body);
}
function soundPage(s, page, state, hasSound) {
  head(page, s.tag, s.q);
  if (state.step) return answerPanel(s, page, state, s.chat);
  const box = el(hasSound ? 'button' : 'div', 'speaker' + (hasSound ? '' : ' big'));
  const m = el('img'); m.src = s.icon; m.alt = ''; m.draggable = false; box.append(m);
  box.append(document.createTextNode(hasSound ? '點喇叭，聽一聽' : '請老師喊一聲，大家猜猜看'));
  if (hasSound) box.onclick = () => SYNTH[s.sound]();
  page.append(box);
}

// ---------- 自製音效（瀏覽器合成，不用任何錄音） ----------
let actx = null;
function ctx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function tone(f, t0, dur, type, vol) {
  const a = ctx(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  return o;
}
const SYNTH = {
  bell() { // 校園常見的四音鐘聲
    if (muted) return;
    const q = [659.25, 523.25, 587.33, 392, 392, 587.33, 659.25, 523.25];
    q.forEach((f, i) => { const t = i * .62 + (i > 3 ? .3 : 0); [1, 2, 2.76].forEach((k, j) => tone(f * k, t, 1.5 - j * .4, 'sine', .17 / (j + 1))); });
  },
  horn() { // 橡皮球喇叭，叭噗
    if (muted) return;
    [0, .42, 1.1, 1.52].forEach((t, i) => {
      const o = tone(i % 2 ? 330 : 415, t, .34, 'sawtooth', .12);
      o.frequency.setValueAtTime(i % 2 ? 330 : 415, ctx().currentTime + t);
      o.frequency.linearRampToValueAtTime(i % 2 ? 300 : 440, ctx().currentTime + t + .3);
    });
  },
  steam() { // 麵茶車的蒸氣汽笛
    if (muted) return;
    const a = ctx(), t = a.currentTime, o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o2.type = 'triangle';
    o.frequency.setValueAtTime(1500, t); o.frequency.linearRampToValueAtTime(1750, t + .4);
    o2.frequency.setValueAtTime(1508, t); o2.frequency.linearRampToValueAtTime(1762, t + .4);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .3);
    g.gain.setValueAtTime(.12, t + 2.6); g.gain.linearRampToValueAtTime(0, t + 3.2);
    o.connect(g); o2.connect(g); g.connect(a.destination);
    o.start(t); o2.start(t); o.stop(t + 3.3); o2.stop(t + 3.3);
  }
};
function chord() {
  if (muted) return;
  try { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * .09, .6, 'triangle', .16)); } catch (e) {}
}

// ---------- 導覽 ----------
function pending(s, state) { return state.step < maxStep(s); }
function next() {
  const s = SLIDES[idx], state = st[idx];
  if (pending(s, state)) {
    if (s.type === 'flip' && state.step < 4) {
      let i = 0; while (state.open.has(i)) i++;
      state.open.add(i);
      state.step = state.open.size;
      view.querySelectorAll('.tile')[i].classList.add('open');
      syncNav();
      return;
    }
    state.step++;
    justStepped = true;
    render();
    return;
  }
  go(idx + 1);
}
function go(n) {
  if (n < 0 || n >= SLIDES.length) return;
  idx = n; closeNotes(); render();
  try { history.replaceState(null, '', '#' + (idx + 1)); } catch (e) {}
}
function render() {
  const s = SLIDES[idx], page = el('div', 'page');
  view.replaceChildren(page);
  RENDER[s.type](s, page, st[idx]);
  justStepped = false;
  syncNav();
  preload(idx + 1); preload(idx + 2);
}
function preload(n) { const s = SLIDES[n]; if (!s) return; [s.img, s.img2].forEach(im => { if (im) new Image().src = im.src; }); }
function syncNav() {
  const s = SLIDES[idx], p = pending(s, st[idx]);
  $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;
  $('bar').style.width = (idx + 1) / SLIDES.length * 100 + '%';
  $('prev').style.visibility = idx ? 'visible' : 'hidden';
  $('home').style.visibility = idx ? 'visible' : 'hidden';
  $('next').style.visibility = (idx === SLIDES.length - 1 && !p) ? 'hidden' : 'visible';
  $('tip').style.visibility = s.note ? 'visible' : 'hidden';
  $('next').textContent = idx === 0 ? '開始 ›' : (p ? '翻開 ›' : '下一頁 ›');
}
// 回封面並把題目重置，下一場可以重新帶；百工圖內容保留
function goHome() {
  st.forEach(x => { x.step = 0; x.ans = null; x.open = new Set(); });
  go(0);
}
function closeNotes() { notesEl.classList.remove('on'); }
function toggleNotes() {
  if (notesEl.classList.contains('on')) return closeNotes();
  notesEl.replaceChildren(el('b', '', '帶領提示（只有帶領者需要看）'), document.createTextNode(SLIDES[idx].note || ''));
  notesEl.classList.add('on');
}
function setMute(v) { muted = v; store('jobs_mute', v ? '1' : '0'); $('snd').textContent = v ? '🔇' : '🔊'; }
function fit() {
  const iw = innerWidth, ih = innerHeight, p = ih > iw;
  if (p !== portrait) { portrait = p; stage.classList.toggle('portrait', p); render(); }
  const k = Math.min(iw / (p ? 1080 : 1920), ih / (p ? 1920 : 1080));
  stage.style.width = iw / k + 'px'; stage.style.height = ih / k + 'px';
  stage.style.transform = `scale(${k})`;
}
$('next').onclick = next;
$('prev').onclick = () => go(idx - 1);
$('home').onclick = goHome;
$('tip').onclick = toggleNotes;
$('snd').onclick = () => setMute(!muted);
$('fs').onclick = () => { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen(); };
view.addEventListener('click', e => {
  if (e.target.closest('button,a,[contenteditable]')) return;
  if (notesEl.classList.contains('on')) return closeNotes();
  const r = stage.getBoundingClientRect();
  if ((e.clientX - r.left) / r.width > .35) next(); else go(idx - 1);
});
let sx = null;
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 60) { e.preventDefault(); dx < 0 ? next() : go(idx - 1); }
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('[contenteditable]')) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); go(idx - 1); }
  else if (k === 'Home') { e.preventDefault(); goHome(); }
  else if (k === 'n' || k === 'N') toggleNotes();
  else if (k === 'm' || k === 'M') setMute(!muted);
  else if (k === 'f' || k === 'F') $('fs').click();
});
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
const h = parseInt(location.hash.slice(1), 10);
if (h >= 1 && h <= SLIDES.length) idx = h - 1;
setMute(muted);
portrait = innerHeight > innerWidth;
stage.classList.toggle('portrait', portrait);
render(); fit();
</script>
