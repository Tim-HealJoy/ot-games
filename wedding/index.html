const $ = id => document.getElementById(id);
const stage = $('stage'), view = $('view'), notesEl = $('notes');
const st = SLIDES.map(() => ({ open: new Set(), label: false, ans: null, step: 0 }));
let idx = 0, portrait = false, short = false;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let muted = store('wedding_mute') === '1';

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
// 依標點分行：手機上不要斷在詞的中間
function wrapCN(t, max) {
  if (!portrait || !t) return t;
  const out = []; let line = '';
  (t.match(/[^，、：？。]+[，、：？。]?/g) || [t]).forEach(seg => {
    if (line && (line + seg).length > max) { out.push(line); line = seg; }
    else line += seg;
  });
  if (line) out.push(line);
  return out.join('\n');
}
function frame(page) {
  const f = el('div', 'frame');
  for (let i = 0; i < 4; i++) f.append(el('i', '', '囍'));
  page.append(f);
}
function title(page, s) {
  const t = el('div', 'title');
  if (s.tag) t.append(el('span', 'pill', s.tag));
  t.append(document.createTextNode(wrapCN(s.title, 14)));
  page.append(t);
}
// 依圖片比例算出框的大小，圖片永遠完整不裁切
function box(im, maxW, maxH) {
  const r = im.w / im.h;
  let w = maxW, h = w / r;
  if (h > maxH) { h = maxH; w = h * r; }
  return { w: Math.round(w), h: Math.round(h) };
}
function pic(im, maxW, maxH, credit, alt) {
  const b = box(im, maxW, maxH), p = el('div', 'pic');
  p.style.width = b.w + 16 + 'px'; p.style.height = b.h + 16 + 'px';
  const i = el('img'); i.src = im.src; i.alt = alt || ''; i.draggable = false;
  p.append(i);
  if (credit) p.append(el('div', 'credit', '圖片來源：' + credit));
  return p;
}

const RENDER = {
  cover(s, page) {
    frame(page);
    page.append(el('div', 'xi', '囍'), el('div', 'h1', s.title), el('div', 'h2', s.sub), el('div', 'small', s.by), el('div', 'small', s.tip));
  },
  section(s, page) {
    frame(page);
    page.append(el('div', 'h2', s.no), el('div', 'h1', s.title), el('div', 'sub', s.sub));
  },
  chat(s, page) {
    frame(page);
    page.append(el('div', 'pill big', '聊聊看'), el('div', 'card qcard', s.q));
    if (s.hint) page.append(el('div', 'hint', wrapCN(s.hint, 18)));
  },
  saying(s, page, state) {
    frame(page);
    const ex = el('div', 'explain', wrapCN(s.explain, 17));
    if (!state.step) ex.classList.add('hide');
    page.append(el('div', 'pill big', '老人言'), el('div', 'card qcard say', s.say), ex);
    state.onStep = () => { ex.classList.remove('hide'); ex.classList.add('pop'); };
  },
  tiles(s, page, state) {
    title(page, s);
    const p = portrait ? pic(s.img, 1000, 1050, s.credit, s.label) : pic(s.img, 1200, short ? 660 : 690, s.credit, s.label);
    const g = el('div', 'tiles');
    g.style.gridTemplateColumns = `repeat(${s.cols},1fr)`;
    g.style.gridTemplateRows = `repeat(${s.rows},1fr)`;
    const n = s.rows * s.cols, tiles = [];
    for (let i = 0; i < n; i++) {
      const t = el('button', 'tile' + (state.open.has(i) ? ' open' : ''), String(i + 1));
      t.setAttribute('aria-label', '翻開第 ' + (i + 1) + ' 格');
      t.onclick = () => openTile(s, state, i);
      tiles.push(t); g.append(t);
    }
    p.append(g); page.append(p);
    const lb = el('div', 'label' + (state.label ? '' : ' hide'), s.label);
    page.append(lb);
    state.tiles = tiles; state.labelEl = lb; state.total = n;
  },
  grid(s, page, state) {
    title(page, s);
    const g = el('div', 'grid'), tiles = [];
    s.labels.forEach((lab, i) => {
      const c = el('div', 'cell'), im = el('img');
      im.src = s.cells[i].src; im.alt = lab; im.draggable = false;
      const t = el('button', 'tile' + (state.open.has(i) ? ' open' : ''), String(i + 1));
      t.setAttribute('aria-label', '翻開第 ' + (i + 1) + ' 格');
      t.onclick = () => openTile(s, state, i);
      tiles.push(t);
      c.append(im, el('span', '', lab), t);
      g.append(c);
    });
    page.append(g);
    state.tiles = tiles; state.total = s.labels.length; state.labelEl = null;
  },
  choice(s, page, state) {
    title(page, s);
    const opts = el('div', 'opts'), cards = [];
    [[s.a, s.aimg], [s.b, s.bimg]].forEach(([t, im], i) => {
      const c = el('button', 'opt ' + (im ? 'imgo' : 'txt'));
      if (im) {
        const m = el('img'); m.src = im.src; m.alt = ''; m.draggable = false;
        c.append(m, el('div', '', '①②'[i] + ' ' + t));
      } else {
        c.append(el('div', '', '①②'[i]), el('div', '', t));
      }
      c.onclick = () => answer(s, state, i);
      cards.push(c); opts.append(c);
    });
    const ex = el('div', 'explain', wrapCN(state.ans == null ? '請比 1 或比 2，大家都比完再點答案' : s.explain, 17));
    page.append(opts, ex);
    state.cards = cards; state.exEl = ex;
    if (state.ans != null) markChoice(s, state, false);
  },
  info(s, page, state) {
    title(page, s);
    const hideLines = s.hide && !state.step;
    if (s.imgs.length === 1) {
      const row = el('div', 'row');
      const p = portrait ? pic(s.imgs[0], 1000, 900, s.credits[0]) : pic(s.imgs[0], 1120, short ? 740 : 780, s.credits[0]);
      const c = el('div', 'card lines' + (hideLines ? ' hide' : ''), s.lines);
      row.append(p, c); page.append(row);
      state.onStep = () => { c.classList.remove('hide'); c.classList.add('pop'); };
    } else {
      const row = el('div', 'row');
      s.imgs.forEach((im, i) => row.append(portrait ? pic(im, 900, 610, s.credits[i]) : pic(im, 860, 620, s.credits[i])));
      const cap = portrait ? s.lines.replace('左：', '上：').replace('右：', '下：').replace('　', '\n') : s.lines;
      page.append(row, el('div', 'card caption', cap));
    }
  },
  name(s, page, state) {
    title(page, s);
    const c = el('div', 'card names');
    const after = el('b', state.step >= 1 ? '' : 'hide', s.after);
    c.append(el('span', '', s.before), el('em', '', '→'), after);
    const ex = el('div', 'explain' + (state.step >= 2 ? '' : ' hide'), wrapCN(s.explain, 17));
    page.append(c, ex);
    state.onStep = () => {
      if (state.step === 1) { after.classList.remove('hide'); after.classList.add('pop'); }
      else { ex.classList.remove('hide'); ex.classList.add('pop'); }
    };
  },
  closing(s, page) {
    frame(page);
    page.append(el('div', 'xi', '囍'), el('div', 'sub', s.line1), el('div', 'h2', s.line2));
  },
  end(s, page) {
    frame(page);
    const a = el('a', 'link', '更多長輩教案與遊戲：OTshih.com');
    a.href = 'https://otshih.com/';
    const fb = el('a', 'link', '歡迎給我回饋與建議（粉專私訊）');
    fb.href = 'https://www.facebook.com/shihyuting.OT';
    page.append(el('div', 'h1', s.title), el('div', 'h2', s.sub), el('div', 'small', '編修：施昱廷 職能治療師'), fb, a);
  }
};

function openTile(s, state, i) {
  if (state.open.has(i)) return;
  state.open.add(i);
  state.tiles[i].classList.add('open');
  syncNav();
}
function answer(s, state, i) {
  if (state.ans != null) return;
  state.ans = i;
  markChoice(s, state, true);
  syncNav();
}
function markChoice(s, state, fx) {
  const right = state.cards[s.answer];
  right.classList.add('right');
  state.exEl.textContent = wrapCN(s.explain, 17);
  if (!fx) return;
  state.exEl.classList.add('pop');
  if (state.ans !== s.answer && state.ans >= 0) state.cards[state.ans].classList.add('wrong');
  if (state.ans === s.answer) {
    right.append(el('div', 'yes', '答對了！'));
    for (let k = 0; k < 10; k++) {
      const a = k / 10 * Math.PI * 2, st8 = el('div', 'star', '★');
      st8.style.setProperty('--x', Math.cos(a) * 330 + 'px');
      st8.style.setProperty('--y', Math.sin(a) * 220 + 'px');
      right.append(st8);
    }
    chord();
  }
}
let actx = null;
function chord() {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .09;
      o.type = 'triangle'; o.frequency.value = f;

      g.gain.linearRampToValueAtTime(.16, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + .6);

      o.start(t); o.stop(t + .62);

}

// 這一頁還有沒翻開的內容？
function pending(s, state) {
  if (s.type === 'tiles') return state.open.size < state.total || !state.label;
  if (s.type === 'grid') return state.open.size < state.total;
  if (s.type === 'choice') return state.ans == null;
  if (s.type === 'saying') return !state.step;
  if (s.type === 'name') return state.step < 2;
  if (s.type === 'info') return s.hide && !state.step;
  return false;
}
function next() {
  const s = SLIDES[idx], state = st[idx];
  if (pending(s, state)) {
    if (s.type === 'tiles' || s.type === 'grid') {
      if (state.open.size < state.total) {
        let i = 0; while (state.open.has(i)) i++;
        openTile(s, state, i);
      } else {
        state.label = true;
        state.labelEl.classList.remove('hide'); state.labelEl.classList.add('pop');
      }
    } else if (s.type === 'choice') {
      answer(s, state, -1);
    } else {
      state.step++; state.onStep && state.onStep();
    }
    syncNav();
    return;
  }
  go(idx + 1);
}
function go(n) {
  if (n < 0 || n >= SLIDES.length) return;
  idx = n;
  closeNotes();
  render();
  try { history.replaceState(null, '', '#' + (idx + 1)); } catch (e) {}
}
function render() {
  const s = SLIDES[idx], page = el('div', 'page');
  view.replaceChildren(page);
  RENDER[s.type](s, page, st[idx]);
  syncNav();
  preload(idx + 1); preload(idx + 2);
}
function preload(n) {
  const s = SLIDES[n];
  if (!s) return;
  [s.img, s.aimg, s.bimg, ...(s.imgs || []), ...(s.cells || [])].forEach(im => { if (im) new Image().src = im.src; });
}
function syncNav() {
  $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;
  $('bar').style.width = (idx + 1) / SLIDES.length * 100 + '%';
  $('prev').style.visibility = idx ? 'visible' : 'hidden';
  $('next').style.visibility = (idx === SLIDES.length - 1 && !pending(SLIDES[idx], st[idx])) ? 'hidden' : 'visible';
  $('tip').style.visibility = SLIDES[idx].note ? 'visible' : 'hidden';
  $('next').textContent = idx === 0 ? '開始 ›' : (pending(SLIDES[idx], st[idx]) ? '翻開 ›' : '下一頁 ›');
}
function closeNotes() { notesEl.classList.remove('on'); }
function toggleNotes() {
  if (notesEl.classList.contains('on')) return closeNotes();
  notesEl.replaceChildren(el('b', '', '帶領提示（只有帶領者需要看）'), document.createTextNode(portrait && (SLIDES[idx].imgs || []).length === 2 ? SLIDES[idx].note.replace('左圖', '上圖') : (SLIDES[idx].note || '')));
  notesEl.classList.add('on');
}
function setMute(v) {
  muted = v; store('wedding_mute', v ? '1' : '0');
  $('snd').textContent = v ? '🔇' : '🔊';
}
function fit() {
  const iw = innerWidth, ih = innerHeight, p = ih > iw, sh = !p && ih < 500;
  if (p !== portrait || sh !== short) {
    portrait = p; short = sh;
    stage.classList.toggle('portrait', p);
    stage.classList.toggle('short', sh);
    render();
  }
  const k = Math.min(iw / (p ? 1080 : 1920), ih / (p ? 1920 : 1080));
  stage.style.width = iw / k + 'px';
  stage.style.height = ih / k + 'px';
  stage.style.transform = `scale(${k})`;
}

$('next').onclick = next;
$('prev').onclick = () => go(idx - 1);
$('tip').onclick = toggleNotes;
$('snd').onclick = () => setMute(!muted);
$('fs').onclick = () => {
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen();
  else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen();
};
// 點畫面空白處：右邊下一步、左邊上一步；可以左右滑
view.addEventListener('click', e => {
  if (e.target.closest('button,a')) return;
  if (notesEl.classList.contains('on')) return closeNotes();
  const r = stage.getBoundingClientRect();
  if ((e.clientX - r.left) / r.width > .35) next(); else go(idx - 1);
});
let sx = null;
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 60) { e.preventDefault(); dx < 0 ? next() : go(idx - 1); }
});
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); go(idx - 1); }
  else if (k === 'n' || k === 'N') toggleNotes();
  else if (k === 'm' || k === 'M') setMute(!muted);
  else if (k === 'f' || k === 'F') $('fs').click();
  else if ((k === '1' || k === '2') && SLIDES[idx].type === 'choice') answer(SLIDES[idx], st[idx], +k - 1);
});
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);

const h = parseInt(location.hash.slice(1), 10);
if (h >= 1 && h <= SLIDES.length) idx = h - 1;
setMute(muted);
portrait = innerHeight > innerWidth;
short = !portrait && innerHeight < 500;
stage.classList.toggle('portrait', portrait);
stage.classList.toggle('short', short);
render();
fit();
</script>
