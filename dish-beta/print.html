<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>食材上菜秀 — 帶領者提示卡</title>
<style>
:root{--ink:#1c1c1a;--soft:#5a564d;--indigo:#3F6293;--amber:#E8A23A;--cream:#F4EFE3}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:#eee;font-size:13px;line-height:1.5}
.page{width:210mm;height:297mm;overflow:hidden;margin:10mm auto;background:#fff;padding:14mm 14mm 12mm;position:relative}
h1{font-size:22px;margin:0 0 4px;color:var(--indigo)}
.sub{color:var(--soft);margin-bottom:10px}
.intro{background:var(--cream);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.intro b{color:var(--indigo)}
.group{border:2px solid var(--indigo);border-radius:10px;margin-bottom:10px;overflow:hidden;break-inside:avoid}
.group .head{background:var(--indigo);color:#fff;padding:5px 12px;font-weight:900;font-size:15px;display:flex;justify-content:space-between}
.group .head span{font-weight:600;font-size:12px;opacity:.9}
table{width:100%;border-collapse:collapse}
td,th{border-top:1px solid #ddd;padding:5px 8px;vertical-align:top;text-align:left}
th{background:#f6f6f2;font-size:12px;color:var(--soft);font-weight:700;width:14%}
td.dish{font-weight:900;font-size:15px;color:var(--indigo);width:18%;white-space:nowrap}
td.dish small{display:block;font-weight:600;color:var(--soft);font-size:11px}
.ings b{color:#C4622F}
.talk{background:#fff8e8;padding:6px 12px;border-top:2px solid var(--amber);font-weight:700}
.talk small{font-weight:600;color:var(--soft)}
.foot{position:absolute;bottom:8mm;left:14mm;right:14mm;display:flex;justify-content:space-between;color:var(--soft);font-size:11px}
.toolbar{position:fixed;top:10px;right:10px}
.toolbar button{font-size:14px;padding:8px 16px;border-radius:999px;border:none;background:var(--indigo);color:#fff;font-weight:800;cursor:pointer}
@media print{body{background:#fff}.page{margin:0;width:auto;height:auto;padding:10mm 12mm;page-break-after:always}.page:last-child{page-break-after:auto}.toolbar{display:none}}
</style>
</head>
<body>
<div class="toolbar"><button onclick="print()">🖨 列印</button></div>
<div id="pages"></div>
<script src="questions.js?v=1"></script>
<script>
const G = window.GROUPS;
const header = `<h1>食材上菜秀 · 帶領者提示卡</h1>
  <div class="sub">6 種食材 × 2 道台灣家常菜｜四拍節奏：猜 → 揭曉 → 故事 → 聊聊看｜每組約 6～8 分鐘</div>
  <div class="intro">
    <b>帶法：</b>主食材登場先請長輩命名 → 配料一張一張出現，每出一張問「加了這個會是什麼菜？」→ 猜不出來先給<b>口感提示</b>、再給<b>場合提示</b>（投影上按 💡 或 H 鍵）→ 揭曉後念一句故事 → 用<b>二選一問句</b>帶分享。
    答錯不糾正，任何答案都接住：「對，那也是白菜可以做的菜！」
  </div>`;
const groupHtml = (g,gi)=>`
<div class="group">
  <div class="head"><div>第 ${gi+1} 組 ${g.name}</div><span>${g.intro}</span></div>
  <table>
    ${g.dishes.map((d,di)=>`<tr>
      <td class="dish">${d.name}<small>${d.level}</small></td>
      <td class="ings"><b>配料順序：</b>${d.ings.map(x=>x.name).join(' → ')}<br>
        <b>提示 ①</b> ${d.hint2}　<b>提示 ②</b> ${d.hint3}<br>
        <b>故事：</b>${d.story}</td>
    </tr>`).join('')}
  </table>
  <div class="talk">聊聊看：${g.talk.q}　<small>延伸：${g.talk.ext.map(x=>x.name).join('、')}</small></div>
</div>`;
const foot = (n,t)=>`<div class="foot"><span>教案設計：施昱廷 職能治療師</span><span>投影版：games.otshih.com　${n}／${t}</span></div>`;
const pages = [G.slice(0,3), G.slice(3)];
document.getElementById('pages').innerHTML = pages.map((gs,pi)=>`<div class="page">${pi===0?header:'<h1 style="font-size:16px;color:#5a564d">食材上菜秀 · 帶領者提示卡（續）</h1>'}${gs.map((g)=>groupHtml(g, G.indexOf(g))).join('')}${foot(pi+1,pages.length)}</div>`).join('');
</script>
</body>
</html>
