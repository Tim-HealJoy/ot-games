<style>
:root{--ink:#2b2622;--cream:#fbf5e6;--paper:#fffdf6;--line:#e4d9c0;--org:#e8622c;--grn:#2f9a63;--red:#d8362f;--blu:#2c6fb3;--mut:#766c5e;--gold:#ffd24a;
  --f:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2f36;color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;height:100dvh;overflow:hidden;background:#cfe6ee}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 共用元件 */
.btn{appearance:none;border:3px solid var(--ink);border-radius:14px;background:var(--paper);font:900 clamp(17px,2vw,21px) var(--f);color:var(--ink);padding:13px 22px;box-shadow:0 4px 0 rgba(43,38,34,.85);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,38,34,.85)}
.btn.pri{background:var(--org);color:#fff}.btn.grn{background:var(--grn);color:#fff}.btn.ghost{font-size:16px;padding:8px 14px;min-height:44px;border-width:2px;box-shadow:0 2px 0 rgba(43,38,34,.85)}
.btn:focus-visible,.rc:focus-visible,.pc:focus-visible,.seg button:focus-visible{outline:4px solid var(--blu);outline-offset:2px}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 rgba(43,38,34,.85)}.seg button{appearance:none;border:0;background:var(--paper);font:900 16px var(--f);color:var(--ink);padding:8px 14px;min-height:44px;cursor:pointer}.seg button+button{border-left:3px solid var(--ink)}.seg button.on{background:var(--org);color:#fff}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:9px;padding:1px 9px;font-size:13.5px;font-weight:800;background:var(--paper)}
.pill.t{background:var(--gold)}
.scr{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.scr.on{display:block}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(43,38,34,.9);padding:clamp(14px,2.2vw,24px)}
h2{margin:0;font-size:clamp(24px,3vw,34px);font-weight:900}
/* 首頁 */
#home{display:none;flex-direction:column;justify-content:safe center;align-items:flex-start;padding-left:clamp(20px,7vw,90px)}
#home.on{display:flex}
.logo{font-size:clamp(50px,9vw,104px);font-weight:900;line-height:1.05;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.sub{margin:6px 0 22px;font-size:clamp(17px,2.2vw,24px);font-weight:900;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 13px}
.homeBtns{display:flex;flex-direction:column;gap:13px;width:min(380px,88vw)}
.homeBtns .btn{font-size:clamp(20px,2.6vw,26px);padding:15px 20px;text-align:left}
.homeBtns small{display:block;font-size:14px;font-weight:700;opacity:.9;margin-top:1px}
/* 路線 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
#packs{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,3.5fr);gap:18px}@media(max-width:860px){#packs{grid-template-columns:1fr}}
.pack{margin-top:12px;min-width:0}.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:9px}.ph b{font-size:clamp(19px,2vw,23px);font-weight:900}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.rc .th{aspect-ratio:16/8.4}
.rc{appearance:none;display:block;text-align:left;padding:0;font:inherit;color:inherit;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 rgba(43,38,34,.85);overflow:hidden;cursor:pointer;width:100%}
.rc:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,38,34,.85)}
.rc .th{position:relative;aspect-ratio:16/9;background:#d9cfb8}.rc .th img{width:100%;height:100%;object-fit:cover;display:block}
.lvl{position:absolute;left:7px;top:7px;background:rgba(43,38,34,.88);color:#fff;border-radius:8px;padding:1px 8px;font-size:13.5px;font-weight:900}.lvl i{font-style:normal;color:var(--gold);margin-left:4px}
.startTag{position:absolute;right:7px;top:7px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 7px;font-size:13.5px;font-weight:900}
.rtag{display:block;font-size:14.5px;color:var(--mut);font-weight:700;line-height:1.35;margin:2px 0 6px}.soon{margin:8px 2px 0;font-size:14.5px;color:var(--mut);font-weight:700}
.rinfo{display:block;font-size:14px;font-weight:900;color:var(--org);margin:-3px 0 6px}
.rc .tt{padding:7px 10px 9px}.rc .tt b{display:block;font-size:17px;font-weight:900;line-height:1.25}
.stars{color:#d98a1f;font-size:13.5px;letter-spacing:1px}
.medals{display:flex;gap:4px;flex-wrap:wrap}.medal{border-radius:8px;border:2px solid #cfc4ad;padding:0 6px;font-size:13px;font-weight:900;background:#f6f0e0;color:#a2967f}.medal.on{background:var(--gold);color:var(--ink);border-color:var(--ink)}
/* 選角色 */

@media(min-width:900px){#pick{padding-left:44%}}
@media(max-width:899px){#pick{padding-top:38vh}}
@media(max-width:899px) and (max-height:500px){#pick{padding-top:10px;padding-left:42%}#pick .panel{padding:10px 12px;width:100%}#pick .lab{margin:6px 0 4px;font-size:16px}#pick .pc small{display:none}#pick h2{font-size:21px}#pick .grid4{gap:6px}}

.pc{appearance:none;padding:0;font:inherit;color:inherit;border:3px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden;cursor:pointer;box-shadow:0 3px 0 rgba(43,38,34,.85);text-align:center}
.pc img{width:100%;aspect-ratio:13/10;object-fit:cover;display:block}.pc b{display:block;font-size:clamp(14px,1.5vw,16.5px);font-weight:900;padding:3px 2px 0;line-height:1.2}.pc small{display:block;font-size:13px;color:var(--mut);font-weight:700;padding-bottom:4px}
.pc.on{outline:4px solid var(--org);outline-offset:1px;background:#ffe9c2}
.lab{font-weight:900;font-size:18px;margin:12px 0 6px}
/* 大廳 */
.lobbyGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
@media(max-width:820px){.lobbyGrid{grid-template-columns:1fr}}
#qr,#qrOwn{background:#fff;padding:12px;border-radius:14px;border:3px solid var(--ink);width:min(300px,100%);aspect-ratio:1;display:grid;place-items:center;margin:8px auto;font-size:15px;color:var(--mut);text-align:center}
#qr img,#qr canvas,#qrOwn img,#qrOwn canvas{width:100%!important;height:auto!important;display:block}
.roomBox{display:inline-flex;align-items:baseline;gap:8px;font-weight:900;font-size:17px;margin-top:2px}.roomBox b{font-size:clamp(30px,4vw,40px);letter-spacing:.14em;color:var(--org);font-variant-numeric:tabular-nums}
.steps{margin:6px auto 8px;padding:0;list-style:none;font-size:18px;font-weight:800;text-align:left;width:fit-content;line-height:1.7}
.slot{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:15px;padding:10px;margin-bottom:12px;box-shadow:0 3px 0 rgba(43,38,34,.85)}
.slot .num{font-size:28px;font-weight:900}.slot.p1 .num{color:var(--org)}.slot.p2 .num{color:var(--blu)}
.slot img{width:96px;height:74px;object-fit:cover;border-radius:9px;border:2px solid var(--ink);background:#eee}
.slot .st{font-weight:800;color:var(--mut);font-size:15px}.slot.ready .st{color:var(--grn)}
.slot .kb{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
#qrUrl{font-weight:800;font-size:15px;color:var(--ink);word-break:break-all;margin-top:2px}#qrHelp b,#qrOwnHelp b{color:var(--ink)}
.tipBox{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15.5px;font-weight:700;color:var(--mut);margin-bottom:12px}.tipBox b{color:var(--org)}
/* 倒數與讀取 */
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(90px,24vw,220px);font-weight:900;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;pointer-events:none;z-index:5}
#count.on{display:flex}
#brief{position:absolute;left:50%;top:clamp(64px,12vh,120px);transform:translateX(-50%);width:min(600px,92%);display:none;background:rgba(255,253,246,.97);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(43,38,34,.85);padding:10px 16px;text-align:center;pointer-events:none;z-index:6}#brief.on{display:block}#brief b{display:block;font-size:clamp(22px,3vw,30px);font-weight:900}#brief span{display:block;font-size:clamp(16px,2vw,19px);font-weight:700;color:var(--mut);line-height:1.4}#brief em{display:block;font-style:normal;font-size:clamp(16px,2vw,19px);font-weight:900;color:var(--org);margin-top:3px}
#pauseBox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(32,28,24,.55);z-index:7;padding:16px}#pauseBox.on{display:flex}#pauseBox .card{width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center}
#load{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(32,28,24,.6);color:#fff;font-size:26px;font-weight:900;z-index:6}#load.on{display:flex}
/* HUD */
body:not(.riding) #hudLayer{display:none}
.vp{position:absolute;top:0;bottom:0;overflow:hidden;pointer-events:none}
.vp.solo{left:0;right:0}.vp.left{left:0;width:50%}.vp.right{right:0;width:50%}
#divider{position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;background:var(--ink);display:none;z-index:2}
.tint{position:absolute;inset:0;background:#e88a3c;mix-blend-mode:multiply;opacity:0}
.flash{position:absolute;inset:0;opacity:0;background:#fff}.vig{position:absolute;inset:0;opacity:0;box-shadow:inset 0 0 110px 34px rgba(216,54,47,.9)}
.hudTop{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.chips{display:flex;gap:7px}
.chip{background:rgba(255,253,246,.95);border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 rgba(43,38,34,.85);padding:4px 10px;line-height:1.15;white-space:nowrap}
.chip small{display:block;font-size:13px;font-weight:700;color:var(--mut)}.chip b{font-size:clamp(17px,2vw,21px);font-weight:900;font-variant-numeric:tabular-nums}
.clock.late b{color:var(--red)}.speedV{color:var(--org)}
.mid{flex:1;max-width:330px;min-width:90px;text-align:center}
.gauge{position:relative;height:25px;border:2px solid var(--ink);border-radius:11px;background:#fffdf6;overflow:hidden;box-shadow:0 3px 0 rgba(43,38,34,.85)}.gauge.low{animation:lowHp .55s ease-in-out infinite alternate}@keyframes lowHp{to{box-shadow:0 0 0 4px rgba(216,54,47,.75)}}
.gaugeFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--grn);transition:width .25s,background .25s}
.gaugeLabel{position:absolute;inset:0;font-size:14px;line-height:21px;font-weight:900;text-shadow:0 0 3px #fffdf6,0 0 3px #fffdf6}.gaugeLabel b{font-variant-numeric:tabular-nums}
.progress{position:relative;height:9px;margin:8px 10px 0;border-radius:5px;background:rgba(43,38,34,.55)}.progress::after{content:'🏁';position:absolute;right:-13px;top:-9px;font-size:16px;line-height:1}
.progressFill{height:100%;width:0;background:var(--gold);border-radius:5px}
.dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--ink);display:block}
.dotRi{display:none}.duel .dotRi{display:block}.dotMe{background:var(--org)}.dotRi{background:var(--blu)}.vp.right .dotMe{background:var(--blu)}.vp.right .dotRi{background:var(--org)}
.lead{font-weight:900;font-size:15px;margin-top:4px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 5px var(--ink)}
.combo{display:none;margin-top:5px;font-size:18px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 10px rgba(232,98,44,.9)}.combo.on{display:block}
.tag{position:absolute;left:12px;bottom:12px;background:var(--org);color:#fff;border:2px solid var(--ink);border-radius:9px;padding:2px 11px;font-weight:900;font-size:17px;display:none}
.duel .tag{display:block}.vp.right .tag{background:var(--blu)}
.zone{position:absolute;left:12px;top:clamp(76px,10vh,92px);background:#17559b;color:#fff;border:2px solid #fff;border-radius:7px;padding:4px 12px;font-size:clamp(15px,1.8vw,18px);font-weight:900;opacity:0;transition:opacity .35s;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.zone.on{opacity:1}
.toasts{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:94%}
.toast{font-weight:900;font-size:clamp(18px,2.6vw,29px);color:#fff;padding:3px 14px;border-radius:9px;border:2px solid var(--ink);box-shadow:0 3px 0 rgba(43,38,34,.85);animation:pop 1.45s ease forwards;white-space:nowrap}
.toast.good{background:var(--grn)}.toast.ok{background:var(--blu)}.toast.warn{background:#d98a1f}.toast.bad{background:var(--red)}.toast.see{background:#fff;color:var(--ink);font-size:clamp(14px,1.8vw,18px);animation-duration:.9s}
@keyframes pop{0%{transform:translateY(12px) scale(.82);opacity:0}12%{transform:none;opacity:1}78%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
.hint{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);max-width:88%;text-align:center;background:rgba(43,38,34,.88);color:#fff;font-size:clamp(15px,2vw,20px);font-weight:800;padding:7px 15px;border-radius:11px;opacity:0;transition:opacity .3s}
.hint.on{opacity:1}
.banner{position:absolute;left:50%;top:clamp(92px,15vh,130px);transform:translateX(-50%);background:var(--gold);border:2px solid var(--ink);border-radius:11px;box-shadow:0 3px 0 rgba(43,38,34,.85);padding:4px 14px;font-size:clamp(16px,2.2vw,22px);font-weight:900;display:none;white-space:nowrap}.banner.on{display:block}
.notice{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);max-width:90%;background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:11px;padding:5px 14px;font-size:clamp(16px,2vw,20px);font-weight:900;display:none;text-align:center}.notice.on{display:block}
.ko{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(32,28,24,.5);color:#fff;text-align:center}.ko.on{display:flex}.koT{font-size:clamp(48px,10vw,104px);font-weight:900;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}.koS{font-size:clamp(19px,3vw,32px);font-weight:900;text-shadow:0 2px 0 var(--ink)}
#tools{position:absolute;right:12px;bottom:12px;display:none;gap:7px;z-index:3;pointer-events:auto}
body.riding #tools{display:flex}
/* 手機單人操作鈕 */
.pad{position:absolute;display:none;pointer-events:auto;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(43,38,34,.85);font:900 19px var(--f);color:var(--ink);align-items:center;justify-content:center;touch-action:none;cursor:pointer;z-index:3}
body.riding.touch .pad.show{display:flex}
#brake{right:max(20px,env(safe-area-inset-right));bottom:max(64px,env(safe-area-inset-bottom));width:clamp(92px,17vmin,126px);height:clamp(92px,17vmin,126px);border-radius:50%;background:#ff7a5c;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#brake.down{transform:translateY(4px);background:#d8362f}
#lBtn,#rBtn{bottom:max(20px,env(safe-area-inset-bottom));width:clamp(68px,13vmin,92px);height:clamp(68px,13vmin,92px);border-radius:18px;background:rgba(255,253,246,.92);font-size:30px}
#lBtn{left:max(20px,env(safe-area-inset-left))}#rBtn{left:calc(max(20px,env(safe-area-inset-left)) + clamp(78px,15vmin,106px))}
#lBtn.down,#rBtn.down{background:var(--gold)}
/* 結算 */
#result .box{max-width:960px;margin:auto}
.rHead{text-align:center}.rWin{font-size:clamp(28px,4vw,42px);font-weight:900;margin:0;line-height:1.15}
.duelCols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:10px}
.rCol{background:var(--paper);border:3px solid var(--ink);border-radius:15px;padding:12px;text-align:center}.rCol.win{background:#fff3c9;outline:4px solid var(--gold)}
.rCol img{height:clamp(84px,15vh,120px);width:auto;max-width:70%;border-radius:10px;border:2px solid var(--ink)}
.soloGrid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,400px);gap:16px;justify-content:center;align-items:start;margin-top:8px}@media(max-width:820px){.soloGrid{grid-template-columns:1fr}}
.soloSide .rBtns{margin-top:0;flex-direction:column}.soloSide .rBtns .btn{width:100%}.soloSide .tips{margin-top:12px}
.rScore{font-size:clamp(34px,5vw,48px);font-weight:900;color:var(--org);line-height:1.1}
.rTitle{font-size:21px;font-weight:900}.rDesc{color:var(--mut);font-weight:700;font-size:16px}
.stamps{display:flex;justify-content:center;gap:6px;margin:8px 0}.sc{width:clamp(92px,28%,118px);display:flex;flex-direction:column;align-items:center}.sc small{font-size:13.5px;font-weight:800;color:var(--mut);line-height:1.25;margin-top:4px}.stamp{width:64px;height:64px;border-radius:50%;border:3px dashed #b9ad97;color:#b9ad97;display:grid;place-items:center;font-weight:900;font-size:15px;transform:rotate(-8deg)}.stamp.got{border:4px solid var(--red);color:var(--red);background:#fff3e8}
.stats{font-size:15.5px;color:var(--mut);font-weight:700}
.tips{margin-top:12px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-size:15px}.tips b{color:var(--org)}
.fb{margin-top:12px;text-align:center;font-weight:800;font-size:15px}.fb a{color:var(--blu)}
.rBtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hudLayer"></div>
  <div id="divider"></div>
  <div id="count"></div><div id="brief"></div>
  <div id="tools"><button class="btn ghost" id="sndBtn" aria-label="聲音開關">🔊</button><button class="btn ghost" id="tiltBtn" style="display:none;background:var(--gold)">開啟傾斜</button><button class="btn ghost" id="zeroBtn" style="display:none">方向歸零</button><button class="btn ghost" id="pauseBtn">⏸ 暫停</button></div>
  <button class="pad" id="brake">煞車</button><button class="pad" id="lBtn">◀</button><button class="pad" id="rBtn">▶</button>

  <section class="scr" id="home">
    <div class="logo">騎遍台灣</div>
    <div class="sub">騎上鐵馬回家吃飯，騎上機車趕去打卡</div>
    <div class="homeBtns">
      <button class="btn pri" id="goSolo">一個人騎<small>電腦看畫面，手機當方向盤</small></button>
      <button class="btn" id="goJoin" style="display:none;background:var(--gold)">接電腦螢幕玩<small>電腦看畫面，手機當方向盤</small></button>
      <button class="btn" id="goDuel" style="background:var(--gold)">兩個人比<small>各用一支手機，掃 QR 對戰</small></button>
      <button class="btn" id="goHowPhone">只有手機？<small>掃 QR，直接在手機上玩</small></button>
    </div>
    <a id="httpNote" href="#" style="display:none;margin-top:12px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;color:var(--red);width:min(380px,88vw)">這個網址讀不到手機傾斜。點這裡改開正式網址</a>
  </section>

  <section class="scr" id="howPhone">
    <div class="card" style="max-width:520px;margin:auto;text-align:center">
      <div class="top"><h2>直接在手機上玩</h2><button class="btn ghost" id="howBack">← 回首頁</button></div>
      <div id="qrOwn">載入中</div>
      <ol class="steps"><li>① 用手機掃這個 QR</li><li>② 按「用這支手機玩」</li><li>③ 選路線，傾斜手機轉向</li></ol>
      <div style="font-size:15px;font-weight:800;color:var(--mut)" id="qrOwnHelp"></div>
    </div>
  </section>

  <section class="scr" id="routes">
    <div class="card" style="max-width:1120px;margin:auto">
      <div class="top"><h2>今天騎哪一條？</h2><div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="seg" id="modeSeg" role="group" aria-label="人數"><button id="modeSolo">一個人騎</button><button id="modeDuel">兩個人比</button></div><button class="btn ghost" id="routesBack">← 回首頁</button></div></div>
      <div class="stats" id="medalCount"></div>
      <div id="packs"></div>
    </div>
  </section>

  <section class="scr" id="pick">
    <div class="card panel">
      <div class="top"><h2 id="pickTitle">選角色和車</h2><button class="btn ghost" id="pickBack">← 換路線</button></div>
      <div class="lab">誰來騎？</div><div class="grid4" id="charGrid"></div>
      <div class="lab">騎什麼車？</div><div class="grid4" id="vehGrid"></div>
      <p style="margin:9px 0 0;font-size:15px;color:var(--mut);font-weight:700">每台車性能相同，只差外觀。<span id="pickHelp"></span></p>
      <div id="pickGoWrap"><button class="btn pri" id="pickGo" style="width:100%">出發！</button></div>
    </div>
  </section>

  <section class="scr" id="lobby">
    <div class="card" style="max-width:1020px;margin:auto">
      <div class="top"><h2 id="lobbyTitle">兩個人比</h2><button class="btn ghost" id="lobbyBack">← 換路線</button></div>
      <div class="lobbyGrid">
        <div style="text-align:center">
          <div style="font-weight:900;font-size:clamp(18px,2vw,22px)" id="lobbyStep1">① 兩個人各用手機掃這裡</div>
          <div id="qr">載入中</div>
          <div class="roomBox">房間碼 <b id="roomCode">----</b></div><div id="qrUrl"></div><div style="font-size:15px;font-weight:800;color:var(--mut);margin-top:4px" id="qrHelp"></div>
        </div>
        <div>
          <div style="font-weight:900;font-size:clamp(18px,2vw,22px);margin-bottom:8px">② 在手機上選角色和車，按準備</div>
          <div class="tipBox" id="lobbyTip"></div>
          <div class="slot p1" id="slot1"></div>
          <div class="slot p2" id="slot2"></div>
          <div style="font-size:15px;font-weight:700;color:var(--mut)" id="lobbyNote"></div>
          <button class="btn" id="kbGo" style="width:100%;margin-top:12px">不用手機，直接用鍵盤騎 →</button>
        </div>
      </div>
    </div>
  </section>

  <section class="scr" id="result"><div class="card box" id="resultBox"></div></section>
  <div id="pauseBox"><div class="card"><h2>暫停中</h2><button class="btn pri" id="resume">繼續騎</button><button class="btn" id="restartBtn">這條路重新開始</button><button class="btn ghost" id="quit">回選路線</button></div></div>
  <div id="load">路面鋪設中…</div>
</div>
<template id="hudT">
  <div class="vp">
    <div class="tint"></div><div class="flash"></div><div class="vig"></div>
    <div class="hudTop">
      <div class="chips"><div class="chip clock"><small class="clockL"></small><b class="clockV">0:00</b></div><div class="chip"><small class="scoreL"></small><b class="scoreV">0</b></div></div>
      <div class="mid"><div class="gauge"><div class="gaugeFill"></div><div class="gaugeLabel">血條 <b class="gaugeV">100</b></div></div><div class="progress"><div class="progressFill"></div><div class="dot dotRi"></div><div class="dot dotMe"></div></div><div class="lead"></div><div class="combo"></div></div>
      <div class="chip"><small class="speedL"></small><b class="speedV">0</b></div>
    </div>
    <div class="zone"></div><div class="toasts"></div><div class="hint"></div><div class="tag"></div><div class="banner"></div><div class="notice"></div>
    <div class="ko"><b class="koT"></b><span class="koS"></span></div>
  </div>
</template>

<script src="rtc.js"></script>
