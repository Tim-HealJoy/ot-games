<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>菜市場數一數 — 數字認知教案</title>
<meta name="description" content="菜市場數一數：數一數、比多少、排順序，三關 54 題的失智長者數字認知教案。投影帶團體或手機都能玩。教案設計：施昱廷 職能治療師。">
<meta name="theme-color" content="#3F6293">
<link rel="icon" href="../favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="復能小遊戲">
<meta property="og:title" content="菜市場數一數 · 失智長者數字認知教案">
<meta property="og:description" content="數一數、比多少、排順序，三關 54 題，用菜市場最熟悉的東西練數字。投影帶團體、手機也能玩。免費開放。">
<meta property="og:url" content="https://games.otshih.com/market-beta/">
<meta property="og:image" content="https://games.otshih.com/market-beta/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="zh_TW">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --cream:#F4EFE3; --cream-deep:#EBE2CE; --card:#FFFDF8;
  --ink:#1c1c1a; --ink-soft:#5a564d;
  --indigo:#3F6293; --indigo-dark:#2b4568; --indigo-soft:#dfe7f3;
  --amber:#E8A23A; --amber-soft:#fbe9c9;
  --orange:#C4622F; --green:#5E7A32; --green-soft:#e3ecd3;
  --red:#C0392B; --blue:#2E6DB4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#1a1916;overflow:hidden;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none !important}

#viewport{position:fixed;inset:0;display:none}
#stage{width:1920px;height:1080px;background:var(--cream);position:relative;overflow:hidden;transform-origin:top left;flex:none}
.slide{position:absolute;inset:0;padding:60px 100px 130px}
.slide:not(.on){display:none !important}

#topbar{position:absolute;left:0;right:0;top:0;height:14px;background:var(--indigo);border-bottom:6px solid var(--amber);z-index:5}
#credit{position:absolute;right:60px;top:34px;font-size:26px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;z-index:5}
#prog{position:absolute;left:60px;bottom:30px;font-size:28px;color:var(--ink-soft);font-weight:700;z-index:5;display:flex;align-items:center;gap:18px}
#tools{position:absolute;right:50px;bottom:22px;display:flex;gap:14px;z-index:6}
.tbtn{font-size:26px;font-weight:800;padding:12px 24px;border-radius:999px;background:rgba(63,98,147,.10);color:var(--indigo-dark);border:3px solid rgba(63,98,147,.25)}
.tbtn:hover{background:rgba(63,98,147,.18)}

/* 計分板 */
#score{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:none;gap:26px;z-index:6;align-items:center}
#score.show{display:flex}
#score .team{display:flex;align-items:center;gap:14px;white-space:nowrap;background:#fff;border-radius:999px;padding:8px 14px 8px 26px;border:4px solid var(--cream-deep);font-size:36px;font-weight:900}
#score .team.r{color:var(--red)} #score .team.b{color:var(--blue)}
#score .team b{font-size:52px;min-width:70px;text-align:center}
#score .team button{width:64px;height:64px;border-radius:50%;font-size:40px;font-weight:900;color:#fff}
#score .r button{background:var(--red)} #score .b button{background:var(--blue)}
#score .team button.m{background:#bbb;width:44px;height:44px;font-size:28px}

/* 共用 */
h1.big{font-size:150px;line-height:1.1;margin:0;font-weight:900;color:var(--indigo-dark);letter-spacing:4px}
.chip{display:inline-block;font-size:34px;font-weight:900;padding:8px 32px;border-radius:999px;background:var(--indigo);color:#fff;letter-spacing:3px}
.chip.amber{background:var(--amber);color:var(--ink)} .chip.green{background:var(--green);color:#fff} .chip.orange{background:var(--orange);color:#fff}
.qtitle{font-size:76px;font-weight:900;color:var(--indigo-dark);margin:0 0 24px;letter-spacing:3px;text-align:center;line-height:1.25}
.qtitle .chip{vertical-align:middle;font-size:32px;margin-left:20px}
.qtitle .answord{display:none;vertical-align:middle;margin-left:26px;background:var(--amber);color:var(--ink);border-radius:999px;padding:0 40px;font-size:70px;font-weight:900}
.qtitle .answord.show{display:inline-block;animation:drop .4s ease-out both}
.card{background:var(--card);border-radius:34px;box-shadow:0 10px 30px rgba(60,40,10,.12);overflow:hidden;border:4px solid #fff}
.card img{width:100%;height:100%;object-fit:cover}
kbd{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:2px 18px;font-size:.85em;font-weight:900;margin:0 6px}
@keyframes pop{0%{opacity:0;transform:scale(.6) translateY(30px)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes popb{0%{opacity:0;transform:translateX(-50%) scale(.6)}70%{transform:translateX(-50%) scale(1.06)}100%{opacity:1;transform:translateX(-50%)}}
.ans .big.pop{animation:popb .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes fade{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes drop{0%{opacity:0;transform:scale(.3) translateY(-60px)}60%{transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px var(--amber),0 10px 30px rgba(60,40,10,.12)}50%{box-shadow:0 0 0 16px rgba(232,162,58,.45),0 10px 30px rgba(60,40,10,.12)}}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both} .fade{animation:fade .5s ease-out both}
.step{visibility:hidden} .step.show{visibility:visible}
.step .fade,.step .pop{animation:none}
.step.show .fade{animation:fade .5s ease-out both} .step.show .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}

/* 封面 */
.cover{display:flex;align-items:center;gap:80px}
.cover .txt{flex:1}
.cover .pre{font-size:70px;font-weight:900;color:var(--indigo);margin-top:26px;letter-spacing:6px}
.cover .sub{font-size:60px;font-weight:800;color:var(--orange);margin:26px 0 44px;letter-spacing:5px}
.cover .go{font-size:36px;color:var(--ink-soft);font-weight:600;line-height:1.5}
.cover .mosaic{display:grid;grid-template-columns:repeat(1,360px);gap:18px}
.cover .mosaic .card{width:360px;height:220px;position:relative}
.cover .mosaic .card span{position:absolute;left:0;right:0;bottom:0;background:rgba(43,69,104,.8);color:#fff;font-size:34px;font-weight:900;text-align:center;padding:8px 0}

/* 說明頁 */
.howto{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.howto h2{font-size:52px;margin:0 0 16px;color:var(--indigo-dark);letter-spacing:3px}
.howto p,.howto li{font-size:36px;line-height:1.55;margin:0 0 12px}
.howto ol{padding-left:52px;margin:0}
.howto .beats{display:flex;gap:18px;margin:10px 0 30px}
.howto .beats span{flex:1;text-align:center;background:#fff;border:4px solid var(--indigo-soft);border-radius:22px;padding:14px 0;font-size:38px;font-weight:900;color:var(--indigo-dark)}
.howto .keys{background:#fff;border-radius:26px;padding:24px 34px;border:4px solid var(--cream-deep);list-style:none}
.howto .keys li{font-size:32px}

/* 關卡首頁 */
.rintro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rintro .icon{font-size:160px;line-height:1}
.rintro .name{font-size:140px;font-weight:900;color:var(--indigo-dark);letter-spacing:10px;line-height:1.1}
.rintro .sub{font-size:56px;color:var(--orange);font-weight:800;margin:14px 0 30px}
.rintro .goal{font-size:36px;color:var(--ink-soft);font-weight:600;margin-bottom:40px}
.rintro .lv{display:flex;gap:30px}
.rintro .lv button{font-size:44px;font-weight:900;padding:22px 60px;border-radius:26px;background:#fff;border:5px solid var(--cream-deep);color:var(--indigo-dark)}
.rintro .lv button:hover,.rintro .lv button.cur{border-color:var(--amber);background:var(--amber-soft)}
.rintro .lv small{display:block;font-size:28px;color:var(--ink-soft);font-weight:600;margin-top:6px}

/* 題目共用：場景畫布 */
.scene{position:relative;border-radius:34px;overflow:hidden;box-shadow:0 10px 30px rgba(60,40,10,.15);border:4px solid #fff;background:#e6ded0 center/cover no-repeat}
.scene.studio{background-image:url(img/bg_studio.jpg)} .scene.wood{background-image:url(img/bg_wood.jpg)}
.items{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:var(--gap,10px);padding:40px}
.item{position:relative;width:var(--sz);height:var(--sz);display:flex;align-items:flex-end;justify-content:center}
.item img{max-width:100%;max-height:100%;width:auto;height:auto;filter:drop-shadow(0 12px 10px rgba(0,0,0,.22));transform:rotate(var(--rot,0deg)) scaleX(var(--flip,1)) scale(var(--sc,1));transform-origin:center bottom}
.item .num{position:absolute;top:-6px;right:-6px;width:.6em;height:.6em;font-size:calc(var(--sz) * .5);border-radius:50%;background:var(--amber);color:var(--ink);font-weight:900;display:none;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.25);line-height:1}
.item.num-on .num{display:flex;animation:drop .35s ease-out both}
.items.fives{align-content:center;padding:30px 60px}
.items.fives .item:nth-child(5n){margin-right:70px}
.ans{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;pointer-events:none}
.ans.show{display:flex}
.ans .cd{font-size:360px;font-weight:900;color:#fff;text-shadow:0 10px 30px rgba(0,0,0,.45);line-height:1}
.ans .big{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(255,253,248,.96);border:8px solid var(--amber);border-radius:34px;padding:0 60px;font-size:150px;font-weight:900;color:var(--indigo-dark);line-height:1.15;box-shadow:0 20px 50px rgba(0,0,0,.3);white-space:nowrap}
.ans .big small{font-size:70px;color:var(--orange);margin-left:10px}

/* 數一數 */
.count .scene{height:800px}

/* 比大小 */
.compare .duo{display:flex;gap:40px;height:780px;position:relative}
.compare .side{flex:1;position:relative;display:flex;flex-direction:column}
.compare .side .scene{flex:1}
.compare .side .tag{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:2;font-size:52px;font-weight:900;background:rgba(255,255,255,.92);padding:6px 40px;border-radius:999px;color:var(--indigo-dark);border:4px solid var(--indigo-soft)}
.compare .side .val{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:2;font-size:76px;font-weight:900;background:var(--amber);padding:0 46px;border-radius:999px;color:var(--ink);display:none;line-height:1.35}
.compare .side.val-on .val{display:block;animation:drop .35s ease-out both}
.compare .side.win .scene{border-color:var(--green);box-shadow:0 0 0 14px var(--green-soft),0 10px 30px rgba(60,40,10,.15)}
.compare .side.win .tag{background:var(--green);color:#fff;border-color:var(--green)}
.compare .side .tick{position:absolute;right:30px;top:20px;z-index:3;font-size:120px;display:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.compare .side.win .tick{display:block;animation:drop .4s ease-out both}
.pricetag{position:absolute;left:50%;bottom:34px;transform:translateX(-50%) rotate(-3deg);background:#fff;border:6px solid var(--red);border-radius:18px;padding:0 34px;font-size:92px;font-weight:900;color:var(--red);line-height:1.3;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.2);white-space:nowrap}
.pricetag small{font-size:44px;margin-left:6px}
.single{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:60px 60px 150px}
.single img{max-width:100%;max-height:100%;filter:drop-shadow(0 16px 14px rgba(0,0,0,.25));transform:scale(var(--s,1));transform-origin:center bottom}

/* 排順序 */
.order .pool{display:flex;justify-content:center;gap:26px;height:390px;margin-bottom:26px}
.order .ocard{width:300px;height:390px;flex:none;position:relative;background:var(--card);border-radius:28px;border:5px solid #fff;box-shadow:0 10px 30px rgba(60,40,10,.15);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s}
.order .ocard:hover{transform:translateY(-8px)}
.order .ocard .pic{flex:1;position:relative;background:#f1ebdd}
.order .ocard .pic .items{padding:14px;gap:4px}
.order .ocard .pic .single{padding:16px 16px 20px}
.order .ocard .lab{height:96px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;color:var(--red);background:#fff;border-top:4px solid var(--cream-deep)}
.order .ocard .lab small{font-size:32px;margin-left:6px}
.order .ocard.gone{visibility:hidden}
.order .ocard.hintme{animation:glow 1s ease-in-out infinite}
.order .ocard.wrong{animation:shake .4s ease-in-out}
.order .track{display:flex;justify-content:center;gap:26px;height:390px;background:rgba(63,98,147,.08);border-radius:40px;padding:26px;border:5px dashed rgba(63,98,147,.25);position:relative}
.order .track .slot{width:300px;height:338px;border-radius:28px;border:5px dashed #c9bfa8;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:900;color:#c9bfa8}
.order .track .slot.filled{border:none;color:transparent;background:none}
.order .track .slot .ocard{width:300px;height:338px;cursor:default;animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.order .track .slot .ocard:hover{transform:none}
.order .dirtag{position:absolute;left:34px;top:-34px;background:var(--indigo);color:#fff;font-size:34px;font-weight:900;padding:6px 30px;border-radius:999px}
.order .arrow{position:absolute;right:40px;top:-30px;font-size:60px;color:var(--indigo)}

/* 算一算 */
.calc .scene{height:800px} .calc .qtitle{font-size:64px}
.calc .row{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:flex-end;gap:36px;padding:0 60px}
.calc .coins{top:60px;bottom:60px;align-items:center;flex-wrap:wrap;align-content:center}
.coin{position:relative;width:var(--sz,220px);height:var(--sz,220px);display:flex;align-items:center;justify-content:center;transition:filter .3s,transform .3s}
.coin img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.coin.bill{width:calc(var(--sz,220px) * 2.1)}
.coin .den{position:absolute;font-size:calc(var(--sz,220px) * .38);font-weight:900;color:rgba(40,30,10,.72);text-shadow:0 1px 0 rgba(255,255,255,.5);letter-spacing:-2px;pointer-events:none}
.coin.bill .den{color:rgba(120,20,60,.85);font-size:calc(var(--sz,220px) * .42)}
.coin .run{position:absolute;bottom:-70px;left:50%;transform:translateX(-50%);font-size:56px;font-weight:900;color:var(--indigo-dark);background:rgba(255,255,255,.92);padding:0 24px;border-radius:999px;display:none;white-space:nowrap}
.coin.lit .run{display:block;animation:drop .35s ease-out both}
.coins.dim .coin:not(.lit){filter:grayscale(.6) brightness(.75)}
.coin.lit{transform:translateY(-16px)}
.calc .buy{display:flex;height:100%;align-items:stretch}
.calc .buy .pay{width:520px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(255,255,255,.35);border-right:4px dashed rgba(0,0,0,.15)}
.calc .buy .pay .lbl{font-size:44px;font-weight:900;color:var(--indigo-dark);background:#fff;padding:4px 30px;border-radius:999px}
.calc .buy .goods{flex:1;display:flex;justify-content:center;align-items:flex-start;gap:60px;padding:30px 40px 160px}
.calc .buy .good{position:relative;width:440px;height:600px;display:flex;align-items:center;justify-content:center}
.calc .buy .good img{max-width:100%;max-height:420px;filter:drop-shadow(0 14px 12px rgba(0,0,0,.28))}
.calc .buy .good .pricetag{bottom:0}
.calc .eq{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(255,253,248,.95);border:6px solid var(--indigo);border-radius:26px;padding:6px 40px;font-size:62px;font-weight:900;color:var(--indigo-dark);display:none;white-space:nowrap;z-index:3;max-width:96%;line-height:1.3}
.calc .eq .cc{display:inline-flex;gap:6px;vertical-align:middle;margin-left:10px}
.portrait .calc .eq{white-space:normal;text-align:center;font-size:54px}
@keyframes dropc{0%{opacity:0;transform:translateX(-50%) scale(.5) translateY(-40px)}60%{transform:translateX(-50%) scale(1.08)}100%{opacity:1;transform:translateX(-50%)}}
.calc .eq.show{display:block;animation:dropc .4s ease-out both}
.calc .eq b{color:var(--orange)}

/* 故事頁 */
.story{display:flex;gap:60px;align-items:center}
.story .card{width:1080px;height:800px;flex:none;border-color:var(--amber)}
.story .txt{flex:1;display:flex;flex-direction:column;gap:26px}
.story .name{font-size:96px;font-weight:900;color:var(--indigo-dark);letter-spacing:6px;line-height:1.15}
.story .p{font-size:40px;line-height:1.6;background:#fff;border-radius:26px;padding:26px 34px;border-left:14px solid var(--amber)}
.story .q{font-size:46px;line-height:1.5;font-weight:900;color:var(--orange);background:var(--amber-soft);border-radius:26px;padding:26px 34px}
.story .q small{display:block;font-size:30px;color:var(--ink-soft);font-weight:700;margin-bottom:8px}

/* 級末／結尾 */
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end .icon{font-size:150px;line-height:1}
.end h2{font-size:96px;color:var(--indigo-dark);margin:10px 0 20px;letter-spacing:6px}
.end .p{font-size:44px;color:var(--ink-soft);font-weight:600;margin-bottom:40px;line-height:1.5}
.end .teams{display:flex;gap:60px;margin-bottom:40px}
.end .teams div{font-size:60px;font-weight:900;background:#fff;border-radius:30px;padding:20px 60px;border:6px solid var(--cream-deep)}
.end .teams .r{color:var(--red)} .end .teams .b{color:var(--blue)} .end .teams .t{color:var(--green)}
.end .teams b{display:block;font-size:110px;line-height:1.1}
.end .btns{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.end .btns button{font-size:40px;font-weight:900;padding:18px 50px;border-radius:999px;background:var(--indigo);color:#fff}
.end .btns button.o{background:#fff;color:var(--indigo-dark);border:4px solid var(--indigo-soft)}

/* 提示條 */
.hint{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--amber-soft);border:5px solid var(--amber);border-radius:999px;padding:14px 56px;font-size:40px;font-weight:800;color:var(--ink);white-space:nowrap;display:none;z-index:7}
.hint.show{display:block}

/* 目錄 */
#menu{position:absolute;inset:0;background:rgba(28,28,26,.72);display:none;z-index:20;align-items:center;justify-content:center}
#menu.show{display:flex}
#menu .box{background:var(--cream);border-radius:34px;padding:46px 60px;width:1300px;max-height:940px;overflow:auto}
#menu h2{font-size:52px;margin:0 0 22px;color:var(--indigo-dark)}
#menu .rlist{display:grid;grid-template-columns:1fr 1fr;gap:20px 30px}
#menu .rrow{background:#fff;border-radius:22px;padding:18px 24px;border:4px solid var(--cream-deep)}
#menu .rrow .n{font-size:40px;font-weight:900;color:var(--indigo-dark);margin-bottom:12px}
#menu .rrow .lvs{display:flex;gap:12px}
#menu .rrow .lvs button{flex:1;font-size:30px;font-weight:800;padding:12px 0;border-radius:16px;background:var(--indigo-soft);color:var(--indigo-dark)}
#menu .rrow .lvs button:hover{background:var(--amber-soft)}
#menu .foot{margin-top:26px;display:flex;gap:16px;flex-wrap:wrap}
#menu .foot a,#menu .foot button{font-size:30px;font-weight:800;padding:12px 26px;border-radius:999px;background:var(--indigo);color:#fff;text-decoration:none}

/* ---------- 手機直式舞台 ---------- */
#stage.portrait{width:1080px;height:1920px}
.portrait .slide{padding:150px 44px 190px;display:flex;flex-direction:column}
.portrait .slide.q>.scene,.portrait .compare .duo,.portrait .calc .scene{flex:1;height:auto;min-height:0}
.portrait .order .track{flex:1;height:auto}
.portrait #tools{right:30px;bottom:26px;gap:8px} .portrait .tbtn{font-size:28px;padding:10px 18px}
.portrait #credit{right:36px;top:40px;font-size:24px} .portrait #prog{left:36px;bottom:34px;font-size:26px}
.portrait #score{bottom:100px;gap:14px} .portrait #score .team{font-size:30px;padding:6px 10px 6px 18px} .portrait #score .team b{font-size:42px;min-width:56px}

<body>
<div id="viewport"><div id="stage">
  <div id="topbar"></div>
  <div id="tools">
    <button class="tbtn" id="btnHint" title="提示（H）">💡 提示</button>
    <button class="tbtn" id="btnScore" title="計分板（S）">🏆 計分</button>
    <button class="tbtn" id="btnMenu" title="目錄（M）">☰ 目錄</button>
    <button class="tbtn" id="btnFull" title="全螢幕（F）">⛶ 全螢幕</button>
  </div>
  <div id="slides"></div>
  <div class="hint" id="hint"></div>
  <div id="score">
    <div class="team r">紅隊 <b id="sR">0</b><button class="m" data-t="R" data-d="-1">−</button><button data-t="R" data-d="1">＋</button></div>
    <div class="team b">藍隊 <b id="sB">0</b><button class="m" data-t="B" data-d="-1">−</button><button data-t="B" data-d="1">＋</button></div>
  </div>
  <div id="prog"></div>
  <div id="credit">教案設計：施昱廷 職能治療師</div>
  <div id="menu"><div class="box">
    <h2>目錄 — 選關卡與級別</h2>
    <div class="rlist" id="menuList"></div>
    <div class="foot">
      <button id="menuCover">回封面</button>
      <button id="menuHow">玩法說明</button>
      <button id="menuReset">計分歸零</button>
      <button id="menuClose">關閉</button>
    </div>
  </div></div>
</div></div>

<script src="questions.js?v=4"></script>
<script>
(function(){
  const T = window.TOPICS, R = window.ROUNDS, M = window.MONEY, LV = window.LEVELS;
  const $ = s => document.querySelector(s);
  const png = k => `img/${k}.png`, jpg = k => `img/${k}.jpg`;
  const LVDESC = ["1～5、差很多、3 張牌","6～10、差 2～3 個、4 張牌","11～20、差 1～3 個、5 張牌"];

  /* 可重現的亂數（同一題每次排法一樣，帶領者提示卡才對得上） */
  function rng(seed){ let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

  /* ---------- 元件產生器 ---------- */
  function itemsHTML(topic, n, seed, opt={}){
    const t = T[topic], r = rng(seed);
    const sz = opt.sz || (n <= 5 ? 300 : n <= 10 ? 220 : 160);
    let h = `<div class="items" style="--sz:${sz}px;--gap:${opt.gap ?? (n<=5?40:n<=10?26:14)}px">`;
    let last = -1;
    for (let i = 0; i < n; i++) {
      let k = Math.floor(r() * t.items.length); if (t.items.length > 1 && k === last) k = (k + 1) % t.items.length; last = k;
      const im = t.items[k];
      const rot = (r() * 16 - 8).toFixed(1), flip = r() < 0.45 ? -1 : 1, sc = (0.86 + r() * 0.22).toFixed(2);
      h += `<div class="item" style="--rot:${rot}deg;--flip:${flip};--sc:${sc}"><img src="${png(im)}" alt=""><span class="num">${i+1}</span></div>`;
    }
    return h + `</div>`;
  }
  function singleHTML(topic, scale){ const t = T[topic]; return `<div class="single"><img src="${png(t.items[0])}" style="--s:${scale}" alt=""></div>`; }
  function coinHTML(v, opt={}){ const m = M[v]; return `<div class="coin ${v===100?'bill':''}" style="--sz:${opt.sz||220}px"><img src="${png(m.img)}" alt=""><span class="den">${m.label}</span><span class="run"></span></div>`; }
  function ansHTML(){ return `<div class="ans"><div class="cd"></div><div class="big" hidden></div></div>`; }
  function changeCoins(amount){ // 找零用的硬幣組合（大到小）
    const out = []; let left = amount;
    for (const v of [50, 10, 5, 1]) while (left >= v) { out.push(v); left -= v; }
    return out;
  }

  /* ---------- 投影片清單 ---------- */
  const slides = [];
  slides.push({type:'cover', steps:1});
  slides.push({type:'howto', steps:1});
  R.forEach((rd, ri) => {
    slides.push({type:'rintro', rd, ri, steps:1});
    rd.levels.forEach((qs, li) => {
      qs.forEach((q, qi) => {
        let steps = 2;
        if (rd.id === 'order') steps = 1 + q.vals.length;
        if (rd.id === 'calc') steps = 3;
        slides.push({type:'q', rd, ri, li, q, qi, steps, seed: ri*1000 + li*100 + qi*7 + 11});
        slides.push({type:'story', rd, ri, li, q, qi, steps:2});
      });
      slides.push({type:'lvend', rd, ri, li, steps:1});
    });
  });
  slides.push({type:'end', steps:1});

  function qTitle(s, text){ return `<div class="qtitle">${text}<span class="chip ${['green','amber','orange'][s.li]}">${LV[s.li]}</span><span class="answord"></span></div>`; }

  function render(s){
    const el = document.createElement('div');
    el.className = 'slide ' + s.type + (s.type === 'q' ? ' ' + s.rd.id : '') + (s.type === 'lvend' ? ' end' : '');
    if (s.type === 'cover') {
      el.innerHTML = `<div class="txt">
        <span class="chip">失智長者 · 數字認知教案</span>
        <div class="pre">阿公阿嬤上市場</div>
        <h1 class="big">菜市場數一數</h1>
        <div class="sub">數一數 · 比多少 · 排順序</div>
        <div class="go">點一下螢幕開始（電腦可按 → 鍵或簡報筆）<br><span style="font-size:30px">三關 · 三級 · 54 題 · 帶領者主持，長輩用嘴巴回答</span></div>
      </div>
      <div class="mosaic">${R.map(r=>`<div class="card"><img src="${jpg(['story_duck','story_egg','story_market'][R.indexOf(r)])}" alt=""><span>${r.icon} ${r.name}</span></div>`).join('')}</div>`;
    }
    if (s.type === 'howto') {
      el.innerHTML = `<div>
        <h2>教案目的</h2>
        <p>用菜市場裡最熟悉的東西練數字：數鴨子、比哪邊多、把價錢牌排好。數字能力是長輩一輩子在用的，從「一定答得出來」開始，把成功經驗留給他們。</p>
        <h2 style="margin-top:30px">四拍節奏</h2>
        <div class="beats"><span>① 看</span><span>② 答</span><span>③ 揭曉</span><span>④ 聊聊看</span></div>
        <p>三個級別：<b>初階</b>一定答得出來、<b>中階</b>要想一下、<b>進階</b>給輕度長輩挑戰。混合班可以同一題先讓輕度答，再按提示降階讓中度也答。</p>
      </div>
      <div>
        <h2>怎麼帶</h2>
        <ol>
          <li>目錄選關卡與級別，一堂課打一關約 20 分鐘。</li>
          <li>出題後先等長輩開口，不急著揭曉；按 <kbd>→</kbd> 才會 3、2、1 揭曉。</li>
          <li>答不出來按 <kbd>💡 提示</kbd>：數一數會排成五個一排、比多少會標數字、排順序正確卡片會發亮。</li>
          <li>分組時開 <kbd>🏆 計分</kbd>，只加分不扣分，結尾看兩隊合計。</li>
        </ol>
        <ul class="keys" style="margin-top:22px">
          <li><kbd>→</kbd><kbd>空白鍵</kbd> 下一步 ／ <kbd>←</kbd> 上一步（簡報筆可用）</li>
          <li><kbd>H</kbd> 提示 ／ <kbd>S</kbd> 計分板 ／ <kbd>R</kbd> 紅隊 +1 ／ <kbd>B</kbd> 藍隊 +1</li>
          <li><kbd>M</kbd> 目錄 ／ <kbd>F</kbd> 全螢幕 ／ 點螢幕右側＝下一步、左側＝上一步</li>
        </ul>
        <p class="touch" style="display:none;background:#fff;border-radius:26px;padding:22px 30px;border:4px solid var(--cream-deep)">手機／平板：<b>點右邊或往左滑＝下一步</b>，點左邊或往右滑＝上一步。想投影請用電腦開同一個網址。</p>
      </div>`;
    }
    if (s.type === 'rintro') {
      el.innerHTML = `<div class="icon">${s.rd.icon}</div>
        <div class="name">${s.rd.name}</div>
        <div class="sub">${s.rd.sub}</div>
        <div class="goal">練習：${s.rd.goal}<br>${s.rd.how}</div>
        <div class="lv">${LV.map((l,i)=>`<button data-lv="${i}">${l}<small>${LVDESC[i].split('、')[s.ri]}</small></button>`).join('')}</div>`;
      el.querySelector('.lv').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); goto(firstQ(s.ri, +b.dataset.lv)); });
    }
    if (s.type === 'q') renderQ(s, el);
    if (s.type === 'story') {
      const t = T[s.q.topic];
      el.innerHTML = `<div class="card pop"><img src="${jpg(t.story)}" alt=""></div>
        <div class="txt">
          <div><span class="chip amber">${s.rd.name} · 聊聊看</span></div>
          <div class="name">${t.name}</div>
          <div class="p fade">${t.text}</div>
          <div class="step" data-step="1"><div class="q fade"><small>聊聊看</small>${t.talk[s.li]}</div></div>
        </div>`;
    }
    if (s.type === 'lvend') {
      const nextLv = s.li < 2, nextRd = s.ri < R.length - 1;
      el.innerHTML = `<div class="icon">${s.rd.icon}</div>
        <h2>${s.rd.name} · ${LV[s.li]} 完成</h2>
        <div class="p">6 題都走完了，大家都有開口，就是最好的練習。</div>
        <div class="teams"><div class="r">紅隊<b class="tR">0</b></div><div class="b">藍隊<b class="tB">0</b></div><div class="t">合計<b class="tT">0</b></div></div>
        <div class="btns">
          ${nextLv ? `<button data-go="lv">往上一級：${LV[s.li+1]} →</button>` : ''}
          ${nextRd ? `<button class="o" data-go="rd">下一關：${R[s.ri+1].name}</button>` : `<button class="o" data-go="end">看總結</button>`}
          <button class="o" data-go="menu">回目錄</button>
        </div>`;
      el.querySelector('.btns').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation();
        if (b.dataset.go === 'lv') goto(firstQ(s.ri, s.li+1)); else if (b.dataset.go === 'rd') goto(slides.findIndex(x=>x.type==='rintro'&&x.ri===s.ri+1)); else if (b.dataset.go === 'end') goto(slides.length-1); else openMenu(); });
    }
    if (s.type === 'end') {
      el.innerHTML = `<div class="icon">🧺</div>
        <h2>今天的菜都買齊了</h2>
        <div class="p">數過鴨子、比過多少、排過價錢，<br>腦袋動了、也聊了很多。</div>
        <div class="teams"><div class="r">紅隊<b class="tR">0</b></div><div class="b">藍隊<b class="tB">0</b></div><div class="t">兩隊合計<b class="tT">0</b></div></div>
        <div class="btns"><button data-go="menu">回目錄</button><button class="o" data-go="cover">回封面</button></div>`;
      el.querySelector('.btns').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); b.dataset.go === 'menu' ? openMenu() : goto(0); });
    }
    return el;
  }

  function renderQ(s, el){
    const q = s.q, t = T[q.topic], id = s.rd.id;
    if (id === 'count') {
      el.innerHTML = qTitle(s, `畫面上有幾${t.unit}${t.name}？`) + `<div class="scene studio">${itemsHTML(q.topic, q.n, s.seed)}${ansHTML()}</div>`;
      s.answer = `${q.n}<small>${t.unit}</small>`;
      s.reveal = () => { const its = el.querySelectorAll('.item'); its.forEach((it,i)=> setTimeout(()=> it.classList.add('num-on'), 250*i)); };
      s.unreveal = () => el.querySelectorAll('.item').forEach(it=> it.classList.remove('num-on'));
      s.hintFn = () => { const g = el.querySelector('.items'); g.classList.toggle('fives'); return g.classList.contains('fives') ? '💡 排成五個一排，一起五個五個數' : ''; };
    }
    if (id === 'compare') {
      const sideHTML = (label, v) => {
        let inner = '', val = '';
        if (q.type === 'count') { inner = itemsHTML(q.topic, v, s.seed + (label==='左'?1:2), {sz: v<=5?260:v<=10?190:140}); val = `${v} ${t.unit}`; }
        if (q.type === 'size') { inner = singleHTML(q.topic, v); val = v === 1 ? '大' : '小'; }
        if (q.type === 'price') { inner = singleHTML(q.topic, 0.85) + `<div class="pricetag">${v}<small>元</small></div>`; val = `${v} 元`; }
        return `<div class="side"><div class="tag">${label}邊</div><div class="scene studio">${inner}</div><div class="val">${val}</div><div class="tick">✅</div></div>`;
      };
      el.innerHTML = qTitle(s, q.ask) + `<div class="duo">${sideHTML('左', q.a)}${sideHTML('右', q.b)}<div class="ans" style="position:absolute">${''}<div class="cd"></div><div class="big" hidden></div></div></div>`;
      const pick = q.want === 'min' ? (q.a < q.b ? 0 : 1) : (q.a > q.b ? 0 : 1);
      s.answer = pick === 0 ? '左邊' : '右邊'; s.inline = true;
      s.reveal = () => { const sd = el.querySelectorAll('.side'); sd[pick].classList.add('win'); sd.forEach(x=>x.classList.add('val-on')); };
      s.unreveal = () => el.querySelectorAll('.side').forEach(x=>x.classList.remove('win','val-on'));
      s.hintFn = () => { const on = !el.querySelector('.side').classList.contains('val-on'); el.querySelectorAll('.side').forEach(x=>x.classList.toggle('val-on', on)); return on ? '💡 數字標出來了，再比一次' : ''; };
    }
    if (id === 'order') {
      const vals = q.vals.slice(), sorted = vals.slice().sort((a,b)=> q.dir==='asc' ? a-b : b-a);
      const r = rng(s.seed); const shuffled = vals.slice(); for (let i = shuffled.length-1; i > 0; i--) { const j = Math.floor(r()*(i+1)); [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]]; }
      const cardHTML = v => {
        let pic = '', lab = '';
        if (q.kind === 'count') { pic = itemsHTML(q.topic, v, s.seed + v, {sz: v<=5?110:v<=10?80:62, gap:4}); lab = `${v}<small>${t.unit}</small>`; }
        if (q.kind === 'size') { pic = singleHTML(q.topic, v); lab = ''; }
        if (q.kind === 'price') { pic = singleHTML(q.topic, 0.9); lab = `${v}<small>元</small>`; }
        return `<div class="ocard" data-v="${v}"><div class="pic">${pic}</div>${lab ? `<div class="lab">${lab}</div>` : ''}</div>`;
      };
      const dirText = q.ask;
      el.innerHTML = qTitle(s, `${t.name}：${dirText}`) +
        `<div class="pool">${shuffled.map(cardHTML).join('')}</div>
         <div class="track"><span class="dirtag">${dirText}</span><span class="arrow">➡</span>${sorted.map(()=>`<div class="slot">？</div>`).join('')}</div>`;
      s.sorted = sorted;
      s.place = (k) => { // 把第 k 張（sorted[k]）放進軌道
        const v = sorted[k]; const card = [...el.querySelectorAll('.pool .ocard')].find(c => +c.dataset.v === v && !c.classList.contains('gone'));
        const slot = el.querySelectorAll('.track .slot')[k]; if (!card || !slot || slot.classList.contains('filled')) return;
        card.classList.add('gone'); card.classList.remove('hintme'); slot.classList.add('filled'); slot.innerHTML = ''; const cl = card.cloneNode(true); cl.classList.remove('gone'); slot.appendChild(cl);
      };
      s.resetOrder = (k) => { // 回到只放了前 k 張
        el.querySelectorAll('.track .slot').forEach((sl,i)=>{ if (i >= k) { sl.classList.remove('filled'); sl.innerHTML = '？'; } });
        el.querySelectorAll('.pool .ocard').forEach(c => { const idx = sorted.indexOf(+c.dataset.v); c.classList.toggle('gone', idx < k); c.classList.remove('hintme'); });
        for (let i = 0; i < k; i++) if (!el.querySelectorAll('.track .slot')[i].classList.contains('filled')) s.place(i);
      };
      el.querySelector('.pool').addEventListener('click', e => {
        const c = e.target.closest('.ocard'); if (!c || c.classList.contains('gone')) return; e.stopPropagation();
        if (+c.dataset.v === sorted[step]) { next(); } else { c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong'); }
      });
      s.hintFn = () => { const c = [...el.querySelectorAll('.pool .ocard')].find(x => +x.dataset.v === sorted[step] && !x.classList.contains('gone')); if (!c) return ''; c.classList.toggle('hintme'); return c.classList.contains('hintme') ? '💡 發亮的那張就是下一張' : ''; };
    }
    if (id === 'calc') {
      if (q.kind === 'sum') {
        const total = q.coins.reduce((a,b)=>a+b,0);
        el.innerHTML = qTitle(s, q.ask) + `<div class="scene wood"><div class="row coins">${q.coins.map(v=>coinHTML(v)).join('')}</div>${ansHTML()}<div class="eq"></div></div>`;
        s.answer = `${total}<small>元</small>`;
        s.walk = () => { const cs = el.querySelectorAll('.coin'); el.querySelector('.coins').classList.add('dim'); let run = 0; cs.forEach((c,i)=> setTimeout(()=>{ run += q.coins[i]; c.classList.add('lit'); c.querySelector('.run').textContent = run; }, 600*i)); };
        s.unwalk = () => { el.querySelector('.coins').classList.remove('dim'); el.querySelectorAll('.coin').forEach(c=>c.classList.remove('lit')); };
        s.hintFn = () => { if (el.querySelector('.coin.lit')) { s.unwalk(); return ''; } s.walk(); return '💡 硬幣一枚一枚加，跟著唸出來'; };
      } else {
        const cost = q.items.reduce((a,b)=>a+b.price,0), change = q.pay - cost, cc = changeCoins(change);
        el.innerHTML = qTitle(s, q.ask) + `<div class="scene wood"><div class="buy">
            <div class="pay"><span class="lbl">付的錢</span>${coinHTML(q.pay, {sz: q.pay===100?200:260})}</div>
            <div class="goods">${q.items.map(it=>`<div class="good"><img src="${png(T[it.topic].items[0])}" alt=""><div class="pricetag">${it.price}<small>元</small></div></div>`).join('')}</div>
          </div>${ansHTML()}<div class="eq"></div></div>`;
        s.answer = `找 ${change}<small>元</small>`;
        const eqText = q.items.length === 1 ? `${q.pay} − ${cost} ＝ <b>${change}</b>` : `${q.pay} − ${q.items[0].price} − ${q.items[1].price} ＝ <b>${change}</b>`;
        s.walk = () => { const e = el.querySelector('.eq'); e.innerHTML = eqText + `　找<span class="cc">${cc.map(v=>coinHTML(v,{sz:66})).join('')}</span>`; e.classList.add('show'); };
        s.unwalk = () => el.querySelector('.eq').classList.remove('show');
        s.hintFn = () => { const e = el.querySelector('.eq'); if (e.classList.contains('show')) { s.unwalk(); return ''; } e.innerHTML = q.items.length === 1 ? `先想：${cost} 再加多少會變 ${q.pay}？` : `先算兩樣加起來：${q.items[0].price} ＋ ${q.items[1].price} ＝ <b>${cost}</b>`; e.classList.add('show'); return '💡 分兩步想'; };
      }
    }
  }

  /* 圖片還沒生成時的暫代（Codex 額度解鎖後自動補上，不用改 code） */
  const EMO = {duck:'🦆',egg:'🥚',orange:'🍊',fish:'🐟',banana:'🍌',tomato:'🍅',corn:'🌽',cabbage:'🥬',radish:'🥕',sweetpotato:'🍠',coin:'🪙',bill:'💵',story:'🏡'};
  document.addEventListener('error', e => {
    const im = e.target; if (!im || im.tagName !== 'IMG' || im.dataset.fb) return; im.dataset.fb = 1;
    const key = Object.keys(EMO).find(k => im.src.includes('/' + k)) || 'story';
    const sp = document.createElement('span'); sp.className = 'fb'; sp.textContent = EMO[key]; sp.title = '暫代圖';
    sp.style.cssText = 'display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:' + (key==='story'?'200px':'min(100%, 1000px)') + ';line-height:1;opacity:.9';
    if (key !== 'story') sp.style.fontSize = 'calc(var(--sz, 220px) * .8)';
    im.replaceWith(sp);
  }, true);
  const wrap = $('#slides');
  slides.forEach(s => { s.el = render(s); wrap.appendChild(s.el); });
  function firstQ(ri, li){ return slides.findIndex(s => s.type === 'q' && s.ri === ri && s.li === li && s.qi === 0); }

  /* ---------- 狀態 ---------- */
  let cur = 0, step = 0, cdToken = 0;
  const score = {R:0, B:0};
  try { const sv = JSON.parse(localStorage.getItem('market-count-pos')||'null'); if (sv && sv.cur < slides.length) cur = sv.cur; const sc = JSON.parse(localStorage.getItem('market-count-score')||'null'); if (sc) Object.assign(score, sc); if (localStorage.getItem('market-count-scoreon')==='1') $('#score').classList.add('show'); } catch(e){}
  const qs = new URLSearchParams(location.search); if (qs.get('slide')) { cur = Math.min(slides.length-1, +qs.get('slide')|0); step = Math.min(slides[cur].steps-1, +(qs.get('step')||0)|0); }
  if (qs.get('round') !== null) { const ri = +qs.get('round')|0, li = +(qs.get('level')||0)|0; const i = firstQ(ri, li); if (i >= 0) { cur = i; step = 0; } }

  function countdown(s, done){
    const box = s.el.querySelector('.ans'); if (!box) { done(); return; }
    const cd = box.querySelector('.cd'), big = box.querySelector('.big');
    const token = ++cdToken; box.classList.add('show'); big.hidden = true; cd.hidden = false;
    const tick = n => { if (token !== cdToken) return; if (n === 0) { cd.hidden = true; showAnswer(s); done(); return; } cd.textContent = n; cd.classList.remove('pop'); void cd.offsetWidth; cd.classList.add('pop'); setTimeout(()=>tick(n-1), 900); };
    tick(3);
  }
  function showAnswer(s){ const box = s.el.querySelector('.ans'), big = box.querySelector('.big'), aw = s.el.querySelector('.answord'); if (s.inline) { box.classList.remove('show'); aw.textContent = s.answer; aw.classList.add('show'); return; } box.classList.add('show'); box.querySelector('.cd').hidden = true; big.hidden = false; big.innerHTML = s.answer; big.classList.remove('pop'); void big.offsetWidth; big.classList.add('pop'); }
  function hideAns(s){ cdToken++; const box = s.el.querySelector('.ans'); if (box) { box.classList.remove('show'); box.querySelector('.big').hidden = true; } const aw = s.el.querySelector('.answord'); if (aw) aw.classList.remove('show'); }

  function show(dir){
    slides.forEach((s,i)=> s.el.classList.toggle('on', i===cur));
    const s = slides[cur];
    s.el.querySelectorAll('.step').forEach(x=> x.classList.toggle('show', +x.dataset.step <= step));
    $('#hint').classList.remove('show');
    if (s.type === 'q') {
      const id = s.rd.id;
      if (id === 'count' || id === 'compare') {
        if (step === 0) { hideAns(s); s.unreveal(); if (id==='count') s.el.querySelector('.items').classList.remove('fives'); }
        else if (dir === 'fwd') countdown(s, ()=> s.reveal()); else { hideAns(s); s.reveal(); showAnswer(s); }
      }
      if (id === 'order') { if (dir === 'fwd' && step > 0) s.place(step-1); else s.resetOrder(step); }
      if (id === 'calc') {
        if (step === 0) { hideAns(s); s.unwalk(); }
        else if (step === 1) { s.unwalk(); if (dir === 'fwd') countdown(s, ()=>{}); else showAnswer(s); }
        else { hideAns(s); s.walk(); }
      }
    }
    $('#btnHint').style.visibility = (s.type === 'q') ? 'visible' : 'hidden';
    let txt = '';
    if (s.type === 'q' || s.type === 'story') txt = `${s.rd.icon} ${s.rd.name} · ${LV[s.li]} · 第 ${s.qi+1}／6 題`;
    if (s.type === 'rintro') txt = `第 ${s.ri+1} 關`;
    if (s.type === 'howto') txt = '玩法說明';
    if (s.type === 'lvend' || s.type === 'end') { txt = '結算'; s.el.querySelector('.tR').textContent = score.R; s.el.querySelector('.tB').textContent = score.B; s.el.querySelector('.tT').textContent = score.R + score.B; }
    $('#prog').textContent = txt;
    try { localStorage.setItem('market-count-pos', JSON.stringify({cur})); } catch(e){}
  }
  function next(){ const s = slides[cur]; if (step < s.steps - 1) step++; else if (cur < slides.length - 1) { cur++; step = 0; } show('fwd'); }
  function prev(){ const s = slides[cur]; if (step > 0) step--; else if (cur > 0) { cur--; step = 0; } show('back'); }
  function goto(i){ cur = i; step = 0; closeMenu(); show('fwd'); }

  /* ---------- 提示 ---------- */
  function hint(){ const s = slides[cur]; if (s.type !== 'q' || !s.hintFn) return; const msg = s.hintFn(); const h = $('#hint'); if (msg) { h.textContent = msg; h.classList.add('show'); } else h.classList.remove('show'); }

  /* ---------- 計分 ---------- */
  function renderScore(){ $('#sR').textContent = score.R; $('#sB').textContent = score.B; try { localStorage.setItem('market-count-score', JSON.stringify(score)); } catch(e){} const s = slides[cur]; if (s.type==='lvend'||s.type==='end') show(); }
  function addScore(t, d){ score[t] = Math.max(0, score[t] + d); renderScore(); }
  $('#score').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); addScore(b.dataset.t, +b.dataset.d); });
  $('#score').addEventListener('pointerdown', e => e.stopPropagation());
  function toggleScore(){ const on = $('#score').classList.toggle('show'); try { localStorage.setItem('market-count-scoreon', on?'1':'0'); } catch(e){} }
  renderScore();

  /* ---------- 目錄 ---------- */
  const menu = $('#menu');
  $('#menuList').innerHTML = R.map((r,ri)=>`<div class="rrow"><div class="n">${r.icon} 第 ${ri+1} 關 ${r.name}<span style="font-size:28px;color:#5a564d;font-weight:600;margin-left:16px">${r.sub}</span></div><div class="lvs">${LV.map((l,li)=>`<button data-ri="${ri}" data-li="${li}">${l}</button>`).join('')}</div></div>`).join('');
  $('#menuList').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goto(firstQ(+b.dataset.ri, +b.dataset.li)); });
  $('#menuCover').onclick = ()=> goto(0);
  $('#menuHow').onclick = ()=> goto(1);
  $('#menuReset').onclick = ()=> { score.R = 0; score.B = 0; renderScore(); closeMenu(); };
  $('#menuClose').onclick = closeMenu;
  function openMenu(){ menu.classList.add('show'); }
  function closeMenu(){ menu.classList.remove('show'); }
  menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });

  function full(){ const d = document.documentElement; if (!document.fullscreenElement) (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); else (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }

  /* ---------- 輸入 ---------- */
  $('#btnHint').onclick = e => { e.stopPropagation(); hint(); };
  $('#btnScore').onclick = e => { e.stopPropagation(); toggleScore(); };
  $('#btnMenu').onclick = e => { e.stopPropagation(); openMenu(); };
  $('#btnFull').onclick = e => { e.stopPropagation(); full(); };
  document.addEventListener('keydown', e => {
    if (menu.classList.contains('show')) { if (e.key === 'Escape' || e.key === 'm' || e.key === 'M') closeMenu(); return; }
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'Enter': case 'PageDown': case 'ArrowDown': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'PageUp': case 'ArrowUp': case 'Backspace': e.preventDefault(); prev(); break;
      case 'h': case 'H': hint(); break;
      case 's': case 'S': toggleScore(); break;
      case 'r': case 'R': addScore('R', 1); break;
      case 'b': case 'B': addScore('B', 1); break;
      case 'm': case 'M': openMenu(); break;
      case 'f': case 'F': full(); break;
      case 'Home': goto(0); break;
      case 'End': goto(slides.length-1); break;
    }
  });
  const stage = $('#stage');
  let tx = null;
  stage.addEventListener('pointerdown', e => { tx = e.clientX; });
  stage.addEventListener('pointerup', e => {
    if (e.target.closest('#tools') || e.target.closest('#menu') || e.target.closest('#score') || e.target.closest('.ocard') || e.target.closest('.lv') || e.target.closest('.btns')) return;
    if (tx !== null && Math.abs(e.clientX - tx) > 60) { (e.clientX < tx) ? next() : prev(); tx = null; return; }
    tx = null;
    const r = stage.getBoundingClientRect();
    ((e.clientX - r.left) / r.width < 0.15) ? prev() : next();
  });

  /* ---------- 雙舞台縮放 ---------- */
  function fit(){
    const portrait = innerHeight > innerWidth;
    stage.classList.toggle('portrait', portrait);
    const W = portrait ? 1080 : 1920;
    const H = portrait ? Math.min(2400, Math.max(1440, Math.round(1080 * innerHeight / innerWidth))) : 1080;
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    const sc = Math.min(innerWidth/W, innerHeight/H);
    stage.style.transform = `scale(${sc})`;
    stage.style.marginLeft = ((innerWidth - W*sc)/2) + 'px';
    stage.style.marginTop = ((innerHeight - H*sc)/2) + 'px';
    $('#viewport').style.display = 'block';
  }
  addEventListener('resize', fit); addEventListener('orientationchange', ()=>setTimeout(fit,150)); fit();
  show('fwd');
})();
</script>
