<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>溪邊舉網</title>
<!-- v3（2026-11-11）：辦桌三道菜、金魚潮、隨時結束、釣魚三首配樂。舊版在 ../_舊版/v2.2/ -->
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<style>
:root{--ink:#2b2622;--cream:#fbf5e6;--paper:#fffdf6;--line:#e4d9c0;--org:#d9591f;--grn:#23805a;--mut:#6d6355;--gold:#f0b429;--u:10px;
  --f:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#20242a;color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#cfe6ee}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font:inherit;font-weight:700;border:0;border-radius:calc(var(--u)*.9);cursor:pointer;color:var(--ink);background:var(--cream);padding:calc(var(--u)*.9) calc(var(--u)*1.7)}
button.main{background:var(--org);color:#fff;font-size:calc(var(--u)*2.5);padding:calc(var(--u)*1.1) calc(var(--u)*3.4)}
button.sec{background:#efe6d0}
button:focus-visible{outline:3px solid #2c6fb3;outline-offset:2px}
/* HUD */
.hud{position:absolute;top:calc(var(--u)*1.1);background:rgba(255,253,246,.94);border:2px solid var(--line);border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.55) calc(var(--u)*1.5);font-size:calc(var(--u)*2.3);font-weight:800;line-height:1.25;white-space:nowrap}
#hudL{left:calc(var(--u)*1.1)}#hudR{right:calc(var(--u)*1.1)}
#hudL b{color:var(--org);font-size:1.3em}#hudL .g{color:#b97a08;font-size:.8em;margin-left:.5em}
#tools{position:absolute;left:calc(var(--u)*1.1);bottom:calc(var(--u)*1.1);display:flex;gap:calc(var(--u)*.6)}
#tools button{font-size:calc(var(--u)*1.35);padding:calc(var(--u)*.5) calc(var(--u)*.9);background:rgba(255,253,246,.92)}
#caption{position:absolute;left:50%;top:calc(var(--u)*9);transform:translateX(-50%);background:rgba(43,38,34,.86);color:#fff;font-size:calc(var(--u)*3.2);font-weight:800;padding:calc(var(--u)*.7) calc(var(--u)*2.2);border-radius:calc(var(--u)*1.4);white-space:nowrap;opacity:0;transition:opacity .22s;pointer-events:none}
#caption.on{opacity:1}
#perf{position:absolute;left:50%;top:calc(var(--u)*.4);transform:translateX(-50%);background:rgba(43,38,34,.82);color:#fff;font-size:calc(var(--u)*1.1);padding:.2em .7em;border-radius:.6em;z-index:9}
/* 鏡頭小視窗 */
#pv{position:absolute;right:calc(var(--u)*1.1);bottom:calc(var(--u)*1.1);width:calc(var(--u)*17);aspect-ratio:16/9;background:#222;border:3px solid #fff;border-radius:calc(var(--u)*.8);overflow:hidden}
#pv video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#pv::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.75)}
#pv.big{right:auto;left:50%;bottom:calc(var(--u)*2);transform:translateX(-50%);width:calc(var(--u)*38)}
/* 蓋板 */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--u)*2)}
.card{background:var(--paper);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.2) calc(var(--u)*3);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*3) rgba(0,0,0,.28);max-height:100%;overflow:auto;width:calc(var(--u)*58);font-size:calc(var(--u)*1.7);line-height:1.5}
.card h1{margin:0;font-size:calc(var(--u)*4.4);line-height:1.2}
.card h2{margin:0 0 calc(var(--u)*.6);font-size:calc(var(--u)*3)}
.sub{color:var(--mut);margin:calc(var(--u)*.3) 0 calc(var(--u)*1.3)}
.row{margin:calc(var(--u)*1) 0}
.lab{font-weight:800;margin-bottom:calc(var(--u)*.4)}
.opts{display:flex;gap:calc(var(--u)*.7)}
.opts button{flex:1;background:#efe6d0;font-size:calc(var(--u)*2);padding:calc(var(--u)*.8)}
.opts button.on{background:var(--ink);color:#fff}
.hint{color:var(--mut);font-size:calc(var(--u)*1.45);margin-top:calc(var(--u)*.4);min-height:1.5em}
details{margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.45)}summary{cursor:pointer;color:var(--mut);font-weight:700}
.adv{display:grid;grid-template-columns:auto 1fr auto;gap:calc(var(--u)*.5) calc(var(--u)*.9);align-items:center;margin-top:calc(var(--u)*.6)}
input[type=range]{width:100%}
.actions{display:flex;gap:calc(var(--u)*.8);justify-content:center;align-items:center;flex-wrap:wrap;margin-top:calc(var(--u)*1.3)}
/* 校正橫幅 */
#calib{position:absolute;left:50%;top:calc(var(--u)*1.6);transform:translateX(-50%);background:rgba(255,253,246,.96);border:2px solid var(--line);border-radius:calc(var(--u)*1.4);padding:calc(var(--u)*1) calc(var(--u)*2.4);text-align:center}
#calib .t{font-size:calc(var(--u)*3);font-weight:800}
#calib .lamps{display:flex;gap:calc(var(--u)*2);justify-content:center;font-size:calc(var(--u)*2.2);font-weight:800;margin:calc(var(--u)*.5) 0}
#calib .lamp{color:#b8ae99}#calib .lamp.ok{color:var(--grn)}
/* 按鍵試玩 */
#keys{position:absolute;left:0;right:0;bottom:calc(var(--u)*6);display:flex;justify-content:space-between;padding:0 calc(var(--u)*1.5);pointer-events:none}
#keys button{pointer-events:auto;font-size:calc(var(--u)*2);padding:calc(var(--u)*1.2) calc(var(--u)*1.6);background:rgba(255,253,246,.94);touch-action:none;user-select:none;-webkit-user-select:none}
#keys button.on{background:var(--gold)}
#rest .bar{height:calc(var(--u)*1);background:#eee3cb;border-radius:99px;overflow:hidden;margin:calc(var(--u)*1) 0}#rest .bar i{display:block;height:100%;background:var(--grn);width:0}
.big-num{font-size:calc(var(--u)*5.4);font-weight:900;color:var(--org);line-height:1.1}
.stats{display:flex;gap:calc(var(--u)*2);flex-wrap:wrap;font-weight:700;margin:calc(var(--u)*.4) 0}
.talk{background:#f6efdc;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.9) calc(var(--u)*1.2);margin:calc(var(--u)*.9) 0;font-size:calc(var(--u)*2)}
.talk small{display:block;color:var(--mut);font-size:.72em;font-weight:700}
.fb{font-size:calc(var(--u)*1.5);color:var(--mut);margin-top:calc(var(--u)*.5);text-align:center}
.fb a{color:#2c6fb3;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*1.4);margin-top:calc(var(--u)*.6)}
th,td{border-bottom:1px solid var(--line);padding:.3em .4em;text-align:center}th:first-child,td:first-child{text-align:left}
.msg{font-size:calc(var(--u)*2.2);font-weight:700;text-align:center}
/* v3 辦桌進度 */
#hudL{min-width:calc(var(--u)*27)}
#hudL .dn{display:flex;justify-content:space-between;gap:calc(var(--u)*1);font-size:.78em}
#hudL .st{color:#d39b0c;letter-spacing:.05em}
#hudL .meter{position:relative;height:calc(var(--u)*1.5);background:#eee3cb;border-radius:99px;margin:calc(var(--u)*.45) 0;overflow:visible}
#hudL .meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4aa3c8,#2f7fa6);transition:width .25s}
#hudL.served .meter i{background:linear-gradient(90deg,#f0b429,#e08a0b)}
#hudL .meter s{position:absolute;top:calc(var(--u)*-.35);bottom:calc(var(--u)*-.35);width:calc(var(--u)*.35);margin-left:calc(var(--u)*-.17);background:#c98a00;border-radius:2px;text-decoration:none}
#hudL .meter s#t1{background:#d9591f;width:calc(var(--u)*.5)}
#hudL .meter s#t1::after{content:"上菜";position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:calc(var(--u)*1.1);color:#d9591f;white-space:nowrap}
#hudL .cnt{font-size:.82em;margin-top:calc(var(--u)*.9)}#hudL .cnt b{color:var(--org);font-size:1.25em}
#hudL .combo{font-size:.62em;color:var(--mut);margin-top:calc(var(--u)*.2)}#hudL .combo b{color:#b97a08}
#serve{position:absolute;left:50%;top:calc(var(--u)*1.2);z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:calc(var(--u)*1.6);background:#fffaf0;border:4px solid #d9591f;border-radius:calc(var(--u)*2);padding:calc(var(--u)*1) calc(var(--u)*2.4) calc(var(--u)*1) calc(var(--u)*1);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*3) rgba(0,0,0,.3);pointer-events:none}
#serve img{width:calc(var(--u)*9.5);height:calc(var(--u)*9.5);border-radius:calc(var(--u)*1.2);object-fit:cover}
#serve .t{font-size:calc(var(--u)*3.8);font-weight:900;color:#d9591f;line-height:1.1}#serve .d{font-size:calc(var(--u)*2.6);font-weight:800}
#serve.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#restDish{display:flex;align-items:center;gap:calc(var(--u)*1.2);justify-content:center;text-align:left;font-size:calc(var(--u)*1.9);margin:calc(var(--u)*.8) 0}
#restDish img{width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:calc(var(--u)*1);object-fit:cover}
#restDish b{font-size:1.15em}
.dishes{display:flex;gap:calc(var(--u)*1);margin:calc(var(--u)*.5) 0}
.dish{flex:1;text-align:center;background:#fbf3e2;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.5);line-height:1.3}
.dish img{display:block;margin:0 auto;height:calc(var(--u)*8);aspect-ratio:1;object-fit:cover;border-radius:calc(var(--u)*.8)}
.dish .dn{font-weight:800;font-size:calc(var(--u)*1.8)}.dish .ds{color:#d39b0c;font-size:calc(var(--u)*2.1);letter-spacing:.05em}.dish .df{color:var(--mut);font-size:calc(var(--u)*1.35)}
.dish.off{opacity:.45}.dish.off .ds{color:var(--mut);font-size:calc(var(--u)*1.5)}
#bQuit{background:#fff0e6;color:#b33f0e}
#tools{z-index:4}#quit{z-index:6}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hudL" class="hud hide"><div class="dn"><span id="hDish">第 1 道・薑絲魚湯</span><span class="st" id="hStars">☆☆☆</span></div>
    <div class="meter"><i id="hFill"></i><s id="t1"></s><s id="t2"></s></div>
    <div class="cnt" id="hCnt"></div><span id="nFish" hidden></span><span id="nGold" hidden></span><div class="combo" id="hCombo"></div></div>
  <div id="serve" class="hide"><img id="sImg" alt=""><div><div class="t" id="sT">過關！</div><div class="d" id="sD"></div></div></div>
  <div id="hudR" class="hud hide"></div>
  <div id="caption"></div>
  <div id="perf" class="hide"></div>
  <div id="pv" class="hide"><video id="pvv" playsinline muted></video></div>
  <div id="keys" class="hide"><button id="kA">按住：左邊舉手（A）</button><button id="kB">按住：右邊舉手（L）</button></div>
  <div id="tools" class="hide"><button id="bQuit" class="hide">⏹ 結束</button><button id="bSet">⚙ 設定</button><button id="bMusic">♪ 音樂</button><button id="bPv">鏡頭畫面</button></div>

  <div id="calib" class="hide"><div class="t">兩個人各舉一次手</div><div class="lamps"><span class="lamp" id="lA">左邊</span><span class="lamp" id="lB">右邊</span></div>
    <div class="actions" style="margin-top:0"><button id="bBack2" class="sec">← 回設定畫面</button><button id="bGoCal" class="sec">開始撈魚</button></div></div>

  <div id="skip" class="hide" style="position:absolute;right:calc(var(--u)*1.1);bottom:calc(var(--u)*1.1)"><button id="bSkip" class="sec">跳過開場</button></div>

  <div id="setup" class="overlay"><div class="card">
    <h1>溪邊舉網</h1><div class="sub">兩個人一起把網子抬起來，魚就跑不掉了。</div>
    <div class="row"><div class="lab">難度</div><div class="opts" id="oDiff"><button data-v="easy">簡單</button><button data-v="normal">普通</button><button data-v="hard">困難</button></div><div class="hint" id="hDiff"></div></div>
    <div class="row"><div class="lab">怎麼玩</div><div class="opts" id="oInput"><button data-v="camera">鏡頭（兩人左右坐）</button><button data-v="keys">按鍵試玩</button></div></div>
    <details><summary>進階微調</summary><div class="adv">
      <span>算一起的時間</span><input id="aT" type="range" min="1" max="5" step=".5"><span id="aTv"></span>
      <span>舉手高度</span><input id="aH" type="range" min="20" max="80" step="5"><span id="aHv"></span>
      <span>每回合幾網（簡單）</span><input id="aN" type="range" min="4" max="12" step="1"><span id="aNv"></span>
      <span>畫風</span><span><button id="aS" class="sec" style="padding:.2em .8em"></button></span><span></span>
      <span>音樂</span><span><button id="aM" class="sec" style="padding:.2em .8em"></button></span><span></span>
    </div></details>
    <div class="actions"><button id="bStart" class="main">開始</button></div>
  </div></div>

  <div id="loading" class="overlay hide"><div class="card"><div class="msg" id="loadMsg">正在開鏡頭</div><div class="hint" id="loadSub" style="text-align:center">第一次載入偵測模型要等一下。</div>
    <div class="actions"><button id="bLoadKeys" class="sec hide">先用按鍵試玩</button><button id="bBack3" class="sec">← 回設定畫面</button></div></div></div>

  <div id="rest" class="overlay hide"><div class="card" style="width:calc(var(--u)*44);text-align:center"><h2>休息一下</h2><div id="restDish"></div><div>把手放下來甩一甩。</div><div class="bar"><i id="restBar"></i></div><div class="actions"><button id="bRestGo" class="sec">繼續撈魚</button></div></div></div>

  <div id="quit" class="overlay hide" style="background:rgba(0,0,0,.25)"><div class="card" style="width:calc(var(--u)*46);text-align:center"><h2>要結束了嗎？</h2><div>目前撈到的魚和動作紀錄都會保留。</div>
    <div class="actions"><button id="bQuitYes" class="main">看成績</button><button id="bQuitNo" class="sec">繼續玩</button></div></div></div>

  <div id="away" class="overlay hide"><div class="card" style="width:calc(var(--u)*44);text-align:center"><h2>看不到人了</h2><div>請坐回鏡頭前面，遊戲會自己接著玩。</div><div class="actions"><button id="bBack4" class="sec">⚙ 回設定畫面</button></div></div></div>

  <div id="end" class="overlay hide" style="justify-content:flex-start;padding-left:calc(var(--u)*3)"><div class="card" style="width:calc(var(--u)*50)">
    <h2 id="eTitle">今晚辦桌</h2><div class="sub" id="eServed" style="margin:0"></div>
    <div class="dishes" id="eDishes"></div>
    <div style="font-weight:800">一起撈了 <span class="big-num" style="font-size:calc(var(--u)*3.6)"><span id="eFish">0</span></span> 條魚</div>
    <div class="stats" id="eStats"></div>
    <div class="talk"><small>聊聊看</small><span id="eTalk"></span> <button id="bNextTalk" class="sec" style="font-size:.7em;padding:.2em .7em;margin-left:.4em">換一題</button></div>
    <div class="actions"><button id="bAgain" class="main">再玩一次</button><button id="bBack5" class="sec">⚙ 回設定畫面</button><button id="bReport" class="sec">治療師報表</button></div>
    <div class="fb">歡迎給我回饋與建議：<a href="https://www.facebook.com/shihyuting.OT" target="_blank" rel="noopener">職能治療師施昱廷 粉專</a></div>
    <div id="eReport" class="hide"></div>
  </div></div>
</div>
<script type="module" src="main.js?v=3"></script>
</body>
</html>
