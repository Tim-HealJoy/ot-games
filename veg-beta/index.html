<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蔬菜猜猜看 — 影子、剖面、放大鏡</title>

<style>
:root{
  --cream:#F4EFE3; --cream-deep:#EBE2CE; --card:#FFFDF8;
  --ink:#1c1c1a; --ink-soft:#5a564d;
  --green:#4F7A32; --green-dark:#355422; --green-soft:#e2ecd5;
  --amber:#E8A23A; --amber-soft:#fbe9c9; --orange:#C4622F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#1a1916;overflow:hidden;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none !important}

/* ---------- 舞台 ---------- */
#viewport{position:fixed;inset:0}
#stage{width:1920px;height:1080px;background:var(--cream);position:relative;overflow:hidden;transform-origin:top left}
.slide{position:absolute;inset:0;padding:80px 100px 120px}
.slide:not(.on){display:none !important}
#topbar{position:absolute;left:0;right:0;top:0;height:14px;background:var(--green);border-bottom:6px solid var(--amber);z-index:5}
#credit{position:absolute;right:60px;bottom:34px;font-size:26px;color:var(--ink-soft);font-weight:600;letter-spacing:1px;z-index:5}
#prog{position:absolute;left:60px;bottom:30px;font-size:28px;color:var(--ink-soft);font-weight:700;z-index:5;display:flex;align-items:center;gap:18px}
#prog .dots{display:flex;gap:10px}
#prog .dots i{width:18px;height:18px;border-radius:50%;background:var(--cream-deep);border:3px solid #cfc5ad;display:block}
#prog .dots i.done{background:var(--amber);border-color:var(--amber)}
#tools{position:absolute;right:60px;top:40px;display:flex;gap:14px;z-index:6}
.tbtn{font-size:28px;font-weight:800;padding:12px 26px;border-radius:999px;background:rgba(79,122,50,.10);color:var(--green-dark);border:3px solid rgba(79,122,50,.3)}
.tbtn.choice{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}

/* 菜籃（右下角） */
#basket{position:absolute;right:56px;bottom:84px;width:170px;z-index:5;text-align:center;transition:transform .3s}
#basket img{width:170px}
#basket b{display:inline-block;margin-top:-10px;font-size:30px;font-weight:900;background:var(--green);color:#fff;border-radius:999px;padding:2px 20px}
#basket.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.fly{position:absolute;z-index:9;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .9s cubic-bezier(.5,0,.3,1)}
.fly img{width:100%;height:100%;object-fit:cover}

/* 共用 */
.chip{display:inline-block;white-space:nowrap;font-size:34px;font-weight:900;padding:8px 32px;border-radius:999px;background:var(--green);color:#fff;letter-spacing:3px}
.chip.amber{background:var(--amber);color:var(--ink)}
.card{background:var(--card);border-radius:34px;box-shadow:0 10px 30px rgba(60,40,10,.12);overflow:hidden;border:6px solid #fff}
.card img{width:100%;height:100%;object-fit:cover}
@keyframes pop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.fade{animation:fade .5s ease-out both}

/* ---------- 封面 ---------- */
.cover{display:flex;align-items:center;gap:70px}
.cover .txt{flex:1}
.cover h1{font-size:136px;line-height:1.1;margin:28px 0 0;font-weight:900;color:var(--green-dark);letter-spacing:4px;white-space:nowrap}
.cover .sub{font-size:58px;font-weight:800;color:var(--orange);margin:24px 0 46px;letter-spacing:4px}
.cover .go{font-size:36px;color:var(--ink-soft);font-weight:600;line-height:1.6}
.cover .card{width:900px;height:600px;flex:none}

/* ---------- 說明 ---------- */
.howto{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.howto h2{font-size:54px;margin:0 0 18px;color:var(--green-dark);letter-spacing:3px}
.howto p,.howto li{font-size:38px;line-height:1.55;margin:0 0 12px}
.howto ol{padding-left:52px;margin:0}
.howto .beats{display:flex;gap:18px;margin:10px 0 30px}
.howto .beats span{flex:1;text-align:center;background:#fff;border:4px solid var(--green-soft);border-radius:22px;padding:14px 0;font-size:40px;font-weight:900;color:var(--green-dark)}
.howto .keys{background:#fff;border-radius:26px;padding:22px 34px;border:4px solid var(--cream-deep);list-style:none}
.howto .keys li{font-size:32px}
kbd{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:2px 16px;font-size:.85em;font-weight:900;margin:0 4px}

/* ---------- 關卡封面 ---------- */
.slide.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.slide.stage .no{font-size:60px;font-weight:900;color:var(--orange);letter-spacing:8px}
.slide.stage h2{font-size:150px;margin:10px 0 20px;color:var(--green-dark);letter-spacing:10px}
.slide.stage .how{font-size:52px;font-weight:700;color:var(--ink-soft)}
.slide.stage .lad{display:flex;gap:20px;margin-top:50px}
.slide.stage .lad span{font-size:38px;font-weight:800;background:#fff;border:4px solid var(--green-soft);border-radius:22px;padding:14px 30px;color:var(--green-dark)}
.slide.stage .lad span:last-child{background:var(--amber-soft);border-color:var(--amber)}

/* ---------- 猜猜看 ---------- */
.q{display:flex;gap:60px;align-items:center}
.q .card{width:1080px;height:720px;flex:none;position:relative}
.q .card img{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.q .card img.on{opacity:1}
.q .side{flex:1;display:flex;flex-direction:column;gap:30px;align-items:flex-start}
.q .ask{font-size:84px;font-weight:900;color:var(--green-dark);line-height:1.25;letter-spacing:3px}
.q .lv{font-size:40px;font-weight:800;color:var(--ink-soft)}
.q .lv b{color:var(--orange)}
.q .name{font-size:150px;font-weight:900;color:var(--orange);letter-spacing:10px;line-height:1.1}
.q .tip{font-size:34px;color:var(--ink-soft);font-weight:600;line-height:1.5}

/* 二選一 */
#choice{position:absolute;inset:0;background:rgba(28,28,26,.72);display:none;z-index:15;align-items:center;justify-content:center;flex-direction:column;gap:40px}
#choice.show{display:flex}
#choice .t{font-size:66px;font-weight:900;color:#fff;letter-spacing:4px}
#choice .opts{display:flex;gap:70px}
#choice .opt{display:flex;flex-direction:column;align-items:center;gap:18px}
#choice .opt .card{width:720px;height:480px}
#choice .opt .lab{font-size:66px;font-weight:900;color:#fff;letter-spacing:6px}
#choice .opt .lab i{font-style:normal;display:inline-block;width:86px;height:86px;line-height:86px;border-radius:50%;background:var(--amber);color:var(--ink);margin-right:18px;text-align:center}
#choice .close{font-size:32px;color:#fff;opacity:.85}

/* ---------- 聊聊看 ---------- */
.talk{display:flex;gap:70px;align-items:center}
.talk .card{width:880px;height:587px;flex:none}
.talk .txt{flex:1;padding-right:120px}
.talk .nm{font-size:64px;font-weight:900;color:var(--orange);margin:24px 0 10px;letter-spacing:6px}
.talk .ask{font-size:78px;font-weight:900;color:var(--green-dark);line-height:1.35;letter-spacing:3px}

/* ---------- 結尾 ---------- */
.slide.end{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 100px 100px}
.end h2{font-size:64px;color:var(--green-dark);margin:0 0 18px;letter-spacing:4px}
.end .grid{display:grid;grid-template-columns:repeat(5,300px);gap:14px 30px}
.end .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.end .cell .card{width:300px;height:180px;border-width:4px;border-radius:22px}
.end .cell b{font-size:34px}
.end .endrow{display:flex;align-items:center;gap:50px;margin-top:20px}
.end .thanks{font-size:50px;font-weight:900;color:var(--orange);letter-spacing:4px}
.homebtn{font-size:42px;font-weight:900;padding:14px 44px;border-radius:999px;background:var(--green);color:#fff;
  box-shadow:0 6px 0 var(--green-dark);letter-spacing:3px;white-space:nowrap}
.homebtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-dark)}

/* ---------- 目錄 ---------- */
#menu{position:absolute;inset:0;background:rgba(28,28,26,.72);display:none;z-index:20;align-items:center;justify-content:center}
#menu.show{display:flex}
#menu .box{background:var(--cream);border-radius:34px;padding:46px 60px;width:1500px;max-height:950px;overflow:auto}
#menu h2{font-size:52px;margin:0 0 22px;color:var(--green-dark)}
#menu .col{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
#menu .col h3{font-size:36px;margin:0 0 10px;color:var(--orange)}
#menu .col button{display:flex;align-items:center;gap:14px;width:100%;font-size:34px;font-weight:800;padding:10px 16px;margin-bottom:10px;border-radius:18px;background:#fff;border:4px solid var(--cream-deep)}
#menu .col button img{width:96px;height:64px;object-fit:cover;border-radius:10px}
#menu .foot{margin-top:24px;display:flex;gap:18px}
#menu .foot button{font-size:32px;font-weight:800;padding:12px 28px;border-radius:999px;background:var(--green);color:#fff}

/* ---------- 手機直式 ---------- */
#stage.portrait{width:1080px;height:1920px}
.portrait .slide{padding:150px 50px 260px}
.portrait #tools{right:36px;top:44px;gap:10px}
.portrait .tbtn{font-size:30px;padding:12px 22px}
.portrait #credit{right:40px;bottom:40px;font-size:28px}
.portrait #prog{left:40px;bottom:36px;font-size:30px}
.portrait #basket{right:40px;bottom:96px;width:140px}
.portrait #basket img{width:140px}
.portrait .cover{flex-direction:column-reverse;justify-content:center;gap:50px;text-align:center}
.portrait .cover .card{width:980px;height:653px}
.portrait .cover h1{font-size:140px}
.portrait .cover .sub{font-size:54px;margin:20px 0 30px}
.portrait .howto{grid-template-columns:1fr;gap:30px;align-content:start}
.portrait .howto h2{font-size:48px}
.portrait .howto p,.portrait .howto li{font-size:36px}
.portrait .howto .beats span{font-size:34px}
.portrait .howto .keys{display:none}
.portrait .howto .touch{display:block !important}
.portrait .slide.stage h2{font-size:120px;letter-spacing:4px}
.portrait .slide.stage .how{font-size:46px}
.portrait .slide.stage .lad{flex-wrap:wrap;justify-content:center}
.portrait .q,.portrait .talk{flex-direction:column;gap:40px;justify-content:center}
.portrait .q .card{width:980px;height:653px}
.portrait .q .side,.portrait .talk .txt{flex:none;padding-right:0;align-items:center;text-align:center;width:100%}
.portrait .q .ask{font-size:72px}
.portrait .q .name{font-size:130px}
.portrait .talk .card{width:980px;height:653px}
.portrait .talk .ask{font-size:66px}
.portrait #choice{gap:24px;justify-content:center}
.portrait #choice .t{font-size:56px}
.portrait #choice .opts{flex-direction:column;gap:24px}
.portrait #choice .opt{gap:8px}
.portrait #choice .opt .card{width:720px;height:440px}
.portrait #choice .opt .lab{font-size:56px}
.portrait #choice .opt .lab i{width:72px;height:72px;line-height:72px}
.portrait .slide.end{padding:120px 50px 110px;justify-content:center}
.portrait .end h2{font-size:56px;text-align:center;margin-bottom:20px}
.portrait .end .grid{grid-template-columns:repeat(3,300px);gap:8px 24px}
.portrait .end .cell .card{width:300px;height:140px}
.portrait .end .cell b{font-size:32px}
.portrait .end .endrow{flex-direction:column;gap:22px;margin-top:16px}
.portrait .end .thanks{text-align:center;font-size:46px}
.portrait .homebtn{font-size:44px}
.portrait #menu .box{width:1000px;padding:40px}
.portrait #menu .col{grid-template-columns:1fr}
</style>
<script src="/open-in-browser.js"></script>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="topbar"></div>
  <div id="tools">
    <button class="tbtn choice" id="btnChoice" title="二選一（2）">二選一</button>
    <button class="tbtn" id="btnMenu" title="目錄（M）">☰ 目錄</button>
    <button class="tbtn" id="btnFull" title="全螢幕（F）">⛶ 全螢幕</button>
  </div>
  <div id="slides"></div>
  <div id="basket" hidden><img src="img/basket.png" alt="菜籃"><b id="bcount">0</b></div>
  <div id="choice"><div class="t">是哪一個呢？</div><div class="opts" id="opts"></div><div class="close">點一下關閉</div></div>
  <div id="prog"></div>
  <div id="credit">教案設計：施昱廷 職能治療師</div>
  <div id="menu"><div class="box">
    <h2>目錄</h2>
    <div class="col" id="menuCols"></div>
    <div class="foot"><button id="menuCover">回封面</button><button id="menuHow">玩法說明</button><button id="menuClose">關閉</button></div>
  </div></div>
</div></div>

<script src="questions.js?v=2"></script>
<script>
(function(){
  const ST = window.STAGES, Q = window.QUESTIONS, LAD = window.LADDER, ALT = window.ALT_IMG;
  const $ = s => document.querySelector(s);
  const img = k => `img/${k}.jpg`;
  const last = q => LAD[q.stage].length - 1;   // 最後一張圖（清楚全貌）的編號
  const revealImg = q => img(`${q.id}_${last(q)}`);

  /* ---------- 投影片 ---------- */
  const slides = [{type:'cover', steps:1}, {type:'howto', steps:1}];
  ST.forEach((st, si) => {
    slides.push({type:'stage', st, si, steps:1});
    Q.forEach((q, qi) => { if (q.stage !== st.id) return;
      const n = Q.filter(x => x.stage === st.id).indexOf(q);
      slides.push({type:'q', q, qi, si, n, st, steps: LAD[q.stage].length + 1});   // 圖片各階＋文字揭曉
      slides.push({type:'talk', q, qi, si, n, st, steps:1});
    });
  });
  slides.push({type:'end', steps:1});

  function render(s){
    const el = document.createElement('div');
    el.className = 'slide ' + s.type;
    if (s.type === 'cover') el.innerHTML = `<div class="txt">
        <span class="chip">認知活動 · 看圖猜菜</span>
        <h1>蔬菜猜猜看</h1>
        <div class="sub">影子、剖面、放大鏡</div>
        <div class="go">三關 · 15 種台灣常見蔬菜<br>點一下螢幕開始（電腦可按 → 鍵或簡報筆）</div>
      </div><div class="card"><img src="${img('basket_full')}" alt=""></div>`;
    if (s.type === 'howto') el.innerHTML = `<div>
        <h2>遊戲目的</h2>
        <p>看影子、看切開的樣子、看靠很近的表皮，猜猜是什麼菜。練習看圖認物、說出名稱，再從菜聊到家裡的味道。</p>
        <h2 style="margin-top:30px">四拍節奏</h2>
        <div class="beats"><span>① 看</span><span>② 猜</span><span>③ 揭曉</span><span>④ 聊聊看</span></div>
        <p>猜對的菜會飛進右下角的菜籃，最後看看今天裝了滿滿一籃。</p>
      </div><div>
        <h2>怎麼帶</h2>
        <ol>
          <li>先請長輩說說看：「這是什麼菜？」</li>
          <li>猜不出來就按下一步，畫面會多給一點線索。</li>
          <li>說話比較困難的長輩，按 <kbd>二選一</kbd>，請他比 1 或比 2。</li>
          <li>揭曉後，用「聊聊看」的問題請大家分享，沒有標準答案。</li>
        </ol>
        <ul class="keys" style="margin-top:24px">
          <li><kbd>→</kbd><kbd>空白鍵</kbd> 下一步 ／ <kbd>←</kbd> 上一步</li>
          <li><kbd>2</kbd> 二選一 ／ <kbd>M</kbd> 目錄 ／ <kbd>F</kbd> 全螢幕</li>
          <li>點螢幕右側＝下一步，點左側＝上一步</li>
        </ul>
        <p class="touch" style="display:none;background:#fff;border-radius:26px;padding:22px 30px;border:4px solid var(--cream-deep)">手機／平板：<b>點右邊或往左滑＝下一步</b>，點左邊或往右滑＝上一步。</p>
      </div>`;
    if (s.type === 'stage') el.innerHTML = `<div class="no">第 ${s.si+1} 關</div>
        <h2 class="pop">${s.st.title.split('　')[1]}</h2>
        <div class="how">${s.st.hint}</div>
        <div class="lad">${[...LAD[s.st.id], '揭曉'].map((t,i)=>`<span>${i+1}. ${t}</span>`).join('')}</div>`;
    if (s.type === 'q') {
      const n = LAD[s.q.stage].length;
      el.innerHTML = `<div class="card">${Array.from({length:n},(_,i)=>`<img src="${img(s.q.id+'_'+i)}" alt="">`).join('')}</div>
        <div class="side">
          <span class="chip">第 ${s.n+1} 題／5</span>
          <div class="ask">這是什麼菜？</div>
          <div class="lv"></div>
          <div class="name fade" hidden>${s.q.name}</div>
          <div class="tip">猜不出來？按下一步看更多</div>
        </div>`;
    }
    if (s.type === 'talk') el.innerHTML = `<div class="card"><img src="${revealImg(s.q)}" alt=""></div>
        <div class="txt"><span class="chip amber">聊聊看</span>
          <div class="nm">${s.q.name}</div>
          <div class="ask">${s.q.chat}</div></div>`;
    if (s.type === 'end') el.innerHTML = `<h2>菜籃裝滿了！今天認識 ${Q.length} 種菜</h2>
        <div class="grid">${Q.map(q=>`<div class="cell"><div class="card"><img src="${revealImg(q)}" alt=""></div><b>${q.name}</b></div>`).join('')}</div>
        <div class="endrow"><div class="thanks">哪一種，是你家餐桌最常出現的？</div>
          <button class="homebtn" id="btnHome">🏠 回到主畫面</button></div>`;
    return el;
  }
  const wrap = $('#slides');
  slides.forEach(s => { s.el = render(s); wrap.appendChild(s.el); });

  /* ---------- 狀態 ---------- */
  let cur = 0, step = 0;
  try { const sv = JSON.parse(localStorage.getItem('veg-guess-pos')||'null'); if (sv && sv.cur < slides.length) cur = sv.cur; } catch(e){}
  const qs = new URLSearchParams(location.search);
  if (qs.get('slide')) { cur = Math.min(slides.length-1, +qs.get('slide')|0); step = Math.min(slides[cur].steps-1, +(qs.get('step')||0)|0); }

  // 菜籃數＝已揭曉題數（往回翻也正確）
  function basketCount(){
    let c = 0;
    for (let i = 0; i < cur; i++) if (slides[i].type === 'q') c++;
    const s = slides[cur]; if (s.type === 'q' && step === s.steps - 1) c++;
    return c;
  }
  let lastCount = -1;
  function show(fly){
    slides.forEach((s,i)=> s.el.classList.toggle('on', i===cur));
    const s = slides[cur];
    closeChoice(); clearFly();
    if (s.type === 'q') {
      const imgs = s.el.querySelectorAll('.card img');
      imgs.forEach((im,i)=> im.classList.toggle('on', i===Math.min(step, imgs.length-1)));
      const done = step === s.steps - 1;
      s.el.querySelector('.name').hidden = !done;
      s.el.querySelector('.ask').textContent = done ? '答案是' : '這是什麼菜？';
      s.el.querySelector('.tip').hidden = done;
      s.el.querySelector('.tip').textContent = step === s.steps - 2 ? '看清楚了嗎？按下一步看答案' : '猜不出來？按下一步看更多';
      s.el.querySelector('.lv').innerHTML = done ? '' : `線索 <b>${step+1}</b>／${s.steps-1}：${LAD[s.q.stage][step]}`;
      if (done && fly) flyToBasket(s);
    }
    const inGame = !['cover','howto'].includes(s.type);
    $('#basket').hidden = !inGame || s.type === 'end';
    const c = basketCount(); $('#bcount').textContent = `${c}／${Q.length}`; lastCount = c;
    $('#btnChoice').style.visibility = (s.type === 'q' && step < s.steps - 1) ? 'visible' : 'hidden';
    let txt = '', dots = '';
    if (s.st) txt = s.st.title.replace('　',' · ');
    if (s.type === 'q') dots = `<span class="dots">${Array.from({length:s.steps},(_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('')}</span>`;
    $('#prog').innerHTML = `<span>${txt}</span>${dots}`;
    try { localStorage.setItem('veg-guess-pos', JSON.stringify({cur})); } catch(e){}
  }
  let flyTimers = [];
  function clearFly(){ flyTimers.forEach(clearTimeout); flyTimers = []; document.querySelectorAll('.fly').forEach(f=>f.remove()); }
  // 揭曉後停 0.8 秒，小縮圖從圖卡右下角飛進菜籃（座標一律換算成舞台座標）
  function flyToBasket(s){
    const stage = $('#stage'), sr = stage.getBoundingClientRect(), sc = sr.width / stage.offsetWidth;
    const toStage = r => ({x:(r.left - sr.left)/sc, y:(r.top - sr.top)/sc, w:r.width/sc, h:r.height/sc});
    const c = toStage(s.el.querySelector('.card').getBoundingClientRect()), b = toStage($('#basket').getBoundingClientRect());
    const f = document.createElement('div'); f.className = 'fly';
    f.innerHTML = `<img src="${revealImg(s.q)}" alt="">`;
    Object.assign(f.style, {left:(c.x + c.w - 300)+'px', top:(c.y + c.h - 200)+'px', width:'300px', height:'200px', opacity:0});
    stage.appendChild(f);
    flyTimers.push(setTimeout(()=>{ f.style.opacity = 1; }, 800));
    flyTimers.push(setTimeout(()=>{ Object.assign(f.style, {left:(b.x + b.w/2 - 60)+'px', top:(b.y + 10)+'px', width:'120px', height:'80px', opacity:.3}); }, 1300));
    flyTimers.push(setTimeout(()=>{ f.remove(); const bk = $('#basket'); bk.classList.remove('bump'); void bk.offsetWidth; bk.classList.add('bump'); }, 2250));
  }
  function next(){
    const s = slides[cur];
    if (step < s.steps - 1) step++; else if (cur < slides.length - 1) { cur++; step = 0; }
    show(true);
  }
  function prev(){
    if (step > 0) step--; else if (cur > 0) { cur--; step = 0; }
    show(false);
  }
  function goto(i){ cur = i; step = 0; closeMenu(); show(false); }

  /* ---------- 二選一（正解左右位置依題號固定交錯） ---------- */
  const choice = $('#choice');
  function openChoice(){
    const s = slides[cur]; if (s.type !== 'q' || step === s.steps - 1) return;
    const a = {name:s.q.name, src: revealImg(s.q)}, b = {name:s.q.alt, src: img('alt_'+ALT[s.q.alt])};
    const pair = s.qi % 2 ? [b, a] : [a, b];
    $('#opts').innerHTML = pair.map((o,i)=>`<div class="opt"><div class="card"><img src="${o.src}" alt=""></div><div class="lab"><i>${i+1}</i>${o.name}</div></div>`).join('');
    choice.classList.add('show');
  }
  function closeChoice(){ choice.classList.remove('show'); }
  choice.addEventListener('pointerup', e => { e.stopPropagation(); closeChoice(); });

  /* ---------- 目錄 ---------- */
  const menu = $('#menu');
  $('#menuCols').innerHTML = ST.map(st => `<div><h3>${st.title.replace('　',' ')}</h3>${
    Q.filter(q=>q.stage===st.id).map(q=>{ const idx = slides.findIndex(s=>s.type==='q' && s.q===q);
      return `<button data-go="${idx}"><img src="${revealImg(q)}" alt="">${q.name}</button>`; }).join('')}</div>`).join('');
  $('#menuCols').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goto(+b.dataset.go); });
  $('#menuCover').onclick = ()=> goto(0);
  $('#btnHome').addEventListener('pointerup', e => { e.stopPropagation(); goto(0); });
  $('#menuHow').onclick = ()=> goto(1);
  $('#menuClose').onclick = closeMenu;
  function openMenu(){ menu.classList.add('show'); }
  function closeMenu(){ menu.classList.remove('show'); }
  menu.addEventListener('pointerup', e => { e.stopPropagation(); if (e.target === menu) closeMenu(); });

  function full(){
    const d = document.documentElement;
    if (!document.fullscreenElement) (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);
    else (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
  }

  /* ---------- 輸入 ---------- */
  $('#btnChoice').addEventListener('pointerup', e => { e.stopPropagation(); choice.classList.contains('show') ? closeChoice() : openChoice(); });
  $('#btnMenu').addEventListener('pointerup', e => { e.stopPropagation(); openMenu(); });
  $('#btnFull').addEventListener('pointerup', e => { e.stopPropagation(); full(); });
  document.addEventListener('keydown', e => {
    if (menu.classList.contains('show')) { if (['Escape','m','M'].includes(e.key)) closeMenu(); return; }
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'Enter': case 'PageDown': case 'ArrowDown': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'PageUp': case 'ArrowUp': case 'Backspace': e.preventDefault(); prev(); break;
      case '2': case 'c': case 'C': choice.classList.contains('show') ? closeChoice() : openChoice(); break;
      case 'Escape': closeChoice(); break;
      case 'm': case 'M': openMenu(); break;
      case 'f': case 'F': full(); break;
      case 'Home': goto(0); break;
      case 'End': goto(slides.length-1); break;
    }
  });
  const stage = $('#stage');
  let tx = null;
  stage.addEventListener('pointerdown', e => { tx = e.clientX; });
  stage.addEventListener('pointerup', e => {
    if (e.target.closest('#tools') || e.target.closest('#menu') || e.target.closest('#choice') || e.target.closest('.homebtn')) return;
    if (tx !== null && Math.abs(e.clientX - tx) > 60) { (e.clientX < tx) ? next() : prev(); tx = null; return; }
    tx = null;
    const r = stage.getBoundingClientRect();
    ((e.clientX - r.left) / r.width < 0.15) ? prev() : next();
  });

  /* ---------- 等比縮放（橫 1920×1080／直 1080×H） ---------- */
  function fit(){
    const portrait = innerHeight > innerWidth;
    stage.classList.toggle('portrait', portrait);
    const W = portrait ? 1080 : 1920;
    const H = portrait ? Math.min(2400, Math.max(1440, Math.round(1080 * innerHeight / innerWidth))) : 1080;
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    const s = Math.min(innerWidth/W, innerHeight/H);
    stage.style.transform = `scale(${s})`;
    stage.style.marginLeft = ((innerWidth - W*s)/2) + 'px';
    stage.style.marginTop = ((innerHeight - H*s)/2) + 'px';
  }
  addEventListener('resize', fit); addEventListener('orientationchange', ()=>setTimeout(fit,150)); fit();
  show(false);
})();
</script>
